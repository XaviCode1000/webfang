[workspace]
resolver = "2"
members = [
    "crates/webfang_core",
    "crates/webfang_ai",
    "crates/webfang_mcp",
    "crates/webfang_cli",
    "crates/webfang_test_utils",
    "crates/webfang_benchmark",
]
exclude = ["fuzz"]

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["GazaDev"]
repository = "https://github.com/XaviCode1000/webfang"
homepage = "https://github.com/XaviCode1000/webfang"

[workspace.dependencies]
# Internal crates
webfang_core = { path = "crates/webfang_core" }
webfang_ai = { path = "crates/webfang_ai" }
webfang_mcp = { path = "crates/webfang_mcp" }
webfang_cli = { path = "crates/webfang_cli" }
webfang_test_utils = { path = "crates/webfang_test_utils" }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# HTTP & Networking
wreq = { version = "6.0.0-rc.28", features = ["gzip", "brotli", "stream", "json", "cookies"] }
wreq-util = { version = "3.0.0-rc.10", features = ["emulation"] }
bytes = "1"

# Content Extraction
legible = "0.4"
htmd = "0.5"
strsim = "0.11"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTML Parsing
scraper = "0.27"
lol_html = "2"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"

# Utilities
url = { version = "2", features = ["serde"] }
percent-encoding = "2"
globset = "0.4"
futures = "0.3"
regex = "1"
heck = "0.5"
sha2 = "0.10"
rand = "0.9"
dirs = "5"
num_cpus = "1"
once_cell = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# HTML to Markdown
html-to-markdown-rs = ">=2.3, <2.21"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }

# XML
quick-xml = "0.41"

# Rate limiting
governor = "0.6"
dashmap = "6"
ahash = { version = "0.8", features = ["std"] }

# Thread pool channels
crossbeam-channel = "0.5"

# Observability
indicatif = { version = "0.17", features = ["improved_unicode"] }

# tokio-console
console-subscriber = "0.4"

# SQLite persistence
rusqlite = { version = "0.31", features = ["bundled", "chrono", "uuid"] }
deadpool-sqlite = "0.8"
sys-info = "0.9"

# Observability
tracing-tree = "0.4"

# MIME detection

# AI features
tokenizers = "0.21"
unicode-segmentation = "1.12"
smallvec = "1.13"
wide = "0.7"
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "download-binaries", "copy-dylibs", "tls-native"] }
hf-hub = { version = "0.5", default-features = false, features = ["tokio", "rustls-tls"] }

# MCP features
rmcp = { version = "1.7", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit", "timeout"] }
schemars = "1.0"

# CLI
clap = { version = "4", features = ["derive", "env"] }
nonzero_ext = "0.3"

# Competitive Features
crc32fast = "1"
robotstxt = "0.3"
secrecy = { version = "0.8", features = ["serde"] }
url-normalize = "0.1.1"

# Misc
sysinfo = "0.30"
aho-corasick = "1"
pulldown-cmark = "0.13"
whatlang = "0.18"
walkdir = "2"
fs2 = "0.4"
libc = "0.2"
async-compression = { version = "0.4.41", features = ["tokio", "gzip", "deflate", "brotli", "zstd"] }

# Browser automation (CDP)
chromiumoxide = { version = "0.7", features = ["tokio-runtime"] }

# Dev dependencies
assert_cmd = "2"
predicates = "3"
tempfile = "3"
wiremock = "0.6"
proptest = "1.6"
insta = { version = "1", features = ["redactions", "filters"] }
serial_test = "3"
loom = "0.7"
    
[workspace.lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(tokio_unstable)", "cfg(loom)"] }
unsafe_code = "deny"

[workspace.lints.clippy]

[profile.dev]
opt-level = 0
# debug level is governed by .cargo/config.toml (line-tables-only);
# full debuginfo per-invocation: CARGO_PROFILE_DEV_DEBUG=true cargo build

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
debug = true
strip = false

[profile.core]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
