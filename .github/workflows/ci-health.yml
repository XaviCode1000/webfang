# CI Health Observer (auditoría webfang W-01..W-08) — SHIPS DORMANT.
#
# Workflow SEPARADO y solo-observador: NO toca ci.yml, bug-discovery.yml ni
# benches.yml. No compila, no testea, solo lee el estado de los otros
# workflows vía API y abre/actualiza/cierra tracking issues idempotentes.
#
# Por qué existe (auditoría 2026-09-18):
#   W-01: el job `notify` de ci.yml usa `if: failure()` / `if: success()` a
#     nivel de step (su propio estado), nunca abre el tracking issue
#     "Scheduled CI failed on main" aunque el schedule lleve 10+ semanas rojo.
#     Ese es un título HISTÓRICO y ya retirado: ver RETIRED_TITLE_CI abajo.
#   W-02: `CI Gate` no incluye miri* en su `needs:` → verde con 3 jobs en
#     failure. Este observer mira los JOBS reales, no el gate.
#   W-03/W-04: Bug Discovery recoge un test #[ignore] "kept RED by design"
#     (rojo permanente) y no crea issues. Este observer lo clasifica como
#     falso-positivo-conocido y lo reporta sin ruido.
#   W-05: Benches muere con exit 143/SIGTERM durante la compilación (la causa
#     entonces era el crate de IA, eliminado en ADR-0004 paso 6).
#   W-08: 0 watchers → sin este observer nadie se entera.
#
# Diseño:
#   - Trigger `workflow_run` (completed) sobre CI, Production Bug Discovery y
#     Benches + `schedule` diario 07:00 UTC como red de seguridad (si el
#     evento workflow_run se pierde) + `workflow_dispatch` manual.
#   - Alcance (#1714): sólo se observa CI de la LÍNEA PRINCIPAL. La condición
#     que decide está en el `if:` del job `observe` y se evalúa contra el
#     ORIGEN y la RAMA de la CORRIDA OBSERVADA, nunca contra los de este
#     workflow. Antes era:
#
#       github.ref == main || github.ref == develop || event_name == workflow_run
#
#     y las dos primeras cláusulas NO filtraban nada en la ruta `workflow_run`:
#     en ese evento GITHUB_REF es la rama por defecto del repo, así que la
#     primera ya era cierta para TODA corrida observada — 11 de las últimas 20
#     observadas eran `pull_request` de feature branches, y 9 issues históricas
#     de este observer salieron de ahí (#1657, #1660, #1663, #1671, #1675,
#     #1685, #1686, #1699, #1705). La tercera cláusula (la que la issue
#     señalaba) era redundante en el caso bueno; la que de verdad dejaba pasar
#     todo era la primera. Por eso el filtro nuevo NO puede mirar `github.ref`
#     en esa ruta: tiene que mirar el payload.
#
#     Predicado de alcance (una sola fuente de verdad por ruta):
#       evento workflow_run -> en alcance <=> head_branch ∈ {main, develop}
#                                         ∧ event ≠ pull_request
#       cualquier otro      -> en alcance <=> github.ref ∈ {main, develop}
#     Un PR mergeado dispara el `push` a su rama destino, así que la cobertura
#     de la línea principal NO se pierde: lo que se pierde es la duplicación de
#     un rojo que GitHub ya muestra en la pestaña del PR (y que, si el PR está
#     rojo, tampoco sobrevive al merge a main). El barrido diario tiene su
#     propia copia del predicado, dentro de `reconcile_one` — se evalúa sobre
#     la corrida QUE EL BARRIDO LEE, no sobre la que lo disparó.
#   - Idempotente: UNA issue por CLAVE (títulos abajo), un comentario por run
#     fallido, auto-cierre al volver a verde. El ORIGEN sigue dentro del
#     título (#1712: dos causas distintas no pueden caer en la misma issue y
#     taparse), pero el CIERRE matchea un SUBTÍTULO del título
#     ("CI failed on main"), de modo que una corrida verde CUALQUIERA retira
#     TODOS los trackers con clave CI — los de cada origen y los que
#     quedaron bajo el título retirado (#2162, #1980). Con el título
#     constante anterior (`Scheduled ...` para todo) cualquier verde cerraba
#     cualquier rojo.
#   - El ORIGEN del run es parte de la clave, no una línea del cuerpo. Es lo
#     único que impide que dos causas distintas caigan en la misma issue y se
#     tapen entre sí; por eso se lee del payload y no se supone.
#   - Etiquetas: `ci-health` + `automated`. Nunca toca issues sin `ci-health`.
#
# Convention: repo pins actions by tag, so this file follows tags, not SHAs.

name: CI Health Observer

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["CI", "Production Bug Discovery", "Benches"]
    types: [completed]
  schedule:
    - cron: "0 7 * * *" # Diario 07:00 UTC, tras Bug Discovery (06:00)
  workflow_dispatch:
    inputs:
      backfill:
        description: "Reconcile open tracking issues against latest runs"
        required: false
        default: "false"
      days:
        description: "Days of history for queue-wait metrics (#2284, queue-metrics job)"
        required: false
        default: "7"

concurrency:
  group: ci-health-${{ github.ref }}
  cancel-in-progress: false # never drop a tracking update mid-write

permissions:
  actions: read # listar runs y jobs de los workflows observados
  issues: write # abrir/comentar/cerrar SOLO issues con label ci-health
  contents: read

env:
  LABEL: ci-health
  LABEL_AUTO: automated
  LABEL_KNOWN_FP: known-false-positive
  # Test marcado "kept RED by design / never run in CI" (W-03).
  KNOWN_RED_TEST: sitemap_entry_max_pages_truncates_many_url_fixture
  # El título NO es decoración: es la CLAVE de lookup. Cada abrir, comentar y
  # CERRAR hace `gh issue list --search "<título> in:title"`, así que la clave
  # decide qué issue se abre y — sobre todo — qué issue cierra un run verde.
  # Un título constante que decía "Scheduled" para un rojo de `push` (y para
  # los runs de `pull_request` en ramas de feature, que son la mayoría) era una
  # mentira, y convertía cada verde en un cierre cruzado (#1712).
  #
  # {origin} se sustituye en runtime en el paso "Classify run origin". El
  # espacio a ambos lados del placeholder NO es decorativo: la búsqueda real
  # `in:title` trata cada palabra como un término (AND), y el origen tiene que
  # caer como término PROPIO para que `(push)` no pueda encontrar `(schedule)`.
  # Orígenes con nombre: push | schedule | pull_request | workflow_dispatch.
  # Cualquier otro valor de la API cae en `other`: conjunto cerrado y acotado,
  # para que la clave no crezca con cada evento que GitHub añada, y para que un
  # origen inesperado siga siendo visible en un título en vez de diluirse.
  TITLE_CI: "CI failed on main ({origin}) [ci-health]"
  # ── CLAVE DE CIERRE: un SUBTÍTULO del título (#2162, #1980) ───────────────
  # "CI failed on main" es un subtítulo de las DOS claves con clave CI:
  #   - "CI failed on main ({origin}) [ci-health]"  (la que abre este observer)
  #   - "Scheduled CI failed on main [ci-health]"    (la clave RETIRADA)
  # Por eso el CIERRE usa esta clave y no el título completo: UNA sola
  # implementación (close_mine en scripts/ci-health-close.sh) retira TODOS los
  # trackers con clave CI, sin un segundo camino de cierre y sin una corrida
  # `workflow_dispatch` verde a mano para desencolar un tracker.
  #
  # El ORIGEN sigue en el TÍTULO porque es lo que distingue dos causas
  # mientras están rojas (#1712); no está en la clave de cierre porque un
  # verde de la línea principal dice que la línea está verde, venga del
  # origen que venga. La búsqueda real `in:title` ANDa palabras, y "CI failed
  # on main" es un subconjunto de las palabras de los dos títulos: por eso
  # los encuentra a los dos.
  CI_CLOSE_KEY: "CI failed on main"
  # ── Clave RETIRADA (#1712 paso 3, REVISADA por #2162, #1980) ──────────────
  # Antes: TITLE_CI = "Scheduled CI failed on main [ci-health]", constante.
  # Ese título ya no se abre. Se conserva la constante porque es la clave
  # histórica de los trackers abiertos antes de la migración, y el paso
  # "Reconcile" la DETECTA.
  # REVISADA: la decisión anterior ("detect, never close") convertía a #1980
  # en un dead end — nada podía cerrar un tracker abierto bajo esa clave. La
  # clave de cierre de arriba ("CI failed on main") es un subtítulo de este
  # título, así que la MISMA implementación de cierre los retira con la
  # próxima corrida verde de CI. Lo que queda por hacer es detectar y
  # avisar: si un tracker sigue abierto bajo la clave retirada, es que
  # todavía no corrió un CI verde desde que se abrió.
  RETIRED_TITLE_CI: "Scheduled CI failed on main [ci-health]"
  TITLE_DISCOVERY: "Bug Discovery findings [ci-health]"
  TITLE_BENCH: "Benches nightly failing [ci-health]"

jobs:
  observe:
    name: Observe and reconcile tracking issues
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # ── SCOPE GATE (#1714) ───────────────────────────────────────────────────
    # Predicado (única fuente de verdad de la ruta evento):
    #   workflow_run -> head_branch ∈ {main, develop} ∧ event ≠ pull_request
    #   otro evento  -> github.ref ∈ {refs/heads/main, refs/heads/develop}
    # En la ruta workflow_run `github.ref` es la rama por defecto del repo
    # (GitHub la pone ahí para este evento), así que un gate basado en
    # `github.ref` deja pasar TODA corrida observada: por eso el predicado
    # mira el payload de la corrida observada, no el de este workflow.
    #
    # DECIDIDO: el job se reporta `skipped`, no `success`.
    #   - `skipped`: el job no arranca. Es el significado nativo de "esta
    #     corrida no es de tu alcance", el conclusion del workflow queda
    #     neutro (nunca un verde falso sobre trabajo hecho) y el filtro es UN
    #     booleano auditable en un solo lugar: un paso nuevo que se añada
    #     después sigue debajo del gate, así que no puede reintroducir el
    #     ruido por descuido.
    #   - `success` (aceptar el evento y salir temprano en un paso) se
    #     descartó a propósito: obligaría a que CADA paso posterior quedara
    #     condicionado al output del paso que se niega a actuar, y el "no
    #     hice nada" se volvería indistinguible de "revisé y no encontré nada"
    #     — que es exactamente el modo de fallo que escondió #1712 y #1633.
    #     El coste de `skipped` es que no queda log del descarte; se acepta
    #     porque el skip es visible en la UI del workflow y el barrido diario
    #     (schedule) no pasa por acá.
    if: >-
      ${{
        (
          github.event_name == 'workflow_run'
          && github.event.workflow_run.event != 'pull_request'
          && (
            github.event.workflow_run.head_branch == 'main'
            || github.event.workflow_run.head_branch == 'develop'
          )
        ) || (
          github.event_name != 'workflow_run'
          && (
            github.ref == 'refs/heads/main'
            || github.ref == 'refs/heads/develop'
          )
        )
      }}
    steps:
      # The upsert/reconcile steps source scripts/ci-health-close.sh from the
      # repo tree. Without a checkout $GITHUB_WORKSPACE is empty on the
      # workflow_run path and the step dies with "No such file or directory"
      # (see issue #1508). Pinned to the same commit as the other workflows
      # (SHA pin convention from #1505); persist-credentials: false.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      - name: Ensure tracking labels exist (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh label create "$LABEL" --color "0E8A16" --description "Auto-managed by CI Health Observer" 2>/dev/null || true
          gh label create "$LABEL_AUTO" --color "BFD4F2" --description "Created by automation" 2>/dev/null || true
          gh label create "$LABEL_KNOWN_FP" --color "FBCA04" --description "Known false positive, kept RED by design" 2>/dev/null || true

      - name: Resolve triggering run
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PAYLOAD_WORKFLOW: ${{ github.event.workflow_run.name }}
          PAYLOAD_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          PAYLOAD_ID: ${{ github.event.workflow_run.id }}
          PAYLOAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PAYLOAD_RUN_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME:-main}"
          echo "event=$EVENT branch=$BRANCH"
          {
            echo "branch=$BRANCH"
            echo "mode=event"
          } >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "workflow_run" ]; then
            {
              echo "workflow=$PAYLOAD_WORKFLOW"
              echo "conclusion=$PAYLOAD_CONCLUSION"
              echo "run_id=$PAYLOAD_ID"
              echo "run_branch=$PAYLOAD_BRANCH"
              echo "run_event=$PAYLOAD_RUN_EVENT"
            } >> "$GITHUB_OUTPUT"
            echo "Observed $PAYLOAD_WORKFLOW #$PAYLOAD_ID -> $PAYLOAD_CONCLUSION (branch $PAYLOAD_BRANCH, event $PAYLOAD_RUN_EVENT)"
            exit 0
          fi
          echo "mode=reconcile" >> "$GITHUB_OUTPUT"
          for WF in "CI" "Production Bug Discovery" "Benches"; do
            CONCLUSION="$(gh run list --workflow "$WF" --branch "$BRANCH" --limit 1 --json conclusion --jq '.[0].conclusion // "unknown"')"
            RUNID="$(gh run list --workflow "$WF" --branch "$BRANCH" --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            # `event` of the run itself (#1712). The sweep does NOT cause these
            # runs, so it must not guess their origin — it reads it. Without
            # this the reconcile path could only ever say "scheduled", which is
            # how #1675 got closed as a sweep for a run that was a push.
            RUN_EVENT="$(gh run list --workflow "$WF" --branch "$BRANCH" --limit 1 --json event --jq '.[0].event // "unknown"')"
            KEY="$(echo "$WF" | tr -cd '[:alnum:]')"
            {
              echo "${KEY}_conclusion=$CONCLUSION"
              echo "${KEY}_run=$RUNID"
              echo "${KEY}_event=$RUN_EVENT"
            } >> "$GITHUB_OUTPUT"
            echo "$WF -> $CONCLUSION ($RUN_EVENT, #$RUNID)"
          done

      # The origin is the tracking key (#1712). Runs for every trigger, because
      # both paths need it: the event path and the reconcile path.
      - name: Classify run origin (tracking key, #1712)
        id: origin
        env:
          EVENT: ${{ github.event_name }}
          PAYLOAD_RUN_EVENT: ${{ github.event.workflow_run.event }}
          LATEST_CI_EVENT: ${{ steps.src.outputs.CI_event }}
        run: |
          set -euo pipefail
          # Two paths, and only one of them gets to be certain:
          #  - workflow_run: the payload states the origin of the run that just
          #    finished. That is a fact about the run, not an inference.
          #  - schedule / workflow_dispatch: this observer did NOT cause the
          #    runs it looks at, so it must not claim their origin; it reads
          #    `event` from the run (resolve step above). If that field ever
          #    comes back empty, the honest answer is "other", not "schedule".
          case "$EVENT" in
            workflow_run)
              raw="$PAYLOAD_RUN_EVENT"
              via="observed directly, the completed run's own workflow_run event"
              ;;
            schedule)
              raw="$LATEST_CI_EVENT"
              via="observed indirectly, the 07:00 UTC sweep read the latest CI run instead of causing it"
              ;;
            *)
              raw="$LATEST_CI_EVENT"
              via="observed indirectly, a manual workflow_dispatch read the latest CI run instead of causing it"
              ;;
          esac
          # Bounded key space: four named origins + `other`. An unbounded
          # `f"TITLE_CI_{raw}"` would let GitHub's event vocabulary grow the
          # key space one issue at a time; the whitelist keeps it at 5 and
          # still names the ones an operator acts on differently.
          case "$raw" in
            push|schedule|pull_request|workflow_dispatch) origin="$raw" ;;
            *) origin="other" ;;
          esac
          # An origin-blind template is the #1712 bug wearing a new hat: every
          # origin would land on ONE key again. Refuse to run rather than
          # quietly collapse them.
          case "$TITLE_CI" in
            *"{origin}"*) ;;
            *)
              echo "FATAL: TITLE_CI carries no {origin} placeholder; every origin would share one key (#1712)." >&2
              exit 1
              ;;
          esac
          title="$(printf '%s' "$TITLE_CI" | sed "s|{origin}|$origin|")"
          # An unsubstituted placeholder reaching an issue title would be a
          # silent, permanent key collision: fail the step instead.
          case "$title" in
            *"{"* | *"}"*)
              echo "FATAL: unresolved origin placeholder in title: $title" >&2
              exit 1
              ;;
          esac
          {
            echo "ci_origin=$origin"
            echo "ci_title=$title"
            echo "note=$via"
          } >> "$GITHUB_OUTPUT"
          echo "origin=$origin key=$title"

      - name: Fetch failed jobs of triggering run
        id: jobs
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          JOBS_JSON="$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100" --jq '[.jobs[] | {name, conclusion}]')"
          echo "$JOBS_JSON" | jq .
          FAILED="$(echo "$JOBS_JSON" | jq -r '[.[] | select(.conclusion != "success" and .conclusion != "skipped") | .name] | join(",")')"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "failed_jobs=$FAILED"

      - name: Classify Bug Discovery result (W-03 known RED vs real finding)
        id: classify
        # Skipped (not failed) when the trigger wasn't Bug Discovery: KNOWN_ONLY
        # stays empty and the CI/Benches branches ignore it. `failure()` would
        # be wrong here (W-01 lesson): it reflects THIS job's own state.
        if: github.event.workflow_run.name == 'Production Bug Discovery'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # A FAILURE LINE, not a mention of the test name (#2233).
          # The Bug Discovery workflow prints its own nextest filter, and
          # that filter CONTAINS the known RED test name, so grepping the
          # NAME over the whole log matched EVERY run: known_only was always
          # true and every real finding was filed as "Known FP only (W-03)".
          # The failure line of `cargo nextest` has this shape (the same one
          # the Bug Discovery workflow greps for in "Publish failure names"):
          #   FAIL [   0.010s] <binary> <test_path>::<test_name>
          # so the known RED counts as known ONLY when that line is there.
          FAILURE_LINE_RE="(^|[^[:alnum:]_])FAIL[[:space:]]+\[[^]]*\][[:space:]]+.*${KNOWN_RED_TEST}"
          LOG_SNIPPET="$(gh run view "$RUN_ID" --log 2>/dev/null | grep -E "$FAILURE_LINE_RE" || true)"
          if [ -n "$LOG_SNIPPET" ]; then
            echo "known_only=true" >> "$GITHUB_OUTPUT"
            echo "W-03 known RED failure line seen; known-false-positive."
          else
            echo "known_only=false" >> "$GITHUB_OUTPUT"
            echo "Real or unclassified finding (or log unavailable)."
          fi

      - name: Upsert tracking issue for triggering run
        # Scope is already decided by the job gate above: this step can only
        # ever see a run whose head_branch is main/develop and whose event is
        # not pull_request. It is NOT re-checked here on purpose — a second
        # copy of the predicate would be a second thing to drift (#1714 closed
        # the event path at the gate, and the harness pins that gate's shape).
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PAYLOAD_WORKFLOW: ${{ github.event.workflow_run.name }}
          PAYLOAD_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          PAYLOAD_ID: ${{ github.event.workflow_run.id }}
          FAILED_JOBS: ${{ steps.jobs.outputs.failed }}
          KNOWN_ONLY: ${{ steps.classify.outputs.known_only }}
          CI_TITLE: ${{ steps.origin.outputs.ci_title }}
          CI_ORIGIN: ${{ steps.origin.outputs.ci_origin }}
          OBS_NOTE: ${{ steps.origin.outputs.note }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . "$GITHUB_WORKSPACE/scripts/ci-health-close.sh"
          SERVER="${GITHUB_SERVER_URL:-https://github.com}"
          RUN_URL="$SERVER/$GH_REPO/actions/runs/$PAYLOAD_ID"
          # open_or_comment <title> <context> <extra> <xlabel>
          #   title   = tracking key. For CI it is origin-qualified, so a red
          #             push and a red sweep are two issues and a green run
          #             only ever closes its own origin (#1712).
          #   context = the line that makes the issue self-describing: WHICH
          #             kind of failure this is and how the observer heard
          #             about it. Every call site passes a non-empty one, so
          #             the body shape never varies; "" renders a blank
          #             paragraph, not a missing heading.
          #   extra   = source-specific detail.
          #   xlabel  = optional extra label.
          open_or_comment() {
            title="$1"; context="$2"; extra="$3"; xlabel="$4"
            count="$(gh issue list --state open --search "${title} in:title" --json number --jq 'length')"
            if [ "$count" -eq 0 ]; then
              body="$(printf '%s\n\n%s\n\nRun: %s\n\n%s\n\nAuto-managed by CI Health Observer.' "$title" "$context" "$RUN_URL" "$extra")"
              if [ -n "$xlabel" ]; then
                gh issue create --title "$title" --body "$body" --label "$LABEL" --label "$LABEL_AUTO" --label "$xlabel"
              else
                gh issue create --title "$title" --body "$body" --label "$LABEL" --label "$LABEL_AUTO"
              fi
            else
              number="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number')"
              gh issue comment "$number" --body "$(printf 'Still failing: %s\n\n%s\n\n%s' "$RUN_URL" "$context" "$extra")"
              if [ -n "$xlabel" ]; then
                gh issue edit "$number" --add-label "$xlabel"
              fi
            fi
          }
          # Shared close semantics: close_mine is sourced from
          # scripts/ci-health-close.sh above (single implementation).
          # Guard: cancelled/skipped/stale runs are noise (e.g. a push run
          # superseded by the next push). Only `failure` opens/comments and
          # only `success` closes; anything else exits silently (see #1472).
          if [ "$PAYLOAD_CONCLUSION" != "failure" ] && [ "$PAYLOAD_CONCLUSION" != "success" ]; then
            echo "Conclusion=$PAYLOAD_CONCLUSION: no action (not failure/success)."
            exit 0
          fi
          case "$PAYLOAD_WORKFLOW" in
            "CI")
              # Key carries the origin; the body states it in words. Both come
              # from the run, never from an assumption about this workflow's
              # own trigger (#1712).
              ci_context="Run origin: $CI_ORIGIN ($OBS_NOTE)."
              if [ "$PAYLOAD_CONCLUSION" = "success" ]; then
                # Close by SUBTITLE (#2162, #1980): the close key is a
                # subtitle of every CI-keyed title, so ONE green run retires
                # the origin-qualified trackers AND the ones left under the
                # retired title. One implementation (close_mine), no second
                # close path.
                close_mine "$CI_CLOSE_KEY" "$RUN_URL"
              else
                open_or_comment "$CI_TITLE" "$ci_context" "Failed jobs: ${FAILED_JOBS:-unknown}. Gate may be green (W-02)." ""
              fi
              ;;
            "Production Bug Discovery")
              if [ "$PAYLOAD_CONCLUSION" = "success" ]; then
                close_mine "$TITLE_DISCOVERY" "$RUN_URL"
              elif [ "$KNOWN_ONLY" = "true" ]; then
                open_or_comment "$TITLE_DISCOVERY" "Source: Production Bug Discovery, $OBS_NOTE." "Known FP only (W-03): $KNOWN_RED_TEST kept RED by design." "$LABEL_KNOWN_FP"
              else
                open_or_comment "$TITLE_DISCOVERY" "Source: Production Bug Discovery, $OBS_NOTE." "Findings to triage (W-04). Failed: ${FAILED_JOBS:-unknown}." ""
              fi
              ;;
            "Benches")
              if [ "$PAYLOAD_CONCLUSION" = "success" ]; then
                close_mine "$TITLE_BENCH" "$RUN_URL"
              else
                open_or_comment "$TITLE_BENCH" "Source: Benches, $OBS_NOTE." "Nightly failing (W-05, exit 143?). Failed: ${FAILED_JOBS:-unknown}." ""
              fi
              ;;
          esac

      - name: Reconcile from latest runs (schedule safety net)
        if: github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ steps.src.outputs.branch }}
          CI_C: ${{ steps.src.outputs.CI_conclusion }}
          CI_R: ${{ steps.src.outputs.CI_run }}
          PD_C: ${{ steps.src.outputs.ProductionBugDiscovery_conclusion }}
          PD_R: ${{ steps.src.outputs.ProductionBugDiscovery_run }}
          BE_C: ${{ steps.src.outputs.Benches_conclusion }}
          BE_R: ${{ steps.src.outputs.Benches_run }}
          CI_E: ${{ steps.src.outputs.CI_event }}
          PD_E: ${{ steps.src.outputs.ProductionBugDiscovery_event }}
          BE_E: ${{ steps.src.outputs.Benches_event }}
          CI_TITLE: ${{ steps.origin.outputs.ci_title }}
          CI_ORIGIN: ${{ steps.origin.outputs.ci_origin }}
          OBS_NOTE: ${{ steps.origin.outputs.note }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . "$GITHUB_WORKSPACE/scripts/ci-health-close.sh"
          SERVER="${GITHUB_SERVER_URL:-https://github.com}"
          reconcile_one() {
            # open_key  = the title this source OPENS under (the origin-
            #             qualified key for CI, the single key for the others)
            # close_key = the key this source CLOSES with. For CI it is the
            #             SUBTITLE ("CI failed on main"), so one green run
            #             retires every CI-keyed tracker, the origin ones and
            #             the retired-title ones (#2162, #1980). For the
            #             others it is the same title they open under.
            open_key="$1"; close_key="$2"; concl="$3"; rid="$4"; wname="$5"; context="$6"; run_event="$7"
            # SCOPE GATE, sweep path (#1714) — el mismo predicado del `if:` del
            # job, aplicado a la corrida SOBRE LA QUE el sweep va a actuar. El
            # sweep no causó esa corrida, así que tiene que releer su `event`
            # y no suponerlo: `gh run list --branch main` devuelve la última
            # corrida de CI cuyo head_branch sea `main`, y eso incluye las
            # corridas de `pull_request` de un PR abierto desde una rama
            # llamada `main` (caso normal en un fork). Sin este guard el
            # barrido reintroduce por la puerta de atrás lo que el gate de
            # arriba acaba de cerrar. Se aplica a las TRES fuentes, no sólo a
            # CI: la regla es "una corrida de PR no genera issue de este
            # observer", y no depende de qué workflow la produjo.
            #
            # Cierra también por el mismo motivo: un verde de PR no es la
            # señal verde de la línea principal.
            if [ "$run_event" = "pull_request" ]; then
              echo "$wname: latest run on $BRANCH is a pull_request run — out of scope, no issue opened and none closed (#1714)."
              return 0
            fi
            url="$SERVER/$GH_REPO/actions/runs/$rid"
            if [ "$concl" = "success" ]; then
              # Close by the CLOSE key: for CI it is the subtitle that covers
              # every CI-keyed tracker (#2162, #1980); for the other sources
              # it is the same key they open under. One implementation.
              close_mine "$close_key" "$url"
            elif [ "$concl" = "failure" ]; then
              count="$(gh issue list --state open --search "${open_key} in:title" --json number --jq 'length')"
              if [ "$count" -eq 0 ]; then
                gh issue create --title "$open_key" --body "$(printf '%s\n\n%s\n\nRun: %s\n\nReconciled latest %s on %s.\n\nAuto-managed by CI Health Observer.' "$open_key" "$context" "$url" "$wname" "$BRANCH")" --label "$LABEL" --label "$LABEL_AUTO"
              fi
            else
              # reconcile: only `failure` opens, only `success` closes.
              # `cancelled` (superseded push) / unknown = no action (#1472).
              echo "$wname: conclusion=$concl, no action."
            fi
          }
          # CI OPENS under the origin-qualified key the classify step derived
          # from the latest CI run's own `event`, and CLOSES under the
          # subtitle key (one green run retires every CI-keyed tracker).
          # Bug Discovery and Benches keep their single-key titles: one run
          # per source, no origin dimension that an operator would act on
          # differently.
          reconcile_one "$CI_TITLE" "$CI_CLOSE_KEY" "$CI_C" "$CI_R" "CI" "Run origin: $CI_ORIGIN ($OBS_NOTE)." "$CI_E"
          reconcile_one "$TITLE_DISCOVERY" "$TITLE_DISCOVERY" "$PD_C" "$PD_R" "Bug Discovery" "Source: Production Bug Discovery, $OBS_NOTE." "$PD_E"
          reconcile_one "$TITLE_BENCH" "$TITLE_BENCH" "$BE_C" "$BE_R" "Benches" "Source: Benches, $OBS_NOTE." "$BE_E"

          # Migration watcher for the retired key (#1712, revised by #2162).
          # READ-ONLY on purpose: the observer does not OPEN that key any
          # more, and it is NOT a dead end either — the CI close key
          # ("CI failed on main") is a subtitle of the retired title, so the
          # next green CI run retires those trackers with the same close
          # implementation. What this reports is trackers that are still
          # open, i.e. no green CI run has happened since they were opened.
          RETIRED_OPEN="$(gh issue list --state open --search "${RETIRED_TITLE_CI} in:title" --json number --jq '.[].number' 2>/dev/null || true)"
          if [ -n "$RETIRED_OPEN" ]; then
            echo "WARNING: open issue(s) under the RETIRED title (${RETIRED_TITLE_CI}): ${RETIRED_OPEN//$'\n'/, }"
            echo "  The observer no longer opens that key, but the CI close key covers it:"
            echo "  the next green CI run retires them (no manual action needed)."
          fi


  # ── Queue-wait metrics (#2284) ─────────────────────────────────────────────
  # Read-only measurement of how long work waits BEFORE it starts running:
  # workflow queue wait (startedAt − createdAt), per-job queue wait and the
  # macOS lane. Published into $GITHUB_STEP_SUMMARY. The numbers are the
  # before/after evidence for the queue-knob proposal (#2284): measure first,
  # move the merge-queue knobs only with data.
  #
  # Schedule + manual dispatch ONLY: on the workflow_run path this would run
  # the metric's API walk on every CI completion for numbers nobody asked
  # for. The observer job above owns that path.
  queue-metrics:
    name: Queue-wait metrics (workflow + job + macOS lane)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'workflow_run'
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      - name: Measure queue waits and publish summary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DAYS: ${{ inputs.days || '7' }}
        run: |
          set -euo pipefail
          # fail-closed accounting: the script exits 0 with per-source
          # counters even when gh fails or payloads are unparseable; the
          # accounting lines in the summary make a degraded run visible.
          OUT="$(bash scripts/ci_queue_metrics.sh --days "$DAYS")"
          {
            echo "## Queue-wait metrics (last $DAYS days)"
            echo ""
            echo "$OUT"
            echo ""
            echo "Measured by scripts/ci_queue_metrics.sh for #2284."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$OUT"
