# Release-plz — automated version bump + CHANGELOG + Release PR + v* tags.
#
# Flow: push to main -> release-plz-release pushes the `v{{ version }}` tag
# for an already-merged version bump, which triggers release.yml (binaries +
# GitHub Release). The Release PR itself is created MANUALLY (see #1339):
# the release-plz-pr job cannot open one, see the note on that job below.
#
# Config: release-plz.toml + cliff.toml. No registry publishing (git_only).

name: Release-plz

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Publish already-merged release commits: pushes the v* tag.
  # Tag push triggers release.yml for binaries + GitHub Release.
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'XaviCode1000' }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # actions/checkout does NOT fetch tags by default (fetch-tags: false)
          # even with fetch-depth: 0. release-plz git_only mode needs the v* tags
          # for version detection - without them every package is treated as an
          # initial release (observed on the first automated run).
          fetch-tags: true
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # KNOWN ISSUE (webfang#1337): this job fails whenever there is something to
  # release. In git_only mode release-plz runs `cargo package --allow-dirty
  # --workspace` in a worktree at the last release tag, and our inter-crate deps
  # are { path, version } on crates that are never published (binaries-only), so
  # crates.io resolution can never succeed. Manual Release PRs are the operating
  # convention (see #1339) until release-plz supports skipping the packaging step.
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'XaviCode1000' }}
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # actions/checkout does NOT fetch tags by default (fetch-tags: false)
          # even with fetch-depth: 0. release-plz git_only mode needs the v* tags
          # for version detection - without them every package is treated as an
          # initial release (observed on the first automated run).
          fetch-tags: true
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
