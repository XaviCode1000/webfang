# Release-plz — automated version bump + CHANGELOG + Release PR + v* tags.
#
# Flow: push to main -> release-plz-release pushes the `v{{ version }}` tag for
# an already-merged version bump -> that tag push fires release.yml's
# `push: tags` trigger NATIVELY, which builds the binaries and publishes the
# GitHub Release. One hand-off path, no dispatcher in between.
#
# The tag push triggers release.yml BY ITSELF. Both release-plz jobs mint a
# GitHub App token (RELEASE_PLZ_APP_ID + RELEASE_PLZ_APP_PRIVATE_KEY), and
# GitHub only suppresses workflow runs for events generated with GITHUB_TOKEN —
# so App-pushed tags fire `push: tags` like any human push. That is why there
# is no `dispatch-release` job in this file: with the native push trigger live,
# an explicit workflow_dispatch hand-off would run release.yml TWICE per
# release (the sweep resolves in seconds, the builds take minutes, and there
# is no concurrency group to collapse them).
#
# History: under GITHUB_TOKEN the same tags never fired `push: tags`
# (suppression), so the hand-off used to be an explicit workflow_dispatch call
# plus a daily sweep — v2.1.0 shipped its binaries only via a MANUAL dispatch,
# and v2.1.1 ended with a tag and no Release at all. That suppression no longer
# applies to this pipeline; do not reintroduce a dispatch job alongside
# App-token tag pushes.
#
# `release-reconcile.yml` remains the daily backstop: a push trigger that never
# fires is silent by construction (no run to observe), so the scheduled sweep
# over the shared trust predicate still catches any tag left without binaries.
#
# Config: release-plz.toml + cliff.toml. No registry publishing (git_only).

name: Release-plz

on:
  push:
    branches:
      - main

# SC-03/SC-21 (issue #1607): the workflow-level `contents: write` +
# `pull-requests: write` block is GONE. It was the widest grant in the file and
# it was inherited by every job, so a job that needed only `contents: read` ran
# with write anyway: workflow-level permissions are the DEFAULT for a job whose
# own `permissions:` omits a scope, never a floor. Every job below now declares
# its own block, so each grant is visible at the job that uses it and a future
# job added without a `permissions:` key gets the repository default (none)
# instead of silently inheriting write.
#
# `release-plz-release` also lost its `pull-requests: read`: it runs
# `release-plz release` in git_only mode with `git_release_enable = false`, so
# the tag push is its entire product and it reads no pull request. Reading more
# than the step uses is still a grant, and a grant nobody asked for is the thing
# this change is removing.

env:
  CARGO_TERM_COLOR: always

jobs:
  # Publish already-merged release commits: pushes the v* tag.
  # That tag push fires release.yml's `push: tags` trigger natively — the tag
  # is pushed with a GitHub App token, and GitHub only suppresses runs for
  # GITHUB_TOKEN-generated events. No dispatch job: one hand-off path.
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'XaviCode1000' }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          # actions/checkout does NOT fetch tags by default (fetch-tags: false)
          # even with fetch-depth: 0. release-plz git_only mode needs the v* tags
          # for version detection - without them every package is treated as an
          # initial release (observed on the first automated run).
          fetch-tags: true
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      # App token (slice 2 of the App migration): tags pushed with GITHUB_TOKEN
      # never deliver `push: tags` events, so release.yml used to need an
      # explicit workflow_dispatch hand-off. Minted from
      # RELEASE_PLZ_APP_ID (Client ID — `client-id` is canonical in
      # create-github-app-token v3) + RELEASE_PLZ_APP_PRIVATE_KEY, scoped to
      # contents write ONLY — this job never opens PRs, so it gets no
      # pull-requests scope (least privilege, mirroring the release-pr job).
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
      # The duplicate-tag 422 (webfang#1341) makes `release-plz release` exit 1
      # AFTER it has created the correct tag, inside the SAME run — measured on
      # v2.1.1, where the tag is authored by this bot at 18:04:23, inside the run
      # window 18:03:58-18:04:43. With git_only + publish=false +
      # git_release_enable=false (release-plz.toml), the tag IS the entire product
      # of this job, so the outcome is decided by VERIFYING that tag — not by the
      # exit code of a command whose only side effect is that tag.
      #
      # This is NOT the `continue-on-error` pattern removed in webfang#1476. There,
      # the job reported success with NOTHING re-evaluating the failure. Here the
      # failure is re-evaluated by the step right below, which fails the job on
      # anything that is not a verified correct tag. Green means verified tag.
      - name: Run release-plz
        id: release
        continue-on-error: true
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
      # The decision lives in scripts/verify-release-tag.sh: it is testable there
      # (a bash block embedded in YAML is not), and it keeps the trust predicate in
      # one place. It fails the job on anything that is not a verified correct tag.
      - name: Verify the release tag
        env:
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
        run: bash scripts/verify-release-tag.sh

  # Release PR generator. Re-enabled after upstream release-plz 0.3.168 shipped
  # #3058 ("reconstruct git-only releases without creating crate archives"),
  # merged upstream 2026-09-17 — the exact step that made this job
  # structurally unsatisfiable (webfang#1387/#1337): in git_only mode the
  # next-version determination ran `cargo package --workspace` in a worktree at
  # the last `v*` tag, and our inter-crate deps are { path, version } on crates
  # that are never published (binaries-only), so crates.io resolution could
  # never succeed.
  #
  # Verified 2026-09-18 with CLI 0.3.168 against a clone of main: next-version
  # determination completed for all 6 packages (2.1.0 → 2.1.1) with zero
  # `cargo package` invocation.
  #
  # Both jobs pin the action by commit SHA
  # (`release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5` = v0.5.139).
  # The previous pin was the annotated TAG OBJECT of floating `v0.5`, which
  # peels to this same commit — same bytes, but unresolvable via the commits
  # API and confusing to audit (verified via `gh api`).
  # The CLI version is NOT "latest": it comes from that pin's `version` input
  # default — 0.3.169 as of 2026-09 (includes upstream release-plz #3058, the
  # git_only fix noted above). Bumping the CLI therefore requires either
  # updating the SHA pin or passing an explicit `version:` input; it does not
  # float to latest on its own.
  #
  # `continue-on-error` is deliberately GONE (webfang#1476): while it was set,
  # the job reported `completed/success` over a logged
  # `##[error]Process completed with exit code 1` (run 35063811850) — it removed
  # the failure signal AND kept the green, which is worse than a red job.
  #
  # Ordered after release-plz-release (webfang#1546): the two jobs used to run
  # in parallel, so on a Release PR merge this job checked out BEFORE the sibling
  # job created the new v* tag, computed the next bump against stale state, and
  # opened a phantom Release PR (webfang#1545: tag v2.3.1 at 14:31:04, phantom
  # #1545 at 14:31:12 with an empty v2.3.1..main range). Same shape as closed
  # #1531. On ordinary merges the release job is a verified no-op
  # (verify-release-tag.sh exits 0), so this only serializes the checkout.
  # always() + not-cancelled mirrors dispatch-release: a failed release job may
  # still leave a correct tag (duplicate-tag 422, #1341) that the PR generator
  # should see; a human cancel must not become a green PR update.
  release-plz-pr:
    name: Release-plz PR
    needs: [release-plz-release]
    runs-on: ubuntu-latest
    if: >-
      ${{
        always() &&
        needs.release-plz-release.result != 'cancelled' &&
        github.repository_owner == 'XaviCode1000'
      }}
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          # actions/checkout does NOT fetch tags by default (fetch-tags: false)
          # even with fetch-depth: 0. release-plz git_only mode needs the v* tags
          # for version detection - without them every package is treated as an
          # initial release (observed on the first automated run).
          fetch-tags: true
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      # App token (full migration, slice 2 closed #1205): PRs opened with
      # GITHUB_TOKEN never deliver pull_request events, so Release PR checks
      # sat in action_required until a human-token rerun (#1228). Minted from
      # RELEASE_PLZ_APP_ID (Client ID — `client-id` is canonical in
      # create-github-app-token v3) + RELEASE_PLZ_APP_PRIVATE_KEY, scoped to
      # contents + pull-requests write like upstream does.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Run release-plz
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
