# Release automation — the tag pusher.
#
# Flow: a Release PR (version bump + CHANGELOG, produced locally by
# scripts/cut-release.sh) merges to main -> release-plz-release pushes the
# `v{{ version }}` tag -> release.yml builds the 4 binaries + SHA256SUMS and
# publishes the GitHub Release.
#
# There is NO `release-pr` job in this file, on purpose — see the note at the
# end of this file, and webfang#1387.
#
# Config: release-plz.toml + cliff.toml. No registry publishing (git_only).

name: Release-plz

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Publish already-merged release commits: pushes the v* tag.
  # Tag push triggers release.yml for binaries + GitHub Release.
  #
  # This job is the half of release-plz that WORKS: `command: release` never goes
  # through the `cargo package` path that makes `release-pr` unsatisfiable (see
  # the note at the end of this file). Verified on v2.1.0, where the hand-cut
  # Release PR #1339 merged and this job pushed the tag. Keep it.
  #
  # One known wart, deliberately not touched here: with a shared `git_tag_name`
  # plus `version_group` it can report a duplicate-tag 422 while the tag itself
  # is correct — tracked as webfang#1341, observable only at the next release.
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'XaviCode1000' }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # actions/checkout does NOT fetch tags by default (fetch-tags: false)
          # even with fetch-depth: 0. release-plz git_only mode needs the v* tags
          # for version detection - without them every package is treated as an
          # initial release (observed on the first automated run).
          fetch-tags: true
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # There is deliberately NO `release-plz-pr` job in this file (webfang#1387).
  #
  # release-plz's `release-pr` command is structurally unsatisfiable for this
  # workspace. In git_only mode it materialises a worktree checked out AT THE
  # LAST `v*` TAG and runs `cargo package --allow-dirty --workspace` there. Our
  # inter-crate deps are { path, version } on crates that are never published
  # (binaries-only distribution), so crates.io resolution can never succeed and
  # the command fails whenever there is anything to release. Verified against
  # release-plz 0.3.165 with local repros: `release=false` does not filter the
  # packaging invocation, and `publish=false` does not make a crate resolvable
  # for its consumers. There is no config to skip the packaging step; the
  # upstream fix is the still-open stack release-plz#3054..#3058, which no
  # released version includes.
  #
  # Why deleted rather than left advisory: the job last shipped with
  # `continue-on-error: true` on its step, which reported `completed/success`
  # over a logged `##[error]Process completed with exit code 1` (run
  # 35063811850). A green job that does nothing is worse than a red one — it
  # removes the signal AND the failure. Measured cost of that shape: 73 commits
  # after v2.1.0 with no Release PR and no route to a release.
  #
  # Produce the Release PR locally instead:
  #   scripts/cut-release.sh X.Y.Z --dry-run && scripts/cut-release.sh X.Y.Z
  # ---------------------------------------------------------------------------
