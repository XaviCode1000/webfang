# ============================================================================
# SUPPORT LINE DRIFT — is .github/support.json still true?
# ============================================================================
# Two jobs, deliberately split by what each one needs:
#
#   support-declaration  ENFORCING. Checks the file against itself: valid
#                        schema, `accepts` coherent with each line's state, at
#                        most two live lines, and SUPPORT.md matching a fresh
#                        render. Needs no git tags, so it is deterministic and
#                        GREEN today — it enforces immediately.
#
#   support-published    ENFORCING. Checks the file against what the repository
#                        actually publishes: the declared STABLE must be the
#                        newest published minor, every tracked minor must be
#                        declared, `latest` must exist as a tag. Needs
#                        `fetch-depth: 0`.
#
# WHY THE MERGE GATE IS NOT THIS JOB
# This workflow is path-filtered on the support surface. A path-filtered
# workflow never reports on PRs outside the filter, so GitHub would hold those
# PRs "pending" forever the moment this job became a required context. The
# merge gate therefore lives in `Validate PR metadata` (pr-validation.yml),
# which is already required and runs on every PR and merge_group; it invokes
# `scripts/check_support_drift.sh --scope=published` directly. This job keeps
# the post-merge half: release-plz pushes a tag to main after the PR merges,
# and that tag can stale support.json with no PR to catch it.
#
# HISTORY (#1676): this job shipped ADVISORY because main was drifted at the
# time — support.json declared 2.1 STABLE while 2.2-2.11 were published.
# Making it hard then meant shipping a permanently RED check, which is how
# guards get ignored. The backfill (#2003) closed that gap, so the advisory
# arm is gone and the rationale that justified it is gone with it.
#
# Why its own workflow file and not ci.yml: ci.yml is edited by several
# sibling worktrees in this repo, and a dedicated file keeps this gate small,
# tag-only and instant (~5s, no toolchain, no cargo) instead of a lane of the
# 6m34s pipeline.
#
# Triggers: every PR touching the support governance surface, pushes to main,
# and manual dispatch.
name: Support Drift

on:
  pull_request:
    paths:
      - ".github/support.json"
      - "SUPPORT.md"
      - ".github/workflows/support-drift.yml"
      - "scripts/check_support_drift.sh"
      - "scripts/render-support-md.sh"
      - "scripts/rotate-stable.sh"
      - "scripts/eol-line.sh"
      - "scripts/cut-support-branch.sh"
      - "scripts/bump-support-patch.sh"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: support-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  support-declaration:
    name: Support declaration (enforcing)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: support.json + SUPPORT.md coherence
        run: scripts/check_support_drift.sh --scope=declared

      - name: Script lint (the gate must itself be sound)
        run: shellcheck scripts/check_support_drift.sh scripts/render-support-md.sh

      - name: Harness for the gate
        run: scripts/test_support_drift.sh

  support-published:
    name: Support drift vs published tags (enforcing)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth: 0 — the check refuses a shallow clone on purpose (a guard
      # that cannot see the tags must not pass), so it has to be able to see them.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: support.json vs git tags
        run: scripts/check_support_drift.sh --scope=published
