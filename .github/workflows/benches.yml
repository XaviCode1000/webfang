# Nightly benchmark suite (issue #958)
#
# Runs all 9 criterion benches wired in crates/webfang_core/Cargo.toml:
# cosine_similarity, export, html_conversion, link_extraction,
# readability, sitemap_parsing, url_parsing, waf_detection,
# tracing_overhead.
#
# This workflow is NOT required and NEVER blocks PRs or merges:
#   - schedule: nightly reference run on consistent GitHub runners
#   - workflow_dispatch: manual run for baseline refreshes
#
# Results are uploaded as artifacts (criterion reports) so baselines can be
# compared across nightly runs. Baseline document: benches/BASELINES.md.
#
# NOTE: GitHub-hosted runners are not precision lab hardware. Numbers are for
# regression TREND detection between runs on the same runner image, not
# absolute microarchitecture claims.

name: Benches

on:
  schedule:
    # Nightly 04:30 UTC. Offset from mutants/sanitizers (both Mon 03:00 UTC)
    # and from top-of-the-hour scheduler congestion (review finding, PR #959).
    - cron: "30 4 * * *"
  workflow_dispatch:

concurrency:
  group: benches-${{ github.ref }}
  cancel-in-progress: false # never kill a nightly mid-measurement

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  bench:
    name: Criterion suite

    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Free disk like ci.yml fmt job: unstripped bench profile + BoringSSL
      # C++ build + criterion data need headroom on stock runners.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker rmi "$(docker images -q)" 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87

      # NOTE: deliberately NO Swatinem/rust-cache here (review finding,
      # PR #959). Repo Actions-cache usage is at the ~10 GB eviction
      # threshold; a fresh multi-GB bench-profile cache every night would
      # evict CI/PR caches and cause cross-workflow rebuild thrash.
      #
      # The old note here claimed the cold compile "fits comfortably in the
      # timeout-minutes budget". It did not: the compile was being killed at
      # ~5 min, far inside a 60-min budget, so the budget was never the
      # binding constraint (#1913). The compile shrank instead — see the
      # profile change in Cargo.toml and the package scoping on both cargo
      # bench steps below. If a cache is ever reintroduced it has to respect
      # the #1165/#1171 pool policy, not just fit on disk.

      # Diagnostics BEFORE the compile gate (issue #1524): the fleet
      # preempts runners with SIGTERM during the cold compile (exit 143),
      # so recording the environment first means the next preemption
      # leaves data instead of a blind log. Rerun a red night with:
      #   gh run rerun <run-id> --failed
      - name: Record runner environment
        run: |
          {
            echo "## Runner environment"
            echo '```'
            rustc --version
            grep -m1 "model name" /proc/cpuinfo || true
            nproc
            free -h | head -2 || true
            df -h / | tail -1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Derive the bench scope from the manifests; never hardcode it (#1913).
      #
      # `cargo bench -p X` is an ALLOW-LIST, not a filter: a `[[bench]]` target
      # declared by a crate outside a hardcoded list is neither built nor run,
      # `cargo` still exits 0, and the nightly reports green with the coverage
      # silently gone. Deriving the list from the manifests makes it incapable of
      # going stale, and it also removes the duplicated literal both cargo steps
      # used to carry.
      #
      # Unscoped, `cargo bench` additionally builds webfang_cli, webfang_mcp and
      # webfang_benchmark and then uses nothing from them: pure extra cold-compile
      # surface on a runner that already gets SIGTERM-killed during the compile
      # window. That cost is what scoping removes.
      #
      # Fails closed: an empty scope means no crate declares a bench target, which
      # is never the expected state, and falling back to a full-workspace build
      # would silently undo the fix.
      - name: Derive bench package scope
        run: |
          set -euo pipefail
          scope="$(python3 scripts/derive-bench-scope.py)"
          echo "Bench scope: $scope"
          echo "BENCH_SCOPE=$scope" >> "$GITHUB_ENV"

      # Compile gate first: a broken bench fails here with a clear signal
      # instead of mid-measurement.
      #
      # `$BENCH_SCOPE` is a multi-token fragment, so it is expanded through an
      # array rather than unquoted: correctness here should not depend on the
      # derive script only ever emitting safe tokens.
      - name: Compile gate (cargo bench --no-run)
        run: |
          read -ra scope <<< "$BENCH_SCOPE"
          cargo bench "${scope[@]}" --no-run --locked

      - name: Run full criterion suite
        run: |
          read -ra scope <<< "$BENCH_SCOPE"
          cargo bench "${scope[@]}" --locked

      - name: Summarize results
        if: always()
        run: |
          if [ -d target/criterion ]; then
            echo "## Benchmark summary" >> "$GITHUB_STEP_SUMMARY"
            {
              echo '```'
              find target/criterion -name 'estimates.json' | while read -r f; do
                dir=$(dirname "$f")
                name=${dir#target/criterion/}
                name=${name%/new}
                mean=$(python3 -c "import json;print(json.load(open('$f'))['mean']['point_estimate'])" 2>/dev/null || echo "?")
                echo "$name mean=$mean ns"
              done
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload criterion reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: criterion-reports-${{ github.run_id }}
          path: target/criterion
          retention-days: 30
          if-no-files-found: warn
