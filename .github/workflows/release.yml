# Release Pipeline — Automated binary builds on version tags
#
# Triggers when a tag like v1.2.0 is pushed.
# Builds for Linux (x86_64, aarch64), macOS (x86_64, aarch64), Windows (x86_64).
# Creates a GitHub Release with all binaries attached.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v1.2.0)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_LTO: "fat"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"

jobs:
  # ============================================================================
  # PREFLIGHT: Resolve release channel + verify Cargo.toml matches the tag.
  # Runs before any build so a bad tag fails fast instead of burning 4
  # platform builds. Covers tags from main, release/X.Y and support/X.Y:
  # release.yml is tag-triggered and branch-agnostic by design.
  # ============================================================================
  preflight:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.channel.outputs.prerelease }}
    steps:
      # Pin the checkout to the tag being released. On workflow_dispatch the
      # default checkout resolves to the ref the run was started from (a branch),
      # so without this the preflight would validate main instead of the tag.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - name: Resolve release channel
        id: channel
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [[ "$TAG" =~ -rc\.[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::tag $TAG no matchea ni release ni RC" >&2
            exit 1
          fi
      - name: Verify Cargo.toml matches tag
        # Valid on every trigger now that the checkout is pinned to the tag: TAG
        # resolves from the dispatch input when present, and from the pushed tag
        # ref otherwise. It used to be push-only because workflow_dispatch
        # checked out a branch, which made the comparison meaningless.
        # `github.event.inputs.tag`, not the bare `inputs` context: this file also
        # runs on `push`, and every existing tag/input read here already uses the
        # github.event form (see steps.channel and the release job).
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          TAG_VERSION="${TAG#v}"; TAG_VERSION="${TAG_VERSION%-rc.*}"
          CARGO_VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          [[ "$TAG_VERSION" == "$CARGO_VERSION" ]] || {
            echo "::error::${TAG} no coincide con Cargo.toml (${CARGO_VERSION})" >&2; exit 1; }

  # ============================================================================
  # BUILD: Cross-compile for all platforms
  # ============================================================================
  build:
    needs: [preflight]
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          # x86_64-apple-darwin intentionally NOT built: ONNX Runtime dropped
          # x64 macOS as of 1.24.1, so ort-sys has no prebuilt for it and the
          # `ai` feature cannot link (upstream pykeio/ort#556, closed not_planned).
          # macOS 26 (Tahoe) is also Apple's last Intel release.
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      # Same pin as preflight: build the requested tag, never the default branch.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          # Tag-only saves: manual workflow_dispatch test runs restore the
          # shared pool but never rewrite it, keeping cache budget for CI.
          save-if: ${{ github.ref_type == 'tag' }}

      # Cross-compilation setup for Linux aarch64
      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          # CARGO_TARGET_*_LINKER only picks the Rust linker. btls-sys configures
          # CMake's C/C++ compilers exclusively from CC_<target> / CXX_<target>
          # (build/config.rs: cc = target_only_var("CC"); build/main.rs defines
          # CMAKE_C_COMPILER only when that var is present). Without them CMake
          # builds BoringSSL for the HOST and the cross link dies with
          # "Relocations in generic ELF (EM: 62) ... file in wrong format".
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++"
            # Host `strip` cannot parse an aarch64 ELF (release run
            # 33976276171: "Unable to recognise the format of the input
            # file"). The target-prefixed binutils ship with the
            # already-installed gcc-aarch64-linux-gnu package.
            echo "STRIP=aarch64-linux-gnu-strip"
          } >> "$GITHUB_ENV"

      - name: Build release binary
        # dtolnay/rust-toolchain@1.88.0 (not @stable): the repo pins 1.88.0 via
        # rust-toolchain.toml, which takes precedence over rustup's default
        # toolchain (rustup docs: overrides rank 4 > 5). Installing the cross
        # target on `stable` leaves the pinned toolchain without it ->
        # E0463 "can't find crate for `core`". The @1.88.0 rev installs the
        # target on the SAME toolchain cargo resolves via the toolchain file.
        run: cargo build --release --locked --features "ai mcp" --target ${{ matrix.target }} -p webfang_cli

      - name: Strip binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          # STRIP is set to the target-prefixed binutils only in the
          # cross job; native jobs fall back to host `strip`.
          ${STRIP:-strip} target/${{ matrix.target }}/release/webfang

      - name: Compress (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../webfang-${{ matrix.target }}.tar.gz webfang

      - name: Compress (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../webfang-${{ matrix.target }}.zip webfang.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: webfang-${{ matrix.target }}
          path: webfang-${{ matrix.target }}.*

  # ============================================================================
  # CHECKSUMS: Generate SHA256 for all binaries
  # ============================================================================
  checksums:
    name: Generate checksums
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: webfang-*
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          sha256sum webfang-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v5
        with:
          name: checksums
          path: artifacts/SHA256SUMS.txt

  # ============================================================================
  # RELEASE: Create GitHub Release with all binaries
  # ============================================================================
  release:
    name: Create GitHub Release
    needs: [build, checksums, preflight]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "WebFang ${{ github.event.inputs.tag || github.ref_name }}"
          body: |
            ## What's Changed

            See [CHANGELOG](https://github.com/XaviCode1000/webfang/blob/main/CHANGELOG.md) for details.

            ## Installation

            ### Binary download
            Download the binary for your platform from the assets below.

            ### Cargo
            ```bash
            cargo install webfang --version ${{ github.event.inputs.tag || github.ref_name }}
            ```

            ### From source
            ```bash
            git clone https://github.com/XaviCode1000/webfang
            cd webfang
            cargo build --release --features "ai mcp"
            ```

            ## Verification
            Verify the checksum of your downloaded binary:
            ```bash
            sha256sum -c SHA256SUMS.txt --ignore-missing
            ```
          files: |
            artifacts/webfang-*
            artifacts/SHA256SUMS.txt
          draft: false
          # Channel resolved by preflight: RC tags publish as pre-release,
          # stable tags as full releases. Manual dispatch test runs resolve
          # their channel from the input tag the same way.
          prerelease: ${{ needs.preflight.outputs.prerelease }}
