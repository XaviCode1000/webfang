name: Cut patch tag (manual)

# The ONLY action that creates a tag on support/*. Always manual
# (workflow_dispatch): patch releases are maintainer decisions, never
# reactions to push.
#
# The tag push does NOT trigger release.yml: GitHub suppresses workflow runs for
# GITHUB_TOKEN-generated events, and this workflow pushes the tag with the
# Actions token, so release.yml's `push: tags` trigger never fires here — the
# same restriction that stranded v2.1.1 (#1478). The hand-off is therefore an
# explicit workflow_dispatch below, the pattern release-plz.yml uses.
# release.yml's preflight re-verifies Cargo.toml == tag as defense in depth.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "support/X.Y"
        required: true
        type: string
      version:
        description: "X.Y.Z (sin v)"
        required: true
        type: string

permissions:
  contents: write
  actions: write # required to dispatch release.yml

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.branch }}
          fetch-tags: true
          persist-credentials: false
      - name: Verify contract
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$INPUT_BRANCH" in
            support/*) ;;
            *) echo "::error::solo ramas support/*" >&2; exit 1 ;;
          esac
          [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::versión X.Y.Z" >&2; exit 1; }
          git rev-parse "v$INPUT_VERSION" >/dev/null 2>&1 && { echo "::error::tag ya existe" >&2; exit 1; }
          CARGO_VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          [[ "$CARGO_VERSION" == "$INPUT_VERSION" ]] || {
            echo "::error::bump el commit primero: Cargo.toml=${CARGO_VERSION}, pedido=$INPUT_VERSION" >&2; exit 1; }
      - name: Create annotated tag and push (bot identity for L1.1)
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          # Annotated tag with bot identity for L1.1 trust predicate.
          # The message format matches release-plz subject for the fingerprint.
          git -c user.name='github-actions[bot]' -c user.email='bot@github.com' \
            tag -a "v$INPUT_VERSION" -m "chore: Release package webfang_core version $INPUT_VERSION"
          git push origin "v$INPUT_VERSION"
          # Capture the commit SHA for L1 expected_sha (dereference annotated tag)
          EXPECTED_SHA=$(git rev-parse "v$INPUT_VERSION^{commit}")
          echo "EXPECTED_SHA=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
      - name: Dispatch release.yml for the new tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: "v${{ inputs.version }}"
          EXPECTED_SHA: ${{ steps.tag.outputs.EXPECTED_SHA }}
        run: |
          set -euo pipefail
          # Dispatch via workflow_dispatch WITHOUT --ref. release.yml's preflight
          # will re-verify L1.1..L1.3 against the expected_sha input.
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            -f tag="$TAG" \
            -f expected_sha="$EXPECTED_SHA"
          echo "Dispatched release.yml for $TAG with expected_sha=$EXPECTED_SHA"
