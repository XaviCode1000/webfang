name: Cut patch tag (manual)

# The ONLY action that creates a tag on support/*. Always manual
# (workflow_dispatch): patch releases are maintainer decisions, never
# reactions to push.
#
# The tag push does NOT trigger release.yml: GitHub suppresses workflow runs for
# GITHUB_TOKEN-generated events, and this workflow pushes the tag with the
# Actions token, so release.yml's `push: tags` trigger never fires here — the
# same restriction that stranded v2.1.1 (#1478). The hand-off is therefore an
# explicit workflow_dispatch below, the pattern release-plz.yml uses.
# release.yml's preflight re-verifies Cargo.toml == tag as defense in depth.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "support/X.Y"
        required: true
        type: string
      version:
        description: "X.Y.Z (sin v)"
        required: true
        type: string

permissions:
  contents: write
  actions: write # required to dispatch release.yml

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.branch }}
          fetch-tags: true
          persist-credentials: false
      - name: Verify contract
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$INPUT_BRANCH" in
            support/*) ;;
            *) echo "::error::solo ramas support/*" >&2; exit 1 ;;
          esac
          [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::versión X.Y.Z" >&2; exit 1; }
          git rev-parse "v$INPUT_VERSION" >/dev/null 2>&1 && { echo "::error::tag ya existe" >&2; exit 1; }
          CARGO_VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          [[ "$CARGO_VERSION" == "$INPUT_VERSION" ]] || {
            echo "::error::bump el commit primero: Cargo.toml=${CARGO_VERSION}, pedido=$INPUT_VERSION" >&2; exit 1; }
      - name: Tag and push
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          git tag "v$INPUT_VERSION"
          git push origin "v$INPUT_VERSION"
      - name: Dispatch release.yml for the new tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: "v${{ inputs.version }}"
        run: |
          set -euo pipefail
          # --ref pins the run to the tag, so release.yml resolves its version and
          # its Cargo.toml check against the tag rather than against main. The
          # checkout pin in release.yml (ref: github.event.inputs.tag) is the
          # second half of that guarantee — see #1478.
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TAG" \
            -f tag="$TAG"
          echo "Dispatched release.yml for $TAG"
