# CI/CD Pipeline for webfang — Tiered Feedback
#
# Strategy: Tiered pipeline with needs gates.
# Each tier only runs if the previous tier PASSED.
# Developer gets feedback in <30s (toolchain), <60s (fmt), <3min (clippy), <8min (full).
#
# Pipeline flow:
#   toolchain (15s) → fmt (30s) → clippy (2min) → test-core (3min) → test-full (5min)
#   toolchain also runs dead-test detection (scripts/check_dead_tests.sh)
#   test-core runs: unit tests (--lib) then integration/behavioral tests (--test '*')
#   security runs in parallel with tests (no Rust compile)
#   feature-matrix runs after clippy (cargo-hack --each-feature, catches broken feature combos)
#   mcp smoke runs after test-full
#   coverage runs on PRs + dispatch (llvm-cov + Codecov)
#   release runs after all gates pass (main only)
#   miri runs on schedule/dispatch only
#
# Key optimization: single runner = single compilation, single cache.
# Swatinem/rust-cache restores ~300MB of compiled deps on warm runs.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "0 0 * * 1"  # Weekly Miri on Monday 00:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Forces v4 actions (checkout, cache, upload-artifact, codecov) to run on Node 24
  # instead of deprecated Node 20. Remove when all actions migrate to v5+.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # CI optimizations: disable debuginfo + incremental for faster builds
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_DEV_INCREMENTAL: "false"

jobs:
  # ============================================================================
  # TIER 0: TOOLCHAIN GATE (< 30 seconds)
  # Verify the installed Rust version matches rust-version in Cargo.toml.
  # Runs first — catches version drift before any compilation.
  # ============================================================================
  toolchain:
    name: Verify rust-version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check rust-version >= Cargo.toml minimum
        run: |
          REQUIRED=$(grep '^rust-version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          INSTALLED=$(rustc --version | grep -oP '\d+\.\d+\.\d+')
          echo "Minimum required: $REQUIRED"
          echo "Installed: $INSTALLED"
          # Compare major.minor — installed must be >= required
          REQUIRED_M=$(echo "$REQUIRED" | cut -d. -f1)
          REQUIRED_m=$(echo "$REQUIRED" | cut -d. -f2)
          INSTALLED_M=$(echo "$INSTALLED" | cut -d. -f1)
          INSTALLED_m=$(echo "$INSTALLED" | cut -d. -f2)
          if [ "$INSTALLED_M" -gt "$REQUIRED_M" ] || { [ "$INSTALLED_M" -eq "$REQUIRED_M" ] && [ "$INSTALLED_m" -ge "$REQUIRED_m" ]; }; then
            echo "OK: Rust $INSTALLED >= minimum $REQUIRED"
          else
            echo "ERROR: Rust $INSTALLED is below minimum $REQUIRED"
            exit 1
          fi
      # Regression guard for Wave 3 (#402): all tests must be crate-local.
      # Fails if anyone re-adds a .rs file under root tests/ (dead test).
      - name: Dead test detection
        run: bash scripts/check_dead_tests.sh
      # Regression guard for #428: webfang_core is a LIBRARY and must use typed
      # errors (ScraperError/CrawlError/InfraError), never anyhow. anyhow erases
      # the error types the engine needs to distinguish a 403 from a timeout for
      # retry/WAF decisions. Doc-comments may still mention anyhow as prose; this
      # guard only forbids real `use anyhow` imports in library code.
      - name: Forbid anyhow in webfang_core
        run: |
          if grep -rn 'use anyhow' crates/webfang_core/src/ --include='*.rs'; then
            echo "::error::webfang_core must use typed errors, not anyhow (issue #428). See crates/webfang_core/src/error.rs"
            exit 1
          fi
          echo "OK: no anyhow imports in webfang_core/src"
      # Regression guard for #513: inter-crate dependency direction (see
      # AGENTS.md "Inter-crate dependency direction (ENFORCED POLICY)").
      # Fails if any crate depends on a prohibited sibling crate (e.g.
      # webfang_core depending on cli/tui/mcp/ai, or tui on cli).
      - name: Dependency direction gate
        run: bash scripts/check_dependency_direction.sh

  # ============================================================================
  # TIER 1: FORMAT GATE (30-60 seconds)
  # No compilation needed — instant feedback on style.
  # If this fails, NOTHING else runs.
  # ============================================================================
  fmt:
    name: Check formatting
    needs: [toolchain]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Free ~30GB: remove pre-installed Android SDK, .NET, Haskell, CodeQL, Docker images
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker rmi $(docker images -q) 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ============================================================================
  # TIER 2: CLIPPY GATE (2-3 minutes)
  # Compiles once + lints. If this fails, tests don't run.
  # ============================================================================
  clippy:
    name: Clippy (strict)
    needs: [fmt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Complexity ratchet (issue #516): clippy.toml sets
      # cognitive-complexity-threshold=30 and too-many-lines-threshold=100.
      # Enabling these two lints + the existing -D warnings fails the build on
      # any function above those thresholds. DESCENDING ratchet — never raise.
      - run: cargo clippy --all-targets --all-features -- -D warnings -W clippy::cognitive_complexity -W clippy::too_many_lines

  # ============================================================================
  # CODE QUALITY: dead deps + duplication ratchet (issue #516).
  # cargo-machete fails on any unused dependency; check_duplication.sh fails if
  # duplicated lines exceed the committed baseline (a DESCENDING ratchet).
  # ============================================================================
  code-quality:
    name: Code quality (machete + duplication ratchet)
    needs: [clippy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-machete
        run: cargo install cargo-machete --locked --quiet
      - name: Dead dependency gate (cargo-machete)
        run: cargo machete
      - name: Duplication ratchet (jscpd)
        run: bash scripts/check_duplication.sh

  # ============================================================================
  # TIER 3: TEST CORE — Split by category for targeted feedback.
  # Unit tests first (fast), then integration + behavioral (heavier).
  # Gate: must pass before full suite.
  # ============================================================================
  test-core:
    name: Tests (unit + integration + behavioral)
    needs: [clippy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Pre-build test binary
        run: cargo build -p webfang_cli --bin webfang
      - name: Unit tests (lib)
        run: cargo nextest run --lib --test-threads 4 --retries 2
      - name: Integration tests
        run: cargo nextest run --features ui --test '*' --test-threads 4 --retries 2

  # ============================================================================
  # TIER 4: TEST FULL (4-6 minutes)
  # All features enabled. Independent — runs in parallel with test-core.
  # ============================================================================
  test-full:
    name: Tests (all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Cache ONNX model (Granite-97M)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/
          key: onnx-model-${{ runner.os }}-granite-97m-v1
          restore-keys: |
            onnx-model-${{ runner.os }}-granite-97m-
      - name: Download ONNX model (cache miss)
        run: |
          set -e
          MODEL_DIR="$HOME/.cache/huggingface/hub/models--ibm-granite--granite-embedding-97m-multilingual-r2"
          BLOB_SHA="68e592b160673d30250824c1116bc6ab33f70efb22b97c9e1d7ce1e69c1c9d70"
          TOKENIZER_BLOB_SHA="4f2842d568e2724370aec203652a42ac783c7937f8347a1a2cc7506d71f1582f"
          BLOB_FILE="$MODEL_DIR/blobs/$BLOB_SHA"
          TOKENIZER_BLOB_FILE="$MODEL_DIR/blobs/$TOKENIZER_BLOB_SHA"
          SNAPSHOT_DIR="$MODEL_DIR/snapshots/835ad14087e140460703cf0fae09f97d469d65c2"
          SNAPSHOT_FILE="$SNAPSHOT_DIR/onnx/model.onnx"
          SNAPSHOT_TOKENIZER="$SNAPSHOT_DIR/tokenizer.json"
          if [ -f "$SNAPSHOT_FILE" ] || [ -L "$SNAPSHOT_FILE" ]; then
            echo "Model already cached, skipping download"
            exit 0
          fi
          echo "Downloading Granite-97M ONNX model (~372MB)..."
          mkdir -p "$MODEL_DIR/blobs"
          mkdir -p "$SNAPSHOT_DIR/onnx"
          curl -L --fail -o "$BLOB_FILE" \
            "https://huggingface.co/ibm-granite/granite-embedding-97m-multilingual-r2/resolve/main/onnx/model.onnx"
          echo "Verifying model SHA256..."
          echo "$BLOB_SHA  $BLOB_FILE" | sha256sum --check --status
          echo "Downloading tokenizer.json..."
          curl -L --fail -o "$TOKENIZER_BLOB_FILE" \
            "https://huggingface.co/ibm-granite/granite-embedding-97m-multilingual-r2/resolve/main/tokenizer.json"
          echo "Verifying tokenizer SHA256..."
          echo "$TOKENIZER_BLOB_SHA  $TOKENIZER_BLOB_FILE" | sha256sum --check --status
          # Create hf_hub cache structure: refs/main + snapshot symlinks
          mkdir -p "$MODEL_DIR/refs"
          echo "835ad14087e140460703cf0fae09f97d469d65c2" > "$MODEL_DIR/refs/main"
          ln -s "../../../blobs/$BLOB_SHA" "$SNAPSHOT_FILE"
          ln -s "../../blobs/$TOKENIZER_BLOB_SHA" "$SNAPSHOT_TOKENIZER"
          echo "Model + tokenizer downloaded, verified, and cached"
          ls -lh "$BLOB_FILE"
      - name: Pre-build test binary
        run: cargo build -p webfang_cli --bin webfang --all-features
      - run: cargo nextest run --all-features --test-threads 4 --retries 2
      - name: AI integration tests (CLI+AI, MCP+AI)
        run: |
          set -e
          # CLI+AI tests (#[ignore]'d, require model)
          cargo test -p webfang_core --features ai --test behavioral -- \
            --ignored --test-threads=1 2>&1 | tail -5
          # MCP+AI tests (#[ignore]'d, require model)
          cargo test -p webfang_mcp --features mcp,ai --test mcp_behavioral_test -- \
            --ignored --test-threads=1 2>&1 | tail -5

  # ============================================================================
  # SECURITY: No Rust compile — runs in PARALLEL with tests
  # Only needs fmt gate (doesn't depend on compilation).
  # cargo-deny covers advisories via RustSec + licenses + bans + sources.
  # cargo-audit is a redundant second opinion on advisories (belt + suspenders).
  # ============================================================================
  security:
    name: Security Audit
    needs: [fmt]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-deny
      - uses: taiki-e/install-action@cargo-audit
      - name: Advisories + licenses + bans + sources
        run: cargo deny check
      # --ignore flags mirror deny.toml [advisories] ignore list.
      - name: Audit (RustSec, redundant with cargo-deny)
        run: |
          cargo audit \
            --ignore RUSTSEC-2025-0141 \
            --ignore RUSTSEC-2025-0119 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2024-0320 \
            --ignore RUSTSEC-2026-0183 \
            --ignore RUSTSEC-2026-0184 \
            --ignore RUSTSEC-2026-0186 \
            --ignore RUSTSEC-2026-0002 \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195

  # ============================================================================
  # TIER 5: DOC QUALITY — Independent of tests
  # Ensures documentation is complete and doctests compile.
  # Runs in parallel with tests so doc issues surface immediately.
  # ============================================================================
  doc-quality:
    name: Documentation quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Rustdoc (links + missing_docs)
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Doctests
        run: cargo test --doc --workspace --all-features

  # ============================================================================
  # FEATURE MATRIX: cargo-hack checks each feature in isolation (Wave 4, #403).
  # Catches broken feature combinations — e.g. a feature that fails to compile
  # without another, or dead code behind an untested flag. Runs after clippy so
  # already-broken code doesn't burn compute. taiki-e/install-action provides a
  # prebuilt cargo-hack (matches the nextest/llvm-cov/deny pattern, no source build).
  # ============================================================================
  feature-matrix:
    name: Feature matrix
    needs: [clippy]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      - name: Feature matrix check
        run: cargo hack check --each-feature --workspace --no-dev-deps

  # ============================================================================
  # MCP SMOKE: After full tests pass
  # Separate job so MCP failure doesn't block test results.
  # ============================================================================
  mcp:
    name: MCP handshake
    needs: [test-full]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build MCP server
        run: cargo build --example mcp_server --all-features
      - name: Validate MCP handshake
        timeout-minutes: 2
        run: |
          ./target/debug/examples/mcp_server &
          MCP_PID=$!
          for i in $(seq 1 15); do
            if curl -sf --max-time 2 http://127.0.0.1:8080/mcp -X POST \
              -H "Content-Type: application/json" \
              -H "Accept: application/json, text/event-stream" \
              -d '{"jsonrpc":"2.0","method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}},"id":1}' \
              | grep -q "protocolVersion"; then
              echo "MCP server ready"
              kill $MCP_PID 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          kill $MCP_PID 2>/dev/null || true
          echo "MCP server failed to respond after 15 attempts"
          exit 1

  # ============================================================================
  # RELEASE: After ALL gates pass (main only)
  # ============================================================================
  release:
    name: Build Release
    needs: [test-full, security, mcp]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Build optimized binary
        run: cargo build --release --locked --features "ai mcp ui"
      - name: Strip binary
        run: |
          strip target/release/webfang
          ls -lh target/release/webfang
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webfang-linux-x86_64
          path: target/release/webfang
          retention-days: 7

  # ============================================================================
  # SCHEDULED: Miri (UB detection on nightly)
  #
  # Design (three-layer defence):
  #   1. Code level: tests that depend on boring-sys2 FFI (boring2/wreq) or
  #      onig-sys (syntect) use #[cfg_attr(miri, ignore)] or live in
  #      #[cfg(not(miri))] modules. Miri cannot execute C FFI nor inline
  #      assembly (raw-cpuid via quanta/governor).
  #   2. CI safety net: per-submodule skips (--skip wreq_downloader /
  #      obscura_downloader / chromiumoxide_downloader) catch any missed FFI
  #      test, while still allowing the pure-Rust downloader modules
  #      (resource_governor, cookie_bridge, spa_detector, hybrid_router)
  #      to run under Miri (#515).
  #   3. Matrix: tests split into parallel groups so ALL failures surface
  #      in ONE run instead of blocking on the first UB.
  #   4. Sysroot cache: cargo miri setup drops from ~15min to ~2s warm.
  #   5. Tree Borrows: aliasing model that tolerates sound-in-practice patterns
  #      (ahash, dashmap, smallvec) while still detecting real UB.
  #      If a specific test fails under Tree Borrows, isolate it with
  #      #[cfg(not(miri))] — never disable aliasing detection globally.
  # ============================================================================
  miri:
    name: Miri (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      # rust-toolchain.toml pins 1.88.0 and would override the nightly toolchain
      # for `cargo miri` (miri is nightly-only). RUSTUP_TOOLCHAIN (env var) has
      # higher precedence than rust-toolchain.toml, so every cargo invocation in
      # this job uses nightly. `override: true` on dtolnay/rust-toolchain is NOT
      # enough because rust-toolchain.toml beats rustup directory overrides.
      RUSTUP_TOOLCHAIN: nightly
    strategy:
      fail-fast: false
      matrix:
        group: [core, domain, infra-fast, infra-slow]
        include:
          - group: core
            filter: "-- adapters:: application:: cli:: config:: di:: error::"
          - group: domain
            filter: "-- domain::"
          # NOTE: These use positive module filters (-- infrastructure::<module>::)
          # instead of the previous negative filter (-- infrastructure:: --skip X).
          # New modules added to infrastructure:: must be explicitly assigned to one
          # of the two groups below to run under Miri.
          - group: infra-fast
            filter: "-- infrastructure::cpu_pool:: -- infrastructure::stream:: -- infrastructure::error:: -- infrastructure::user_agent:: -- infrastructure::bridge:: -- infrastructure::output:: -- infrastructure::config:: -- infrastructure::autotuning:: -- infrastructure::content_processing:: -- infrastructure::scraper::"
          - group: infra-slow
            # wikilinks/syntax_highlight explicitly skipped — FFI-heavy, can't execute under Miri.
            # downloader: only pure-Rust submodules (cookie_bridge/spa_detector) — FFI (wreq,
            # obscura, chromiumoxide) and sysinfo-dependent (hybrid_router, resource_governor)
            # excluded via --skip below / #[cfg(not(miri))] in their test modules (#515).
            # resource_governor is covered by TSan (sanitizers.yml), where sysconf works.
            filter: "-- infrastructure::crawler:: -- infrastructure::obsidian:: -- infrastructure::export:: -- infrastructure::http:: -- infrastructure::network:: -- infrastructure::converter:: -- infrastructure::downloader::cookie_bridge:: -- infrastructure::downloader::spa_detector:: --skip wikilinks --skip syntax_highlight"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Cache Miri sysroot
        uses: actions/cache@v4
        with:
          path: ~/.cache/miri
          key: miri-sysroot-${{ runner.os }}-2026-07-01
          restore-keys: |
            miri-sysroot-${{ runner.os }}-
      - name: Setup & Run Miri (${{ matrix.group }})
        env:
          # Tree Borrows: aliasing model more permissive than Stacked Borrows.
          # Tolerates sound-in-practice patterns from ahash/dashmap/smallvec/wide,
          # but still detects real aliasing UB (unlike -Zmiri-disable-stacked-borrows).
          # If a third-party crate fails, isolate that test with #[cfg(not(miri))].
          MIRIFLAGS: -Zmiri-tree-borrows -Zmiri-disable-isolation -Zmiri-ignore-leaks -Zmiri-seed=42 -Zmiri-permissive-provenance
        run: |
          cargo miri setup
          # Safety net (#515): skip the FFI/subprocess-heavy AND sysinfo-dependent
          # downloader submodules explicitly instead of the whole `downloader`
          # subtree, so the pure-Rust submodules (cookie_bridge, spa_detector)
          # run under Miri. hybrid_router/resource_governor can't run under Miri
          # (sysconf via sysinfo) and are gated by #[cfg(not(miri))] at test level.
          cargo miri test --lib -- \
            --skip wreq_downloader --skip obscura_downloader --skip chromiumoxide_downloader \
            ${{ matrix.filter }}

  # ============================================================================
  # COVERAGE: PR gate + push-to-main + manual trigger
  # Measures and reports coverage on every PR (Wave 4, #403); uploads to Codecov.
  # Also runs on push to main so the base commit always has a coverage report
  # for PR comparisons (docs.codecov.com/docs/error-reference#missing-base-report).
  # fail_ci_if_error: false — coverage is informational, never blocks the PR.
  # ============================================================================
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [test-full]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info -- --skip test_mcp
      - name: Report coverage
        run: |
          cargo llvm-cov report --lcov | tail -5
          echo "Coverage report generated successfully"
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
