# CI/CD Pipeline for webfang — Tiered Feedback
#
# Strategy: Tiered pipeline with needs gates.
# Each tier only runs if the previous tier PASSED.
# Developer gets feedback in <30s (toolchain), <60s (fmt), <3min (clippy), <8min (full).
#
# Pipeline flow:
#   change-scope (path-aware tier, <15s, no cargo) classifies the PR diff via
#   scripts/ci_path_classifier.sh: docs-only/CI-only PRs skip the expensive
#   compile/test entry points (fmt, clippy, test-core, test-full) while
#   toolchain, repo-guards, security, and doc-quality always run. Full-scope
#   changes (code=true OR all=true) keep the current required producers.
#   toolchain (15s) → fmt (30s) → clippy (2min) → CI Gate aggregates the fast required tier
#   repo-guards (parallel) runs dead-test detection + the other architectural
#   guards + the MCP public-surface version-marker gate + actionlint/shellcheck
#   lint; gate still blocks merge on it.
#   test-core runs: unit tests (--lib) then integration/behavioral tests (--test '*')
#   test-full runs: all features enabled (full workspace compile + test, NO AI inference)
#   security runs in parallel with tests (no Rust compile)
#   feature-matrix runs after clippy (cargo-hack --each-feature, catches broken feature combos)
#   mcp smoke runs after test-full, path-gated on needs_mcp (advisory, never in gate)
#   coverage runs on PRs + dispatch (llvm-cov + Codecov) and remains non-gating
#   release runs after all gates pass (main only)
#   miri runs on schedule/dispatch only
#
# Key optimization: single runner = single compilation, single cache.
#
# Cache Budget Policy (#1171, weights re-measured 2026-09-05, pool 8.05 GB):
#   test-full 1526, test-core 1208, validate 1085, doc-quality 922,
#   feature-matrix 707, mcp 614, release 604, deploy 471, clippy 410,
#   fuzz-build 338, code-quality 123;
#   coverage 1419MB, tokio 569 (all trimmed — non-gate, no live entries).
#   Saves are main-only: PRs restore main's cache lineage and never save,
#   so the pool does not scale with open PRs (verified: zero merge-ref entries).
#   2026-09-05: purged 1.88 GB of tag saves under the malformed ref
#   `refs/heads/refs/tags/v2.0.0` (unrestorable lineage, incl. a duplicated
#   entry). The release.yml tag-save ref that produced them belongs to the
#   release flow — fix it there, not here.
#   #1171 save gating rolls out to the other workflows: fuzz (main+develop),
#   docs + bug-discovery (main-only), release (tag-only).
#   mutants-pr is the documented exception: PR-only hard gate, keeps saving
#   (its write is gated by hotpath-changed).
#   RULE: any NEW rust-cache consumer must justify its GB in the PR and is
#   review-blocked by default (precedent: benches.yml:55-60).
#   Shared-keys measured 2026-09-10: no genuine compile twins among
#   rust-cache consumers (test-core vs test-full differ in features) — no
#   sharing applied.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  merge_group:
  schedule:
    - cron: "0 0 * * 1"  # Weekly Miri on Monday 00:00 UTC
  workflow_dispatch:

concurrency:
  # event_name in the group key: merge_group runs must not cancel (or be
  # canceled by) pull_request runs on the same head branch.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Forces v4 actions (checkout, cache, upload-artifact, codecov) to run on Node 24
  # instead of deprecated Node 20. Remove when all actions migrate to v5+.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # CI optimizations: disable debuginfo + incremental for faster builds
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_DEV_INCREMENTAL: "false"

permissions:
  contents: read

jobs:
  # ============================================================================
  # TIER 0: TOOLCHAIN GATE (< 30 seconds)
  # Verify the installed Rust version matches rust-version in Cargo.toml.
  # Runs first — catches version drift before any compilation.
  # Repo guards live in the parallel `repo-guards` job so a slow lint never
  # blocks the compile tiers (fmt/clippy/test-core/security fan out from here).
  # ============================================================================
  toolchain:
    name: Verify rust-version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - name: Check rust-version >= Cargo.toml minimum
        run: |
          REQUIRED=$(grep '^rust-version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          INSTALLED=$(rustc --version | grep -oP '\d+\.\d+\.\d+')
          echo "Minimum required: $REQUIRED"
          echo "Installed: $INSTALLED"
          # Compare major.minor — installed must be >= required
          REQUIRED_M=$(echo "$REQUIRED" | cut -d. -f1)
          REQUIRED_m=$(echo "$REQUIRED" | cut -d. -f2)
          INSTALLED_M=$(echo "$INSTALLED" | cut -d. -f1)
          INSTALLED_m=$(echo "$INSTALLED" | cut -d. -f2)
          if [ "$INSTALLED_M" -gt "$REQUIRED_M" ] || { [ "$INSTALLED_M" -eq "$REQUIRED_M" ] && [ "$INSTALLED_m" -ge "$REQUIRED_m" ]; }; then
            echo "OK: Rust $INSTALLED >= minimum $REQUIRED"
          else
            echo "ERROR: Rust $INSTALLED is below minimum $REQUIRED"
            exit 1
          fi

  # ============================================================================
  # TIER 0a: CHANGE SCOPE (path-aware, <15s, no cargo/cache/model work)
  # Classifies the changed files via scripts/ci_path_classifier.sh so
  # docs-only/CI-only PRs skip the expensive compile/test entry points
  # (fmt, clippy, test-core, test-full). push/merge_group/schedule/dispatch
  # always default to full scope (run_code_jobs=true + every lane true).
  # Downstream code jobs gate on `needs.change-scope.outputs.run_code_jobs
  # == 'true'`; the affected-area lanes gate the mcp smoke job on
  # needs_mcp (advisory, never in `gate` needs);
  # needs_mutation_hotpath is exposed as an output only (Phase 4 advisory —
  # no job gates on it in this phase, to keep the change non-breaking);
  # snapshot baselines are test expectations and keep test coverage
  # applicable. The `gate` job explicitly allows skipped non-applicable
  # producers only from here.
  # ============================================================================
  change-scope:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run_code_jobs: ${{ steps.scope.outputs.run_code_jobs }}
      needs_ai: ${{ steps.scope.outputs.needs_ai }}
      needs_mcp: ${{ steps.scope.outputs.needs_mcp }}
      needs_mutation_hotpath: ${{ steps.scope.outputs.needs_mutation_hotpath }}
      snapshot_changed: ${{ steps.scope.outputs.snapshot_changed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: scope
        # SC-09 (issue #1607): no GitHub expression expansion inside a `run:`
        # block. The expression engine substitutes BEFORE the shell parses the
        # script, so a value carrying shell metacharacters is spliced in as
        # code, not data.
        # An `env:` var is handed to the shell as an argument instead, so the same
        # bytes stay data no matter what they contain. The SHAs are empty on
        # every non-`pull_request` event, which is exactly what the `if` below
        # needs in order to tell those events apart.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            bash scripts/ci_path_classifier.sh \
              --base "$PR_BASE_SHA" \
              --head "$PR_HEAD_SHA" \
              --format github >> "$GITHUB_OUTPUT"
          else
            {
              echo "docs_only=false"
              echo "ci_only=false"
              echo "code=true"
              echo "all=true"
              echo "affected=all"
              echo "run_code_jobs=true"
              echo "needs_ai=true"
              echo "needs_mcp=true"
              echo "needs_mutation_hotpath=true"
              echo "snapshot_changed=true"
            } >> "$GITHUB_OUTPUT"
            echo "change-scope: event=$EVENT_NAME -> full scope (run_code_jobs=true, needs_ai=true, needs_mcp=true, needs_mutation_hotpath=true, snapshot_changed=true)"
          fi

  # ============================================================================
  # TIER 0b: REPO GUARDS (parallel with the compile tiers)
  # The 6 regression guards + workflow/shell lint, relocated verbatim from the
  # old `toolchain` job. Merge-blocking via the `gate` job's needs (not via
  # the toolchain fan-out), so fmt/clippy/test-core/security start immediately.
  # ============================================================================
  repo-guards:
    name: Repo guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      # The intra-crate lint tool (tools/intra-crate-lint) is a STANDALONE
      # cargo project — excluded from the workspace, so it never touches the
      # product's build graph — but it must be BUILT and TESTED here, or its
      # 23 tests would be inert (the very shape that let the gate's four
      # fail-open defects survive: nothing in CI asserted what the gate
      # decides). The toolchain is the same pinned action the other jobs use.
      # --locked: the tool commits its own Cargo.lock, and a build that
      # re-resolves would make CI depend on the registry's current state.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - name: Build the intra-crate lint tool
        run: cargo build --manifest-path tools/intra-crate-lint/Cargo.toml --locked
      - name: Intra-crate lint tool tests
        run: cargo test --manifest-path tools/intra-crate-lint/Cargo.toml --locked
      # Regression guard for Wave 3 (#402): all tests must be crate-local.
      # Fails if anyone re-adds a .rs file under root tests/ (dead test).
      - name: Dead test detection
        run: bash scripts/check_dead_tests.sh
      # Regression guard for #428: webfang_core is a LIBRARY and must use typed
      # errors (ScraperError/CrawlError/InfraError), never anyhow. anyhow erases
      # the error types the engine needs to distinguish a 403 from a timeout for
      # retry/WAF decisions. Doc-comments may still mention anyhow as prose; this
      # guard only forbids real `use anyhow` imports in library code.
      - name: Forbid anyhow in webfang_core
        run: |
          if grep -rn 'use anyhow' crates/webfang_core/src/ --include='*.rs'; then
            echo "::error::webfang_core must use typed errors, not anyhow (issue #428). See crates/webfang_core/src/error.rs"
            exit 1
          fi
          echo "OK: no anyhow imports in webfang_core/src"
      # Regression guard for #513: inter-crate dependency direction (see
      # AGENTS.md "Inter-crate dependency direction (ENFORCED POLICY)").
      # Fails if any crate depends on a prohibited sibling crate (e.g.
      # webfang_core depending on cli/mcp/ai, or mcp on cli).
      - name: Dependency direction gate
        run: bash scripts/check_dependency_direction.sh
      # Semantics harness for the gate above (#1825): proves on mktemp
      # fixtures that a deliberately introduced forbidden edge fails the
      # gate (negative control), that the [dev-dependencies] tier into
      # webfang_test_utils is accepted, that a [dependencies] edge into the
      # test harness is still rejected, and that the dotted-key form
      # (`webfang_core.workspace = true`) is extracted rather than silently
      # invisible. Offline, no repo state touched.
      - name: Dependency direction gate semantics harness
        run: bash scripts/test_dependency_direction.sh
      # Regression guard for #990 (ADR-0010): intra-crate Clean Architecture
      # layering `infrastructure → adapters → application → domain` (inward only).
      # Fails if `application` imports `infrastructure` etc. (see
      # `scripts/check_intra_crate_direction.sh` and ADR-0010 allowlist).
      # Seed semantics: the publish/clone/recipe contract of the seed chain.
      # These two are offline and fast; `test_seed_clone_modes.sh` stays local
      # because it needs a CoW filesystem (`cp --reflink=always`) and FAILS
      # rather than skips on a non-CoW runner, and
      # `test_seed_contamination.sh` stays manual because it does a real 2.7 G
      # build. The assertions of the first one live in the repo, not only in
      # the audit's local harness.
      - name: Seed publish atomicity semantics harness
        run: bash scripts/test_seed_publish_atomicity.sh
      - name: Seed recipe coherence semantics harness
        run: bash scripts/test_seed_recipe_coherence.sh

      - name: Intra-crate direction gate (strict)
        run: INTRA_CRATE_MODE=strict bash scripts/check_intra_crate_direction.sh
      # The SEMANTICS of the gate above, executed. Before this step existed the
      # gate's own behaviour was pinned by nothing in CI: the four fail-open
      # defects of the gate (audit "scripts fail-open" 2026-10-18, B36-B39) were
      # never caught by a CI run, because no CI step ever asserted what the
      # gate decides — only that it ran. The harness drives the gate over its
      # own fixtures and asserts the DECISIONS (site counts, the fail-closed
      # rows, the lateral blind spot that is deliberately preserved). Offline,
      # no repo state touched.
      - name: Intra-crate direction gate semantics harness
        run: bash scripts/test_intra_crate_direction.sh
      # Regression guard for stabilization-sitemap-regression, re-based by #1328:
      # the ignored-test budget is a frozen baseline (32 rows in
      # docs/test-inventory.md — 26 test attributes + 6 doc/comment mentions),
      # compared PER CATEGORY, so a composition swap with an equal total fails.
      # Any #[ignore] added or fixed without updating the inventory fails here.
      - name: Ignored-test inventory guard
        run: bash scripts/check_ignored_guard.sh
      # Semantics harness for the guard above (#1328): proves on mktemp fixtures
      # that the guard fails on a composition swap whose total matches, that an
      # uncatalogued doc-comment mention fails explained, and that rows keyed by
      # file+test-name survive line drift. Runs the guard against fixtures only.
      - name: Ignored-test guard semantics harness
        run: bash scripts/test_ignored_guard.sh
      # Semantics harness for the Miri UB lane contract (#2235): the lane
      # must REPORT, not abort the process — a lane that aborts leaves no
      # result to act on, which is the dead end this issue closes. The
      # harness pins the four invariants that keep it a detector: no
      # unjustified `--skip` in a Miri job (the skip-net of #1423 deleted a
      # whole test tree per entry and hid the UB inside it), a written
      # reason on every Miri gate (a gate nobody can evaluate is not a
      # gate), the `application::` filter still inside the `Miri (core)`
      # group, and a per-test gate on every test that drives the scrape use
      # case (the servo_arc/lol_html UB of `application/scraper_service.rs`).
      # Offline, pure text over the checked-out tree plus mktemp fixtures:
      # no cargo, no Miri, no build.
      - name: Miri lane invariants semantics harness
        run: bash scripts/test_miri_lane_invariants.sh
      # Semantics harness for the AI-attribution trailer check wired into
      # pr-validation.yml. Proves on fixtures that the release-plz co-author
      # PASSES (a blanket ban would break the release flow), that the Claude
      # and Codebuff co-authors FAIL, and that `[bot]` is matched literally —
      # the allowlist uses `grep -F` because `[bot]` is a character class under
      # `-E`. Runs against fixtures only, no API.
      - name: AI-attribution trailer check semantics harness
        run: bash scripts/test_no_ai_attribution.sh
      # Semantics harness for the lychee step of external-link-report.yml. That
      # job runs on a schedule only, so a broken step gets no PR-time signal at
      # all, and it is report-only by construction: `fail: false` swallows every
      # lychee failure and exit code 2 is ambiguous (clap usage error and link
      # findings share it), so the report content is the only evidence links
      # were checked. Proves offline that every flag in `args:` exists in the
      # pinned lychee release — a nonexistent flag made the job green with
      # nothing checked, from the day it merged — that the pin fails closed when
      # missing or unverified, and that the committed assertion behaves
      # correctly on real empty, footer-only and populated reports.
      - name: External-link report workflow semantics harness
        run: bash scripts/test_external_link_workflow.sh
      # Exit-code taxonomy must be typed-error based, never message-string
      # coupled. This forbids re-introducing the removed string match on the
      # "no URLs found" parser message (stabilization-sitemap-regression,
      # Message independence scenario). Test fixtures quoting the string are
      # fine — only src/ matching logic is forbidden.
      - name: Forbid sitemap string-match coupling
        run: |
          if grep -rn 'contains("no URLs found")' crates/*/src/ --include='*.rs'; then
            echo "::error::Sitemap emptiness must be detected via typed errors (ScraperError::SitemapEmpty), never by matching message text. See docs/test-inventory.md and the sitemap_exit_code_test suite"
            exit 1
          fi
          echo "OK: no string-match sitemap coupling in crates/*/src"
      # Regression guard for #1616 (audit CC-L1, CC-L2): two concurrency shapes
      # that no compiler or clippy lint catches and that only fail at runtime, as
      # a hang. CC-L1 is a bare `acquire().await;` whose permit is dropped at the
      # semicolon, so the bound it enforces never applies. CC-L2 is a
      # `Semaphore::new(<runtime value>)` that can park every acquire forever.
      # See scripts/concurrency_lint_allowlist.txt for the reviewed exemptions.
      - name: Concurrency lint gate
        run: bash scripts/check_concurrency_lints.sh
      # Semantics harness for the gate above: proves every rule FIRES on
      # fixtures, that the `#[cfg(test)]` cutoff really does skip test code, that
      # an exemption is keyed on path and not on argument text, and that an
      # unreadable allowlist fails CLOSED rather than silently disabling every
      # exemption. Offline, no repo state touched.
      - name: Concurrency lint semantics harness
        run: bash scripts/test_concurrency_lints.sh
      # Regression guard for #1784 (follow-up to #1781/#1782): no
      # `cargo nextest run` invocation may hardcode a thread-count flag
      # (`-j`, `--jobs`, `--test-threads`) — `.config/nextest.toml`
      # governs the width. `cargo test -- --ignored`, Miri, and TSan keep
      # their `--test-threads=1` (different runner, out of scope).
      - name: Nextest invocation lint gate
        run: bash scripts/check_nextest_invocation_lint.sh
      # Semantics harness for the gate above: proves on mktemp fixtures
      # that a continuation-line flag and `-j4` FIRE, that libtest/Miri/TSan
      # `=1`, cross-command `-j`, full-line comments, and `--json`-like
      # flags PASS, and re-verifies the zero-findings baseline over the
      # real tree. Offline, no repo state touched.
      - name: Nextest invocation lint semantics harness
        run: bash scripts/test_nextest_invocation_lint.sh
      # Regression guard for the release hand-off (#1478/#1480). GitHub
      # suppresses workflow runs for events generated with GITHUB_TOKEN, so the
      # tags release-plz and cut-patch-tag.yml push CANNOT trigger release.yml's
      # own `push: tags` trigger — the hand-off is an explicit workflow_dispatch
      # call. Fails if that call, its `--ref` pin, or release.yml's checkout pin
      # is removed: the shape that left v2.1.1 with a tag and no GitHub Release.
      - name: Release hand-off gate
        run: bash scripts/check_release_dispatch.sh
      # Semantics harness for the reconciliation path (#1484): proves on mktemp
      # fixtures that the dispatch is actually RETRIED, that a terminal failure is
      # loud and names the tag, and that the sweep never dispatches a human tag.
      # Grepping for a retry loop proves none of those, and a retry that does not
      # retry is worse than no retry — it buys false confidence.
      - name: Release reconcile semantics harness
        run: bash scripts/test_release_reconcile.sh
      # Release provenance L1 acceptance matrix (I.1–I.16): proves the gate
      # enforces identity (annotated bot tag), version match, lineage (main ancestor),
      # publish TOCTOU, and ruleset — with fail-closed on every drift/mismatch.
      - name: Release provenance L1 acceptance matrix
        run: bash scripts/test_release_provenance.sh
      # Semantics harness for the CI Health close path (slice4-branch-guard):
      # proves on a fake gh that the shared close_mine closes exactly the
      # labeled tracking issues, skips unlabeled lookalikes visibly, treats an
      # empty set as a no-op, and that no workflow step carries its own inline
      # close implementation. Offline, no real issues touched.
      - name: CI health close semantics harness
        run: bash scripts/test_ci_health_close.sh
      # Semantics harness for the nightly bench scope (#1913): proves on
      # dependency-free mktemp fixtures that the derived scope INCLUDES a crate
      # whose bench targets are autodiscovered (`benches/*.rs`, no `[[bench]]`
      # table) and EXCLUDES one that sets `autobenches = false`, that the
      # emitted token is the package name rather than the bench target's own
      # `name` key, that an empty scope fails closed with EMPTY stdout so the
      # caller cannot degrade into an unscoped full-workspace build, and that an
      # unresolvable workspace reports an explained message instead of a Python
      # traceback. `cargo bench -p <pkg>` is an allow-list, not a filter, so
      # anything left out is silently never measured while the nightly still
      # reports green — invisible by construction, hence pinned here.
      - name: Bench scope derivation semantics harness
        run: bash scripts/test_derive_bench_scope.sh
      # Semantics harness for the change-scope classifier (#1707; regression
      # coverage for #1643). The classifier once captured `git diff --name-only
      # -z` through `$(...)`, which drops NUL bytes and collapsed a multi-file
      # PR into ONE concatenated pseudo-path. When that pseudo-path matched a
      # narrow category (a leading `.github/...` does — ci_only), the
      # unknown-surface widening never fired, `run_code_jobs` went false, and
      # every job behind `needs: [clippy]` was skipped in cascade while
      # `CI Gate` stayed green — invisible by construction. The fix (#1680)
      # shipped these 49 assertions but no lane ever ran them, so the fix was
      # revertible in silence. Here, in the job that is already a `needs:` of
      # `gate`: a regression reds CI Gate and blocks the merge, which a
      # non-required lane (e.g. `Tests (windows-latest)`, #1697) does not.
      # Pure bash over throwaway mktemp git trees: no cargo, no network, and it
      # never reads or writes this repository.
      - name: Path classifier semantics harness
        run: bash scripts/ci_path_classifier_test.sh
      # Semantics harness for the fast gate's lane decision (A1, A2, B45).
      # The gate decides HOW MUCH to verify, and three of the fixes that make
      # that decision fail-closed shipped with no test at all: the path
      # classifier's exit status was ignored (a crash fell through to the cheap
      # docs+CI lanes — green gate, nothing verified), the docs-only
      # re-assertion's pattern was over-escaped and matched nothing, and an
      # unresolvable base ref fell back to HEAD~1, narrowing the check where it
      # had to widen. The harness drives the REAL gate against synthetic
      # fixture repos and asserts on its exit code, the lane it selected and
      # the error it printed. Every tool the gate can invoke is STUBBED on
      # PATH, so the suite compiles nothing: pure bash over mktemp fixtures,
      # no cargo, no network, and it never reads or writes this repository.
      - name: Fast gate semantics harness
        run: bash scripts/test_ci_fast_gate.sh
      # Semantics harness for the compatibility harness (#1635, #1698): proves
      # on stub cargo/webfang binaries that the per-combo probes stay
      # fail-closed AND resolve the binary through CARGO_TARGET_DIR. The
      # resolution case is the one that matters most here: the harness used to
      # run a hardcoded ./target/debug/webfang, so in every worktree — all of
      # which build into ~/.cache/cargo-target/<tree> under the isolated
      # target-dir policy (#1267) — it reported "exit 127, command not found"
      # and read as a contract violation (#1698). Until this step existed the
      # assertions ran nowhere in CI: scripts/ci_fast_gate.sh wires them only
      # into its CI-ONLY lane, while a change to these scripts lands in the
      # CODE lane, so the suite was effectively local-only. Same reasoning as
      # the classifier harness above — a regression here reds a `needs:` of
      # `gate` instead of passing unnoticed. Pure bash over mktemp fixtures:
      # no cargo, no network, no build.
      - name: Compatibility harness semantics harness
        run: bash scripts/tests/test_check_compatibility.sh
      # Docs version pins (#2017): README.md and docs/src/*.md carry literal
      # `vX.Y.Z` install recipes, and a pin is a claim about which release
      # exists — it goes stale silently. Nine of them sat four minors behind
      # when the guard was written. This step has to run on EVERY PR, not only
      # on markdown changes: the drift starts on the Cargo.toml side, so a
      # version bump that touches no markdown still leaves a stale recipe
      # behind. `repo-guards` runs on every PR with no `paths:` filter, and
      # `gate` already lists it among the always-applicable producers for both
      # scopes, so drift reds the required `CI Gate` even for a docs-only PR.
      # The path-filtered alternative cannot work: a workflow behind `paths:` can
      # never be a required context, because PRs outside the filter would
      # never report it and would sit "pending" forever. Pure bash over the
      # checked-out tree: no cargo, no network, no git history (the default
      # depth-1 checkout is sufficient).
      - name: Docs version pins gate
        run: bash scripts/check_docs_version_pins.sh
      # Semantics harness for the gate above. A drift check that has silently
      # stopped recognising drift is indistinguishable from no check at all,
      # and the RC window was exactly that class of defect (#2017): a
      # `v2.11.0-rc.1` doc pin passed against a stable workspace while a
      # `2.11.0-rc.1` workspace aborted the guard before it compared anything.
      # Offline, mktemp fixtures only, no cargo and no network.
      - name: Docs version pins semantics harness
        run: bash scripts/test_docs_version_pins.sh
      # Wiring regression guard for the two steps above. The semantics harness
      # pins what the guard decides; nothing pinned the EDGES, and the first
      # version of this gate was inert for a whole release because no workflow
      # invoked it. A deleted step is valid YAML, and a green run with no guard
      # is indistinguishable from a green run with one. This harness asserts the
      # edges themselves: `repo-guards` stays unfiltered and unconditional,
      # `gate` waits on it in both scopes, and the local fast gate mirrors it.
      # Offline, pure text over the checked-out tree: no cargo, no network.
      - name: Docs version pins wiring harness
        run: bash scripts/test_docs_version_pins_wiring.sh
      # AI providers doc drift gate (#2136): docs/architecture/ai-providers-design.md
      # is a NORMATIVE spec cited by 13 code files, and it lives OUTSIDE the
      # mdBook — so no gate read it. That is how a signature that did not
      # compile survived months (#2136). This step runs the guard that compares
      # the doc's claims against the real code, and it runs in `repo-guards`: a
      # job with no `paths:` filter, already a `needs:` of `gate` in both
      # scopes — the only place from which a guard can reach the required
      # `CI Gate`. A workflow behind `paths:` can never be a required context.
      #
      # PHASE 2 (required): the guard itself is FAIL-CLOSED (it exits 1 on
      # drift) and the step no longer absorbs that failure — so a drifting PR
      # reds `repo-guards`, and with it the required `CI Gate`, and the merge
      # is BLOCKED. The marker line below is what declares the phase in a form
      # a machine can read: the semantics harness below requires the phase to
      # be declared EXACTLY once, either as the `continue-on-error: true` flag
      # (advisory) or as the `# guard-required` marker (required). Both at once
      # is a FALSE PROMOTION (the step would still be advisory while the
      # harness certified it as blocking); neither is a step with no phase at
      # all.
      #
      # The promotion is the OWNER's call, not a mechanical consequence of the
      # guard's existence: the criterion was already met — the semantics
      # harness below proves the FAIL-CLOSED behaviour of every check, so a
      # promoted guard blocks only on real drift. The local mirror
      # (scripts/ci_fast_gate.sh) runs the same guard in the same, blocking
      # mode, and the harness rejects a mirror whose mode disagrees with the
      # phase declared here: a guard that blocks in CI and not locally is a
      # lie the developer only discovers in the CI run.
      - name: AI providers doc drift gate (required, #2136)
        # guard-required
        run: bash scripts/check_ai_providers_doc.sh
      # Semantics harness for the gate above — BLOCKING, like the gate step
      # itself. It is the proof that the guard can still fail: a guard that
      # stopped recognising drift would leave the gate step permanently green,
      # which is indistinguishable from not having a guard at all. Same
      # argument, and the same blocking status, as the docs version pins
      # harness above. Offline, mktemp fixtures only, no cargo and no network.
      - name: AI providers doc drift semantics harness
        run: bash scripts/test_ai_providers_doc.sh
      # The release flow OWNS the docs version pins (#2028), and these three
      # harnesses pin the pieces that make that ownership real: the WRITER
      # (scripts/bump_docs_version_pins.sh — the exact inverse of the gate
      # above), the ORCHESTRATOR (scripts/apply_release_pins.sh — the step the
      # release workflow invokes) and the WIRING of both into that workflow.
      #
      # They run on EVERY PR, with no `paths:` filter, for the same reason the
      # gate above does: the drift starts on the Cargo.toml side, so a change
      # that touches no markdown still has to be able to break them. They live
      # in `repo-guards` — a job with no filter, already a `needs:` of `gate`
      # in both scopes — so a regression reds the required `CI Gate` instead of
      # passing unnoticed.
      #
      # Offline: mktemp fixtures, a local bare git repo and a fake `gh` on
      # PATH. No cargo, no network, no repo state touched.
      - name: Docs version pins writer semantics harness
        run: bash scripts/test_bump_docs_version_pins.sh
      - name: Release pins orchestrator semantics harness
        run: bash scripts/test_apply_release_pins.sh
      - name: Release pins wiring harness
        run: bash scripts/test_release_pins_wiring.sh
      # The pending-publication declaration is the release-plz path's half of
      # the support contract (#2144). Its harness pins the whole flow offline:
      # a declared line becomes a pending publication, an undeclared line is
      # NOT invented, the write is idempotent, and the orchestrator lands the
      # declaration on the RELEASE branch (never on main) with the bot
      # identity. Without a CI entry point the harness would be inert.
      - name: Pending publication declaration semantics harness
        run: bash scripts/test_declare_pending_publication.sh
      # Edges of the MCP version-marker gate below (#2038): the guard runs with
      # the event's base, `repo-guards` stays unfiltered, and `gate` waits on it
      # in both scopes. Offline, pure text plus one local `git` call: no cargo,
      # no network. A deleted step or a new `paths:` filter is valid YAML and
      # only this harness notices.
      - name: MCP surface wiring harness
        run: bash scripts/test_mcp_surface_wiring.sh
      # Version-marker half of the MCP compatibility gate (#1614, wired in
      # #2038). The manifest test pins the live surface against the committed
      # fixture; only this guard can see whether the author MOVED
      # contract_version when a compatibility-bearing row changed. It lives in
      # `repo-guards`, not the path-filtered `mcp` lane: a job behind `paths:`
      # can never be a required context, while this job is unfiltered and
      # `gate` already requires it in both scopes.
      #
      # Base: the event's own comparison point — the PR base sha, NOT a
      # merge-base with main (on a stacked branch every row would read as
      # "added"; this repo rejects stacked PRs anyway), `before` for a push,
      # `base_sha` for merge_group. The default depth-1 checkout does not
      # contain that commit, so fetch just it (--depth=1: measured ~1 MiB
      # against ~10 MiB for fetch-depth: 0) and fail closed if it is still
      # missing. That check matters: the guard reads a missing fixture at base
      # as the bootstrap commit and exits 0; a failed fetch now fails this
      # step before the guard can see it. Schedule/dispatch have no change under review and
      # skip with an explicit note.
      - name: Resolve MCP public-surface base
        id: mcp-surface-base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          BASE="${PR_BASE_SHA:-}"
          if [[ -z "$BASE" ]]; then BASE="${MERGE_GROUP_BASE_SHA:-}"; fi
          if [[ -z "$BASE" ]]; then BASE="${PUSH_BEFORE_SHA:-}"; fi
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            echo "base=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$BASE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::unexpected base commit '$BASE' for the MCP public-surface guard"
            exit 1
          fi
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE" || {
              echo "::error::no se pudo traer el commit base '$BASE' para el guard MCP"
              exit 1
            }
          fi
          if ! git cat-file -e "${BASE}^{commit}"; then
            echo "::error::el commit base '$BASE' no está disponible tras el fetch"
            exit 1
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
      - name: MCP public-surface version marker gate
        env:
          BASE: ${{ steps.mcp-surface-base.outputs.base }}
        run: |
          if [[ -z "$BASE" ]]; then
            echo "mcp-public-surface: no event base (schedule/dispatch or a newly created ref); there is no change under review to compare. The manifest test still holds the live surface."
            exit 0
          fi
          bash scripts/check_mcp_public_surface.sh --base "$BASE"
      # Breaking-marker guard harness (#2081). `merge-when-green.sh` is the
      # integration mechanism, and its squash path silently destroyed a breaking
      # declaration twice while closing ADR-0004 paso 6: #2072 wrote the marker in
      # the wrong position, #2078 had it in the PR title and the squash subject
      # came out without it. Both shipped as patches. The guard refuses that merge
      # now, and this harness pins the refusal — including the negation that
      # matters (title marker + --squash must NOT merge). Offline: fake `gh`, no
      # network, no cargo, mktemp fixtures only.
      - name: Breaking-marker guard semantics harness
        run: bash scripts/test_merge_when_green_breaking.sh
      # Regression guard for #836: block-scalar nesting bugs in workflow YAML
      # (steps swallowed into a `run: |` block) stay valid YAML and only fail
      # at runtime post-merge (#833→#835). actionlint + shellcheck catch them
      # statically. Both binaries are downloaded pinned + checksum-verified.
      # The same shellcheck binary also lints the repo's own scripts (#1070):
      # actionlint only shells out to it for the embedded `run:` blocks of
      # workflow YAML, so `scripts/*.sh` had zero static shell coverage anywhere.
      - name: Lint GitHub Actions workflows and shell scripts (actionlint + shellcheck)
        run: |
          AL_VERSION=1.7.12
          SC_VERSION=0.11.0
          DIR=$(mktemp -d)
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${AL_VERSION}/actionlint_${AL_VERSION}_linux_amd64.tar.gz" -o "${DIR}/actionlint.tar.gz"
          EXPECTED=$(grep "actionlint_${AL_VERSION}_linux_amd64.tar.gz\$" <(curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${AL_VERSION}/actionlint_${AL_VERSION}_checksums.txt") | awk '{print $1}')
          echo "${EXPECTED}  ${DIR}/actionlint.tar.gz" | sha256sum -c -
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SC_VERSION}/shellcheck-v${SC_VERSION}.linux.x86_64.tar.xz" -o "${DIR}/shellcheck.tar.xz"
          SC_SHA256=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          echo "${SC_SHA256}  ${DIR}/shellcheck.tar.xz" | sha256sum -c -
          tar -xzf "${DIR}/actionlint.tar.gz" -C "$DIR" actionlint
          tar -xJf "${DIR}/shellcheck.tar.xz" -C "$DIR" shellcheck-v${SC_VERSION}/shellcheck --strip-components=1
          "$DIR/actionlint" -version
          # The ignore list is pre-existing style debt (SC2086 word-splitting,
          # SC2129 redirects, ...). Structural codes like SC2215 ("flag used as
          # command name" = a step swallowed into a run: block) stay FATAL.
          # Keep in sync with the actionlint hook in .pre-commit-config.yaml.
          # ONE list, defined once, consumed by both lints below: workflow
          # run-blocks and scripts/*.sh share a single severity policy (#1070).
          SHELLCHECK_IGNORE=(SC2010 SC2012 SC2027 SC2034 SC2046 SC2086 SC2126 SC2129)
          AL_IGNORE=()
          for code in "${SHELLCHECK_IGNORE[@]}"; do AL_IGNORE+=(-ignore "$code"); done
          "$DIR/actionlint" "${AL_IGNORE[@]}" .github/workflows/*.yml
          # No --severity filter: every finding outside the shared ignore list
          # fails this step, so a defect in a delivery-gate script blocks merge the
          # same way broken workflow YAML does. `--format=gcc` keeps one line per
          # finding (file:line:col: severity: message [SCnnnn]) in the job log.
          SC_EXCLUDE="$(IFS=,; echo "${SHELLCHECK_IGNORE[*]}")"
          "$DIR/shellcheck" -x --exclude="$SC_EXCLUDE" --format=gcc scripts/*.sh

      # Static analysis security testing for GitHub Actions workflows (zizmor).
      # Catches template injection, credential persistence (artipacked),
      # excessive permissions, and dangerous workflow triggers.
      - name: Security audit GitHub Actions workflows (zizmor)
        run: |
          ZM_VERSION=1.30.1
          ZM_SHA256=e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
          DIR=$(mktemp -d)
          curl -fsSL "https://github.com/zizmorcore/zizmor/releases/download/v${ZM_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz" -o "${DIR}/zizmor.tar.gz"
          echo "${ZM_SHA256}  ${DIR}/zizmor.tar.gz" | sha256sum -c -
          tar -xzf "${DIR}/zizmor.tar.gz" -C "$DIR" zizmor
          "$DIR/zizmor" --version
          "$DIR/zizmor" --config .github/zizmor.yml --min-severity high .github/workflows

      # Semantics harness for the duplicate-crate ratchet in
      # scripts/check_advisory_policy.sh (#2057, S3). The producer used to run
      # as `cargo deny check bans ... || true` and then `return 0`, so a failed
      # tool and a clean tree produced the same empty set and the ratchet at the
      # call site was dead code. A fake `cargo` on PATH proves the three shapes:
      # a failed producer fails the guard and says why, a duplicate missing from
      # the baseline fails and is named, and a baselined duplicate still passes.
      # Offline: no cargo, no network, no repo state touched.
      - name: Advisory policy semantics harness
        run: bash scripts/test_advisory_policy.sh
      # Four harnesses that shipped with NO CI entry point: the assertions
      # existed, no job ran them, and the fix they cover was revertible in
      # silence — the #1707 shape. They are cheap (a few seconds each, pure
      # bash over mktemp fixtures: no cargo, no network, no repo state
      # touched) and they are the only proof that the guards they cover can
      # actually fail:
      #   - test_bump_support_patch.sh: the patch bump's branch binding, its
      #     semver monotonicity, and the support declaration it maintains
      #     (the enforcing gate turns green after the bump and stays red
      #     without it).
      #   - test_cut_support_branch.sh: the support branch is cut from the
      #     published TAG, never from the declared `latest`.
      #   - test_seed_target_refusal.sh: a direct invocation of seed_target.sh
      #     cannot bypass the seed-store refusal.
      #   - test_target_isolation_envrc.sh: the .envrc ownership registry
      #     parses the declaration shapes real trees actually write.
      - name: Support patch bump semantics harness
        run: bash scripts/test_bump_support_patch.sh
      - name: Support branch cut semantics harness
        run: bash scripts/test_cut_support_branch.sh
      - name: Seed target refusal semantics harness
        run: bash scripts/test_seed_target_refusal.sh
      - name: Target isolation envrc semantics harness
        run: bash scripts/test_target_isolation_envrc.sh
      # The harness of check_target_isolation.sh itself. It was unwired (only
      # scripts/ci_fast_gate.sh ran it, and no workflow step runs the fast
      # gate), but the step above runs a harness that DRIVES that guard, so
      # the guard is now reachable from a workflow — and its own harness has to
      # run here too, or the meta-guard below reports an unwired harness.
      - name: Target isolation guard semantics harness
        run: bash scripts/tests/test_check_target_isolation.sh
      # Meta-guard for the whole guard layer (#2056). The audit
      # AUDIT-SCRIPTS-FAIL-OPEN-20261018-222141 found 12 CRITICAL defects and
      # every one of them lived in a branch no test exercised: a `|| true` over
      # a producer whose output is parsed later, a regex over-escaped past
      # recognition, a jq predicate that emitted zero outputs, a `comm` fed
      # version-ordered input. A guard that cannot fail reports green, and green
      # is indistinguishable from safe.
      #
      # This step enumerates every `check_*.sh` reachable from a workflow,
      # `justfile` or `mise.toml` — including one level of indirection, so the
      # guards the local fast gate invokes count — and requires four things: a
      # harness next to the guard, a workflow step that runs that harness, a
      # `# NEGATION:` marker, and the check that actually closes the root cause:
      # the harness must turn RED when its guard is replaced by `exit 0`. The
      # protocol is green-then-red, so a harness that is broken for an unrelated
      # reason cannot pass itself off as coverage. The mutation is applied in
      # place and restored from a byte-identical backup verified by checksum, so
      # an interrupted run cannot leave the tree mutated.
      #
      # Deferred entries live in scripts/guard_coverage_baseline.txt and the
      # list may only shrink: an entry that stops reproducing fails this step
      # and asks to be removed.
      # Semantic harnesses for the guards the meta-guard below audits. Each one
      # of these guards had a documented hole ("it needs its own issue"); the
      # harness is what makes the hole unreachable, and the meta-guard only
      # accepts a harness that a workflow actually runs.
      - name: MCP public surface semantics harness
        run: bash scripts/test_mcp_public_surface.sh
      - name: Dead tests semantics harness
        run: bash scripts/test_dead_tests.sh
      - name: Archive reproducibility semantics harness
        run: bash scripts/test_archive_reproducibility.sh
      - name: Guard coverage meta-guard
        run: bash scripts/test_guard_coverage.sh
      # Negation harness for the meta-guard above. Eight cases over throwaway
      # mktemp repositories prove every violation fires — missing harness,
      # unwired harness, missing marker, harness already red intact, harness
      # green against a broken guard, stale baseline — and that a compliant
      # fixture passes. A meta-guard that only ever prints OK would be the same
      # defect one level up. Offline, pure bash, never touches this tree.
      - name: Guard coverage meta-guard semantics harness
        run: bash scripts/tests/test_guard_coverage.sh
      # Semantic harnesses for two policy guards. `check-topology.sh` decides
      # the branch topology of every PR (an enforcing required check), and
      # `check_intra_crate_direction.sh` decides the intra-crate layering:
      # both had branches that a test never exercised, which is the shape the
      # guard-coverage meta-guard below audits.
      - name: Branch topology semantics harness
        run: bash scripts/test_topology.sh
      - name: Intra-crate allowlist semantics harness
        run: bash scripts/test_intra_crate_allowlist.sh

  # ============================================================================
  # TIER 1: FORMAT GATE (30-60 seconds)
  # No compilation needed — instant feedback on style.
  # If this fails, NOTHING else runs.
  # ============================================================================
  fmt:
    name: Check formatting
    needs: [toolchain, change-scope]
    if: ${{ needs.change-scope.outputs.run_code_jobs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Free ~30GB: remove pre-installed Android SDK, .NET, Haskell, CodeQL, Docker images
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker rmi "$(docker images -q)" 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ============================================================================
  # TIER 2: CLIPPY GATE (2-3 minutes)
  # Compiles once + lints. Runs in parallel with fmt/test-core (fan-out from
  # toolchain); the CI Gate job aggregates the final verdict.
  # ============================================================================
  clippy:
    name: Clippy (strict)
    needs: [toolchain, change-scope]
    if: ${{ needs.change-scope.outputs.run_code_jobs == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          # PRs restore main's cache lineage; only main saves — pool must not scale with open PRs (#1171)
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Complexity ratchet (issue #516): clippy.toml sets
      # cognitive-complexity-threshold=30 and too-many-lines-threshold=100.
      # Enabling these two lints + the existing -D warnings fails the build on
      # any function above those thresholds. DESCENDING ratchet — never raise.
      - run: cargo clippy --all-targets --all-features -- -D warnings -W clippy::cognitive_complexity -W clippy::too_many_lines

  # ============================================================================
  # ARTIFACT GUARDS: the artifact producers are fail-closed and reproducible
  # (audit B21, B26-B31). Five semantics harnesses, one per producer, each
  # driving the REAL script against a fixture and asserting the CONTRACT
  # (published whole or not at all, atomic swap, reproducible bytes, data
  # never as program text) rather than the implementation.
  # OFFLINE: no toolchain, no cargo, no network — the harnesses stub the
  # binaries they need (rustdoc-markdown, cargo, the CLI) and read the real
  # scripts from the checkout. Each one is a plain `bash` invocation: a red
  # harness fails the step.
  # ============================================================================
  artifact-guards:
    name: Artifact guards (fail-closed + reproducible producers)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      # B21 (atomic publication), B29 (fence flavour), B30 (derived date)
      - name: LLM bundle producer
        run: |
          set -euo pipefail
          bash scripts/test_artifact_llm_bundle.sh
      # B26 (the licence expression is never shortened)
      - name: Third-party notices producer
        run: |
          set -euo pipefail
          bash scripts/test_artifact_notices.sh
      # B27 (the chapter is staged in its own directory: same-fs rename)
      - name: CLI reference producer
        run: |
          set -euo pipefail
          bash scripts/test_artifact_cli_reference.sh
      # B28 (the trace id reaches jq as data, never as program text)
      - name: Trace analyzer
        run: |
          set -euo pipefail
          bash scripts/test_artifact_analyze_trace.sh
      # B31 (the archive is staged and published with an atomic replace)
      - name: Deterministic zip writer
        run: |
          set -euo pipefail
          bash scripts/test_artifact_deterministic_zip.sh

  # ============================================================================
  # CODE QUALITY: dead deps + duplication ratchet (issue #516).
  # cargo-machete fails on any unused dependency; check_duplication.sh fails if
  # duplicated lines exceed the committed baseline (a DESCENDING ratchet).
  # ============================================================================
  code-quality:
    name: Code quality (machete + duplication ratchet)
    needs: [clippy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install stable toolchain for jscpd v5 (MSRV 1.96)
        run: rustup toolchain install stable --no-self-update --profile minimal
      - name: Remove jscpd-rs binary (name collision)
        run: cargo uninstall jscpd-rs || true
      - name: Install jscpd v5 (MSRV 1.96, via stable)
        run: RUSTUP_TOOLCHAIN=stable cargo install jscpd --version 5.4.0 --locked --quiet
      - name: Install cargo-machete
        run: cargo install cargo-machete --version 0.9.2 --locked --quiet
      - name: Dead dependency gate (cargo-machete)
        run: cargo machete
      - name: Duplication ratchet (jscpd v5)
        run: bash scripts/check_duplication.sh

  # ============================================================================
  # TIER 3: TEST CORE — Split by category for targeted feedback.
  # Unit tests first (fast), then integration + behavioral (heavier).
  # Runs in parallel with clippy (fan-out from toolchain).
  # ============================================================================
  # Offline semantics harnesses for the CI-orchestration guards: the merge
  # waiter, the tag ruleset writer, the CI metrics snapshot and the CI-health
  # issue closer. Each of those guards had a branch that no test exercised
  # (a watch without a deadline, an API error read as "not there", a failed
  # read read as "missing label", a truncated sample printed as complete).
  merge-metrics-guards:
    name: Merge and metrics guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Merge-when-green wait bounds semantics harness
        run: bash scripts/test_ci_merge_when_green.sh
      - name: Tag ruleset idempotency semantics harness
        run: bash scripts/test_apply_tag_ruleset.sh
      - name: CI metrics snapshot semantics harness
        run: bash scripts/test_ci_metrics.sh
      - name: CI health close semantics harness
        run: bash scripts/test_ci_health_close.sh

  test-core:
    name: Tests (unit + integration + behavioral)
    needs: [toolchain, change-scope]
    if: ${{ needs.change-scope.outputs.run_code_jobs == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # SC-11: the `tool:` input is pinned. This action's DEFAULT tool set is
      # resolved per-pinned-ref and meant "latest", so omitting it floated an
      # executable inside a SHA-pinned pipeline — the supply-chain property the
      # action pin exists to provide, undone one layer down. 0.9.114 is this
      # repository's declared MSRV-safe pin (mise.toml: "pinned — latest requires
      # Rust >1.88"); the toolchain file pins 1.88, and 0.9.146 needs a newer rustc.
      - uses: taiki-e/install-action@e88e69ecdb9658bd172693dcdc2c84e7f0ab6a11
        with:
          tool: nextest@0.9.114
      - name: Pre-build test binary
        run: cargo build -p webfang_cli --bin webfang
      - name: Unit tests (lib)
        run: cargo nextest run --lib --retries 2
      - name: Integration tests
        run: cargo nextest run --test '*' --retries 2

  # ============================================================================
  # TIER 4: TEST FULL (4-6 minutes)
  # All features enabled. Independent — runs in parallel with test-core.
  # ============================================================================
  test-full:
    name: Tests (all features)
    needs: [change-scope]
    if: ${{ needs.change-scope.outputs.run_code_jobs == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # SC-11: the `tool:` input is pinned. This action's DEFAULT tool set is
      # resolved per-pinned-ref and meant "latest", so omitting it floated an
      # executable inside a SHA-pinned pipeline — the supply-chain property the
      # action pin exists to provide, undone one layer down. 0.9.114 is this
      # repository's declared MSRV-safe pin (mise.toml: "pinned — latest requires
      # Rust >1.88"); the toolchain file pins 1.88, and 0.9.146 needs a newer rustc.
      - uses: taiki-e/install-action@e88e69ecdb9658bd172693dcdc2c84e7f0ab6a11
        with:
          tool: nextest@0.9.114
      # NOTE: no model download here. test-full runs zero AI inference (all
      # --features compile + test, no --ignored); no job in this workflow
      # consumes --ignored tests, so no model cache entry is needed here.
      - name: Pre-build test binary
        run: cargo build -p webfang_cli --bin webfang --all-features
      - run: cargo nextest run --all-features --retries 2

  # ============================================================================
  # TEST CROSSPLATFORM (ADVISORY SIGNAL IN PR) — XP-C-01 (#1608)
  #
  # First Windows/macOS execution lanes in the repo: every other workflow runs
  # on ubuntu-latest only, and Windows/macOS were built exclusively in the
  # release matrix on release tags — never tested (#1608). This job mirrors
  # test-core (default features, build + nextest) on windows-latest and
  # macos-latest so the #1608 POSIX-only findings convert from audit inference
  # to observed failures. Advisory only — never in `gate` needs: the first
  # runs are EXPECTED to fail on Windows (fail-closed wizard identity,
  # signal semantics) and must not block merges. Promotion to required is a
  # deliberate follow-up once the lane is green.
  # No extra tooling: release.yml already builds Windows (x86_64-pc-windows-msvc)
  # and macOS (aarch64-apple-darwin) with BoringSSL/mcp without installing
  # anything — cmake/NASM are preinstalled on GitHub runners.
  # No rust-cache (#1171): non-gate job, compiles cold — cache pool budget,
  # tokio-console-smoke precedent.
  #
  # DECISION (#1633): this lane STAYS GATING — deliberately NOT shielded, and
  # the recorded reason is not "we forgot", it is the trade:
  #   - it is absent from `gate`'s needs and from `notify`'s needs, so it never
  #     blocks a merge through CI Gate; the only cost of its redness is the
  #     red RUN conclusion on push/PR, and
  #   - it never runs on `schedule` (change-scope-gated, push/PR only), so it
  #     is not part of the Monday-red problem #1633 exists to fix, and
  #   - shielding it would buy silence, not green: the CI Health Observer
  #     branches on the RUN conclusion, not on the jobs, so `continue-on-error`
  #     removes the false alarm AND the only mechanism reporting its red jobs.
  # The middle ground the issue names (shield + register as a known-RED-by-
  # design lane with the `known-false-positive` label, W-03 style) lives in
  # ci-health.yml, not here. Revisit with #1631 (the inventory of the real
  # Windows/macOS failures) in the same transaction.
  # ============================================================================
  test-crossplatform:
    name: Tests (${{ matrix.os }})
    needs: [change-scope]
    if: ${{ needs.change-scope.outputs.run_code_jobs == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      # SC-11: the `tool:` input is pinned. This action's DEFAULT tool set is
      # resolved per-pinned-ref and meant "latest", so omitting it floated an
      # executable inside a SHA-pinned pipeline — the supply-chain property the
      # action pin exists to provide, undone one layer down. 0.9.114 is this
      # repository's declared MSRV-safe pin (mise.toml: "pinned — latest requires
      # Rust >1.88"); the toolchain file pins 1.88, and 0.9.146 needs a newer rustc.
      - uses: taiki-e/install-action@e88e69ecdb9658bd172693dcdc2c84e7f0ab6a11
        with:
          tool: nextest@0.9.114
      - name: Pre-build test binary
        run: cargo build -p webfang_cli --bin webfang
      - name: Unit tests (lib)
        run: cargo nextest run --lib --retries 2
      - name: Integration tests
        run: cargo nextest run --test '*' --retries 2

  # ============================================================================
  # TEST RELEASE PROVENANCE (L1) — Behavioral acceptance matrix for
  # check_release_provenance.sh (webfang#1484).
  # Runs the hermetic test suite against a synthetic git repo with a fake `gh`.
  # Path-gated: runs only when run_code_jobs=true (code changes).
  # Required in gate — validates the L1 provenance gate logic.
  # ============================================================================
  test-release-provenance:
    name: Tests (release provenance L1)
    needs: [change-scope]
    if: ${{ needs.change-scope.outputs.run_code_jobs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - name: Run release provenance behavioral tests
        run: bash scripts/test_release_provenance.sh

  # ============================================================================
  # TOKIO CONSOLE SMOKE (Sprint 7-8 P1-conc - change stabilization-concurrency-budget)
  #
  # Runtime task-budget proof: compiles the workspace with the `console`
  # feature under RUSTFLAGS="--cfg tokio_unstable" (compile proof for
  # webfang_cli catches unexpected_cfgs breakage) and runs the in-process
  # smoke test asserting (a) the workload-attributable alive-task delta
  # stays within the budget-model Global ceiling and (b) alive tasks
  # return to baseline within the shutdown grace. Thresholds are
  # env-configurable (WEBFANG_CONSOLE_MAX_TASKS / _SMOKE_SECS /
  # _STATS_PATH) -- never hardcoded.
  # ============================================================================
  tokio-console-smoke:
    name: Tokio console smoke (unstable cfg)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTFLAGS: --cfg tokio_unstable
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      # no rust-cache (#1171): non-gate job, compiles cold — cache pool budget, benches.yml:55-60 precedent
      # SC-11: the `tool:` input is pinned. This action's DEFAULT tool set is
      # resolved per-pinned-ref and meant "latest", so omitting it floated an
      # executable inside a SHA-pinned pipeline — the supply-chain property the
      # action pin exists to provide, undone one layer down. 0.9.114 is this
      # repository's declared MSRV-safe pin (mise.toml: "pinned — latest requires
      # Rust >1.88"); the toolchain file pins 1.88, and 0.9.146 needs a newer rustc.
      - uses: taiki-e/install-action@e88e69ecdb9658bd172693dcdc2c84e7f0ab6a11
        with:
          tool: nextest@0.9.114
      - name: Compile proof (webfang_cli with console under unstable cfg)
        run: cargo check -p webfang_cli --features console
      - name: Console smoke test (delta ceiling + baseline recovery)
        run: cargo nextest run -p webfang_core --features console --test tokio_console_smoke_test

  # ============================================================================
  # SECURITY: No Rust compile — runs in PARALLEL with tests
  # Only needs fmt gate (doesn't depend on compilation).
  # cargo-deny covers advisories via RustSec + licenses + bans + sources.
  # cargo-audit is a redundant second opinion on advisories (belt + suspenders).
  # ============================================================================
  security:
    name: Security Audit
    needs: [toolchain]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      # SC-11: both tools are pinned, and both pins are LOAD-BEARING rather than
      # hygiene. `deny.toml` is written against cargo-deny 0.20.2's schema
      # (advisories `unmaintained`/`unsound` scopes, `unused-ignored-advisory`,
      # the removal of `vulnerability`/`notice`), and
      # scripts/check_advisory_policy.sh depends on cargo-audit 0.22.2 exiting
      # non-zero on a denied warning — without `-D warnings` that exit code is 0,
      # which is the SC-01/SC-07 defect itself. A silent bump of either binary
      # changes the verdict of the gate, so the version is stated here.
      - uses: taiki-e/install-action@347438fa49c6c030ac9a8f98ea84f0e151483e84
        with:
          tool: cargo-deny@0.20.2
      - uses: taiki-e/install-action@fd94a048c157f8a2d1975d01ffb26bd0de4f192e
        with:
          tool: cargo-audit@0.22.2
      - name: Advisories + licenses + bans + sources
        run: cargo deny check
      # The advisory --ignore flags are DERIVED from deny.toml [advisories]
      # ignore (via `check_advisory_policy.sh --print-ignores`) instead of being
      # duplicated by hand here, so there is no second copy to drift out of sync.
      # The script always passes `-D warnings`, which is the whole fix: without
      # it `cargo audit` exits 0 on an unmaintained/unsound finding, so this step
      # used to print a brand-new advisory and still go green (issue #1607,
      # SC-01/SC-07). It also audits fuzz/Cargo.lock — fuzz/ is not a workspace
      # member, so nothing else covered that lock (SC-14) — and enforces the
      # fail-closed knobs, the per-entry `# Expires:` dates, and the
      # duplicate-crate descending ratchet.
      - name: Advisory policy (deny.toml is the single source of truth)
        run: bash scripts/check_advisory_policy.sh

  # ============================================================================
  # TIER 5: DOC QUALITY — Independent of tests
  # Ensures documentation is complete and doctests compile.
  # Runs in parallel with tests so doc issues surface immediately.
  # ============================================================================
  doc-quality:
    name: Documentation quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rustdoc (links + missing_docs)
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Doctests
        run: cargo test --doc --workspace --all-features

  # ============================================================================
  # FINAL GATE: the ONLY required check produced by this workflow.
  # Aggregates the fast PR-blocking jobs. Fails on `failure` AND on unexpected
  # `skipped`/`cancelled` — GitHub treats skipped required checks as satisfied,
  # which allowed PR #833 to merge with 4 required checks SKIPPED and 1 FAILED.
  # Branch protection should require only "CI Gate" from ci.yml, plus cheap
  # metadata guards from their own workflows. Heavy jobs stay visible in the
  # workflow run, but they do not belong in the merge gate until we explicitly
  # decide to pay that wall-clock cost.
  # NEVER add a required producer without listing it in `needs:` here.
  # ============================================================================
  gate:
    name: CI Gate
    needs: [change-scope, toolchain, repo-guards, artifact-guards, merge-metrics-guards, fmt, clippy, code-quality, test-core, test-full, test-release-provenance, security, doc-quality]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify all required jobs succeeded
        env:
          RESULTS: ${{ toJson(needs) }}
          RUN_CODE_JOBS: ${{ needs.change-scope.outputs.run_code_jobs }}
        run: |
          # Path-aware gate semantics: full scope requires every producer to
          # succeed; narrow scope (run_code_jobs=false) requires only the
          # always-applicable producers (change-scope, toolchain, repo-guards,
          # artifact-guards, merge-metrics-guards, security, doc-quality) to
          # succeed while the skipped
          # code producers
          # (fmt, clippy, code-quality, test-core, test-full,
          # test-release-provenance) must be `skipped` — skipped
          # non-applicable producers are explicitly allowed only from
          # change-scope, and any failure/cancelled result still fails.
          echo "$RESULTS"
          SCOPE_RESULT="$(echo "$RESULTS" | jq -r '."change-scope".result')"
          if [ "$SCOPE_RESULT" != "success" ]; then
            echo "::error::change-scope did not succeed (result=$SCOPE_RESULT)."
            exit 1
          fi
          if [ "${RUN_CODE_JOBS:-true}" = "true" ]; then
            if echo "$RESULTS" | jq -e '.[] | select(.result != "success")' > /dev/null; then
              echo "::error::One or more required CI jobs did not succeed (failure/skipped/cancelled)."
              exit 1
            fi
            echo "All required CI jobs succeeded (full scope)."
          else
            for job in change-scope toolchain repo-guards artifact-guards merge-metrics-guards security doc-quality; do
              r="$(echo "$RESULTS" | jq -r --arg j "$job" '.[$j].result')"
              if [ "$r" != "success" ]; then
                echo "::error::Applicable producer '$job' did not succeed in narrow scope (result=$r)."
                exit 1
              fi
            done
            for job in fmt clippy code-quality test-core test-full test-release-provenance; do
              r="$(echo "$RESULTS" | jq -r --arg j "$job" '.[$j].result')"
              if [ "$r" != "skipped" ]; then
                echo "::error::Non-applicable code producer '$job' must be skipped in narrow scope (result=$r)."
                exit 1
              fi
              done
              echo "Narrow scope: applicable producers succeeded, code jobs skipped by change-scope."
          fi

  # ============================================================================
  # NOTIFY: scheduled-run failure tracking.
  # Scheduled runs have no PR page watching them — a red Monday run went
  # unnoticed for years (100+ consecutive failing scheduled runs before this
  # job existed). A failed scheduled run opens ONE idempotent tracking issue:
  # created on first failure, one comment per failing run, closed
  # automatically when a scheduled run goes green again (McQuaid, "Make
  # GitHub Actions Do More For You", 2026-06).
  # `needs` covers the core producers only (#1510): the three Miri jobs are
  # advisory (continue-on-error: true) and deliberately OUTSIDE `needs` —
  # their structural red (BoringSSL FFI, inline asm, recent syscalls) must not
  # keep the weekly schedule red forever. They are still REPORTED: the Miri
  # step below mirrors any red Miri job into the tracking issue with the run
  # link. `release` and `coverage` are push/PR-only and never run on schedule,
  # so they are not listed.
  # ============================================================================
  notify:
    name: Notify (scheduled CI result)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [gate, code-quality, tokio-console-smoke, feature-matrix, mcp]
    # #1510: Miri jobs (miri, miri-infra-fast, miri-infra-slow) are advisory
    # and intentionally absent from this needs list.
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    permissions:
      # #1633: `actions: read` is REQUIRED by the `miri-report` step below, not
      # optional hardening. It calls
      # GET /repos/{owner}/{repo}/actions/runs/{run_id}/jobs to read the REAL
      # per-job conclusion of the shielded Miri jobs. Every scope not listed
      # here is `none` (the top-level default is only `contents: read`), so
      # without this line the call 403s, the step dies under `bash -e`, and
      # this job — which is in nobody's `needs` — turns the scheduled run red
      # with no tracking issue written: the exact silent-failure the shield was
      # supposed to prevent. Same scope, same call, same reason as
      # ci-health.yml's top-level `actions: read` ("listar runs y jobs de los
      # workflows observados").
      actions: read
      issues: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: "Scheduled CI failed on main"
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Report advisory Miri jobs into the tracking issue
        id: miri-report
        # continue-on-error shields the WORKFLOW conclusion from Miri, but the
        # JOB still concludes failure. Query the real per-job state and mirror
        # it into the tracking issue so the red stays visible without gating
        # the scheduled run on it (#1510). miri_red gates the close step below:
        # without it, the same job would open the tracking issue here and
        # immediately close it in the success() step.
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          gh label create "ci-health" --color "0E8A16" --description "Auto-managed by CI Health Observer" 2>/dev/null || true
          RED_MIRI="$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name | startswith("Miri")) | select(.conclusion != "success" and .conclusion != "skipped") | .name] | join(", ")')"
          if [ -z "$RED_MIRI" ]; then
            echo "All Miri jobs green — nothing to report."
            echo "miri_red=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "miri_red=true" >> "$GITHUB_OUTPUT"
          COUNT="$(gh issue list --state open --search "${TITLE} in:title" --json number --jq 'length')"
          if [ "${COUNT}" -eq 0 ]; then
            gh issue create --title "${TITLE}" --label "ci-health" --label "automated" --body "$(printf 'Scheduled ci.yml run: advisory Miri jobs red (core producers green).\n\nRun: %s\n\nRed Miri jobs: %s\n\nThese jobs are continue-on-error by design (structural Miri limits: BoringSSL FFI, inline asm, syscalls). The scheduled run itself is green when the core producers pass; this issue closes itself when a scheduled run goes fully green.' "${RUN_URL}" "${RED_MIRI}")"
          else
            NUMBER="$(gh issue list --state open --search "${TITLE} in:title" --json number --jq '.[0].number')"
            gh issue comment "${NUMBER}" --body "Advisory Miri still red (${RED_MIRI}): ${RUN_URL}"
          fi

      - name: Open or update tracking issue on failure
        if: failure()
        run: |
          COUNT="$(gh issue list --state open --search "${TITLE} in:title" --json number --jq 'length')"
          if [ "${COUNT}" -eq 0 ]; then
            gh issue create --title "${TITLE}" --body "$(printf 'Scheduled ci.yml run failed.\n\nRun: %s\n\nThis issue is opened automatically by the notify job when a scheduled run fails. It closes itself as soon as a scheduled run is green again; each failing run appends a comment below.' "${RUN_URL}")"
          else
            NUMBER="$(gh issue list --state open --search "${TITLE} in:title" --json number --jq '.[0].number')"
            gh issue comment "${NUMBER}" --body "Still failing: ${RUN_URL}"
          fi
      - name: Close tracking issue when green again
        # success() here = every NON-advisory need green (Miri is shielded by
        # continue-on-error and out of needs). Skip the close when this same
        # run just reported a red advisory Miri job, otherwise the issue would
        # be created and closed within the same job (#1510).
        if: success() && steps.miri-report.outputs.miri_red != 'true'
        run: |
          gh issue list --state open --search "${TITLE} in:title" --json number --jq '.[].number' |
            while read -r number; do
              [ -n "${number}" ] && gh issue close "${number}" --comment "Scheduled CI is green again: ${RUN_URL}"
            done

  # ============================================================================
  # FEATURE MATRIX: cargo-hack checks each feature in isolation (Wave 4, #403).
  # Catches broken feature combinations — e.g. a feature that fails to compile
  # without another, or dead code behind an untested flag. Runs after clippy so
  # already-broken code doesn't burn compute. taiki-e/install-action provides a
  # prebuilt cargo-hack (matches the nextest/llvm-cov/deny pattern, no source build).
  # ============================================================================
  feature-matrix:
    name: Feature matrix
    needs: [clippy]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The compatibility harness runs `cargo nextest` per combo; `cargo hack`
      # comes from the same install step. Both are version-pinned (SC-11).
      - uses: taiki-e/install-action@4787a8cb96c211ae024644db52123a03bf511c68
        with:
          # SC-11: both entries pinned. `tool:` accepts a comma-separated
          # `name@version` list, so a single install step still covers both
          # executables the harness needs.
          tool: cargo-hack@0.6.45,nextest@0.9.114
      - name: Feature matrix check
        run: cargo hack check --each-feature --workspace --no-dev-deps
      # `cargo hack check` never compiles test targets (and `--no-dev-deps` drops
      # dev-dependencies), so feature-gated test arity breaks slip past the
      # matrix. Compile the test targets for the combo that exposed the gap (#737).
      - name: Feature-gated test targets compile (adaptive-selectors)
        run: cargo check -p webfang_core --no-default-features --features adaptive-selectors --tests
      # Per-combo runtime probes: build + behavioral crawl + resume round-trip +
      # exit-contract gates (65) for default, no-default, chromium, mcp and full
      # feature sets. Advisory only (not in `gate` needs). The script
      # rebuilds per combo, so the timeout is generous.
      - name: Compatibility harness (per-combo probes)
        run: bash scripts/check_compatibility.sh --ci-required

  # ============================================================================
  # MCP SMOKE: After full tests pass
  # Separate job so MCP failure doesn't block test results.
  # Path-gated: runs only when test-full ran AND run_code_jobs=true AND
  # needs_mcp=true (MCP/server inputs changed or full scope). Advisory only —
  # never in `gate` needs. On main full scope needs_mcp=true so the existing
  # release chain (needs test-full, security, mcp) is unchanged.
  # ============================================================================
  mcp:
    name: MCP handshake
    needs: [test-full, change-scope]
    if: ${{ needs.test-full.result == 'success' && needs.change-scope.outputs.run_code_jobs == 'true' && needs.change-scope.outputs.needs_mcp == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build MCP server
        run: cargo build --bin webfang-mcp --bin webfang-mcp-stdio --all-features
      - name: Validate MCP handshake
        timeout-minutes: 2
        run: |
          # #1611 G-18: the fail-closed default must REFUSE to start with no
          # token and no explicit opt-in — smoke-testing the refusal itself.
          if ./target/debug/webfang-mcp 2>err.log; then
            echo "token-less server started: fail-closed default regressed"
            exit 1
          fi
          grep -q "allow-anonymous" err.log || {
            echo "token-less refusal did not name the fix:"; cat err.log; exit 1
          }
          echo "token-less server refused to start (fail-closed OK)"

          # The development mode is an explicit opt-in on a loopback bind.
          ./target/debug/webfang-mcp --allow-anonymous &
          MCP_PID=$!
          for _ in $(seq 1 15); do
            if curl -sf --max-time 2 http://127.0.0.1:8080/mcp -X POST \
              -H "Content-Type: application/json" \
              -H "Accept: application/json, text/event-stream" \
              -d '{"jsonrpc":"2.0","method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}},"id":1}' \
              | grep -q "protocolVersion"; then
              echo "MCP server ready"
              kill $MCP_PID 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          kill $MCP_PID 2>/dev/null || true
          echo "MCP server failed to respond after 15 attempts"
          exit 1

  # ============================================================================
  # RELEASE: After ALL gates pass (main only)
  # ============================================================================
  release:
    name: Build Release
    needs: [test-full, security, mcp]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          target: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build optimized binary
        run: cargo build --release --locked --features "mcp"
      - name: Strip binary
        run: |
          strip target/release/webfang
          ls -lh target/release/webfang
      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: webfang-linux-x86_64
          path: target/release/webfang
          retention-days: 7

  # ============================================================================
  # SCHEDULED: Miri (UB detection on nightly)
  #
  # Design (the lane is a DETECTOR: it must REPORT, not abort the process):
  #   1. Code level: every test that needs an interpreter-hostile primitive
  #      carries its OWN gate, with the reason written next to it:
  #      `#[cfg_attr(miri, ignore = "<motivo>")]`. The reason names the
  #      concrete limitation — btls-sys FFI (the wreq Client), Command::spawn
  #      (obscura, chromiumoxide), sysinfo sysconf (resource_governor), the
  #      servo_arc/lol_html Tree Borrows UB — never "flaky" and never a bare
  #      "not supported". A gate nobody can evaluate is not a gate.
  #   2. NO skip-net (#2235): the three per-submodule `--skip` flags
  #      (wreq_downloader / obscura_downloader / chromiumoxide_downloader)
  #      are GONE. A submodule skip deletes a whole test tree from the lane
  #      and hides the UB living inside that tree — the skip-net of #1423
  #      was a patch, and the acceptance criterion it carried ("4/4 green
  #      WITHOUT the skip-net") was never met. What the skip protected is
  #      now a per-test gate with a written reason, so the tests that do
  #      NOT need FFI keep running under Miri instead of disappearing.
  #   3. Matrix: tests split into parallel groups so ALL failures surface
  #      in ONE run instead of blocking on the first UB.
  #   4. Sysroot cache: cargo miri setup drops from ~15min to ~2s warm.
  #   5. Tree Borrows: aliasing model that tolerates sound-in-practice patterns
  #      (ahash, dashmap, smallvec) while still detecting real UB.
  #      If a specific test fails under Tree Borrows, isolate it with
  #      `#[cfg_attr(miri, ignore = "<motivo>")]` — never disable aliasing
  #      detection globally.
  #
  #   The UB of `application/scraper_service.rs` (the servo_arc / lol_html
  #   family) is attributed to a TEST, gate by gate: a lane that ABORTS
  #   leaves no result to act on, which is the dead end #2235 closes. The
  #   static harness `scripts/test_miri_lane_invariants.sh` (wired into
  #   `repo-guards`) pins the four invariants that keep the lane a detector:
  #   no unjustified skip, a written reason on every gate, the `application::`
  #   filter still inside the core group, and a per-test gate on every test
  #   that drives the scrape use case.
  # ============================================================================
  miri:
    name: Miri (${{ matrix.group }})
    runs-on: ubuntu-latest
    # 60 min, same as infra-fast/infra-slow (#766). The old 30-min budget was
    # set when Miri (core) aborted in ~20 min on servo_arc UB; once that UB
    # was gated (#765), core started interpreting its full 691-test universe
    # and ran out the wall exactly at 30:00 with 422 tests completed and no
    # UB/FAIL anywhere (run 32049909561, 2026-08-17).
    # #1512: 120 min — a job timeout CANCELS THE WHOLE RUN even under
    # continue-on-error (the flag absorbs a `failure` conclusion, not the
    # cancellation signal), so this budget must fit the slowest advisory job.
    # #1565: 240 min — with every FFI trap gated, core interprets its full
    # universe with zero UB/FAIL and outgrew 120:00 the same way it outgrew
    # 30:00 in #766 (run 36023882015 on f4d07edf: steady progress 16:03→17:57,
    # killed by the wall, `flag_on_with_env_credential_builds_provider` listed
    # as ignored proving the gates live). 240 keeps 2x headroom inside the 6h
    # hosted ceiling; revisit only with a new timeout-only kill past 240.
    timeout-minutes: 240
    # #1510: advisory. Miri cannot execute BoringSSL FFI (TLS_method), inline
    # assembly (raw-cpuid via quanta/governor) nor recent syscalls, so the
    # weekly scheduled run has been structurally red every Monday since July
    # (10 consecutive failures) regardless of repo health. continue-on-error
    # keeps the UB sweep running and its failures visible per-job WITHOUT
    # keeping the whole schedule red; the `notify` job reports any red Miri
    # job into the tracking issue explicitly instead of gating on it.
    continue-on-error: true
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    env:
      # rust-toolchain.toml pins 1.88.0 and would override the nightly toolchain
      # for `cargo miri` (miri is nightly-only). RUSTUP_TOOLCHAIN (env var) has
      # the HIGHEST rustup precedence — above rust-toolchain.toml and above
      # rustup directory overrides (`override: true` on dtolnay/rust-toolchain
      # is NOT enough) — so it must name the SAME pinned toolchain installed
      # below: `cargo-miri` is a per-toolchain component. Leaving this at
      # generic `nightly` made every scheduled run fail with "'cargo-miri' is
      # not installed" after #1041 pinned the toolchain (2026-08-31 onwards).
      RUSTUP_TOOLCHAIN: nightly-2026-08-27
    strategy:
      fail-fast: false
      matrix:
        group: [core, domain]
        include:
          - group: core
            filter: "-- adapters:: application:: cli:: config:: di:: error::"
          - group: domain
            filter: "-- domain::"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      # Miri nightly pin (#991): nightly-2026-08-27 was the last known-good
      # date for both the core and infra-slow Miri jobs on SHA e2b4aa10
      # (green 2026-08-27 21:31, run 33118500969). Pinning freezes the aliasing
      # model + stdlib version so Miri UB-detection results stay reproducible
      # across runs. To bump: locally run the same `cargo miri test --lib`
      # commands against the new nightly on a representative commit and
      # update all three `dtolnay/rust-toolchain` toolchain inputs
      # below + the sysroot cache key (`miri-sysroot-...-YYYY-MM-DD`).
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly-2026-08-27
          components: miri
      - name: Cache Miri sysroot
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.cache/miri
          key: miri-sysroot-${{ runner.os }}-2026-08-27
          restore-keys: |
            miri-sysroot-${{ runner.os }}-
      - name: Setup & Run Miri (${{ matrix.group }})
        env:
          # Tree Borrows: aliasing model more permissive than Stacked Borrows.
          # Tolerates sound-in-practice patterns from ahash/dashmap/smallvec/wide,
          # but still detects real aliasing UB (unlike -Zmiri-disable-stacked-borrows).
          # If a third-party crate fails, isolate that test with #[cfg(not(miri))].
          MIRIFLAGS: -Zmiri-tree-borrows -Zmiri-disable-isolation -Zmiri-ignore-leaks -Zmiri-seed=42 -Zmiri-permissive-provenance
        run: |
          cargo miri setup
          # #2235: NO skip-net. The per-submodule `--skip` flags are gone:
          # a submodule skip deleted a whole test tree from the lane and hid
          # the UB inside it. The tests that genuinely need FFI/asm carry
          # their own per-test gate with a written reason (the downloader
          # submodules), and the tests that do not need it run under Miri.
          cargo miri test --lib -- \
            ${{ matrix.filter }}

  # ============================================================================
  # MIRI INFRA-FAST: 10 modules, needs a 120 min timeout (#1512: a job
  # timeout cancels the whole run — see the `miri` job rationale; compilation
  # under Miri is 5-10x slower).
  # NOTE: Positive module filters — new infrastructure:: modules must be
  # explicitly assigned to one of the two infra jobs to run under Miri.
  # ============================================================================
  miri-infra-fast:
    name: Miri (infra-fast)
    runs-on: ubuntu-latest
    # #1512: see the `miri` job rationale — a job timeout cancels the run.
    timeout-minutes: 120
    # #1510/#1633: advisory, same contract and same structural rationale as
    # the `miri` matrix job above — Miri cannot execute BoringSSL FFI
    # (TLS_method via btls/wreq), inline assembly (raw-cpuid via
    # quanta/governor) or recent syscalls, so this job's redness is a property
    # of the interpreter, not of the tree. continue-on-error keeps the UB sweep
    # running and keeps its failures visible PER-JOB while removing its power
    # over the run conclusion; the `notify` job's `miri-report` step mirrors a
    # red Miri job into the tracking issue (it holds `actions: read` for
    # exactly that API call), so nothing is traded away but the block.
    # CAVEAT (unchanged from #1512, and the reason the 120 min budget stays
    # load-bearing): continue-on-error absorbs a `failure`, NOT a `cancelled`.
    # If this job is killed by its own `timeout-minutes` the run still goes
    # red — see the 2026-09-21 scheduled run, where `Miri (infra-slow)` was
    # cancelled at the cap. Budget measured at ~20 min (run 36053344407).
    continue-on-error: true
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    env:
      # Must name the SAME pinned toolchain installed below — RUSTUP_TOOLCHAIN
      # has the highest rustup precedence (see the `miri` job rationale).
      RUSTUP_TOOLCHAIN: nightly-2026-08-27
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      # See the Miri nightly pin rationale in the `miri` job above (#991).
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly-2026-08-27
          components: miri
      - name: Cache Miri sysroot
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.cache/miri
          key: miri-sysroot-${{ runner.os }}-2026-08-27
          restore-keys: |
            miri-sysroot-${{ runner.os }}-
      - name: Setup & Run Miri (infra-fast)
        env:
          MIRIFLAGS: -Zmiri-tree-borrows -Zmiri-disable-isolation -Zmiri-ignore-leaks -Zmiri-seed=42 -Zmiri-permissive-provenance
        run: |
          cargo miri setup
          # #2235: NO skip-net — see the design block above the `miri` job.
          cargo miri test --lib -- \
            -- infrastructure::cpu_pool:: -- infrastructure::stream:: -- infrastructure::error:: -- infrastructure::user_agent:: -- infrastructure::bridge:: -- infrastructure::output:: -- infrastructure::config:: -- infrastructure::autotuning:: -- infrastructure::content_processing:: -- infrastructure::scraper::

  # ============================================================================
  # MIRI INFRA-SLOW: crawler/obsidian/export/http/network/converter + the
  # downloader submodules. 120 min timeout (#1512) — see the `miri` job
  # rationale.
  # syntax_highlight is excluded at source via #[cfg(all(test, not(miri)))];
  # wikilinks (pure pulldown_cmark, no FFI) runs and passes under Miri — it
  # is already covered by the `infrastructure::converter::` filter, so it
  # needs no flag of its own.
  # downloader (#2235): the FFI submodules (wreq, obscura, chromiumoxide)
  # are IN the filter again. What the per-submodule `--skip` used to hide
  # is now a per-test gate with a written reason, so the tests of those
  # submodules that do NOT need FFI/asm run under Miri. The sysinfo-
  # dependent ones (hybrid_router, resource_governor) stay out of the
  # filter; resource_governor is covered by TSan (sanitizers.yml), where
  # sysconf works.
  # Budget (#751): memory_manager's test_handle_disk_swapping_with_swap is
  # #[cfg_attr(miri, ignore)] — it alone burned ~27 min wall, leaving the rest
  # of this job at ~30–33 min of the old 60 min timeout (knife-edge then);
  # as of #1512 the job outgrew that budget — measured 60m20s, killed at the
  # cap in run 35621757387, whose cancellation took the whole run down —
  # so the budget is now 120 min.
  # ============================================================================
  miri-infra-slow:
    name: Miri (infra-slow)
    runs-on: ubuntu-latest
    # #1512: see the `miri` job rationale — a job timeout cancels the run.
    # Kept at 120 min by #1633 (NOT raised to the matrix job's 240): run
    # 36053344407 measured this job at 50 min, so the #1513 raise still holds
    # with ~70 min of headroom. That budget is what actually protects the
    # scheduled run, because continue-on-error does not absorb a cancellation.
    timeout-minutes: 120
    # #1510/#1633: advisory, identical contract to the `miri` matrix job and to
    # `miri-infra-fast`: the same structural Miri limits (BoringSSL FFI, inline
    # asm, recent syscalls — the 2026-09-14 run died on `unsupported syscall
    # number 326`) make this job red independently of the tree's health, and
    # the scheduled run's conclusion is a pure function of the Miri jobs. This
    # job was ALSO the `cancelled` one on 2026-09-21 (killed by the then-cap),
    # which is why the budget above matters as much as the flag below.
    continue-on-error: true
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    env:
      # Must name the SAME pinned toolchain installed below — RUSTUP_TOOLCHAIN
      # has the highest rustup precedence (see the `miri` job rationale).
      RUSTUP_TOOLCHAIN: nightly-2026-08-27
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      # See the Miri nightly pin rationale in the `miri` job above (#991).
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly-2026-08-27
          components: miri
      - name: Cache Miri sysroot
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.cache/miri
          key: miri-sysroot-${{ runner.os }}-2026-08-27
          restore-keys: |
            miri-sysroot-${{ runner.os }}-
      - name: Setup & Run Miri (infra-slow)
        env:
          MIRIFLAGS: -Zmiri-tree-borrows -Zmiri-disable-isolation -Zmiri-ignore-leaks -Zmiri-seed=42 -Zmiri-permissive-provenance
        run: |
          cargo miri setup
          # #2235: NO skip-net — see the design block above the `miri` job.
          # The three FFI downloader submodules are back in the filter: their
          # FFI/asm tests carry a per-test gate with a written reason, and
          # the rest run under Miri.
          cargo miri test --lib -- \
            -- infrastructure::crawler:: -- infrastructure::obsidian:: -- infrastructure::export:: -- infrastructure::http:: -- infrastructure::network:: -- infrastructure::converter:: -- infrastructure::downloader::cookie_bridge:: -- infrastructure::downloader::spa_detector:: -- infrastructure::downloader::wreq_downloader:: -- infrastructure::downloader::obscura_downloader:: -- infrastructure::downloader::chromiumoxide_downloader::

  # ============================================================================
  # COVERAGE: PR gate + push-to-main + manual trigger
  # Measures and reports coverage on every PR (Wave 4, #403); uploads to Codecov.
  # Also runs on push to main so the base commit always has a coverage report
  # for PR comparisons (docs.codecov.com/docs/error-reference#missing-base-report).
  # fail_ci_if_error: false — coverage is informational, never blocks the PR.
  # ============================================================================
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [test-full]
    env:
      # Same rationale as mutants.yml:53-54 (which already sets this): coverage is a
      # single-use build, so rustc's incremental bookkeeping is pure overhead - and
      # `-C incremental` additionally marks every unit non-cacheable for a compiler
      # cache. Only the profile-config form is used here, to match the repo.
      CARGO_PROFILE_DEV_INCREMENTAL: "false"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      # no rust-cache (#1171): non-gate job, compiles cold — cache pool budget, benches.yml:55-60 precedent
      # SC-11: pinned — see the nextest pin above for why an unpinned `tool:`
      # floats an executable inside a SHA-pinned step.
      - uses: taiki-e/install-action@166cdddc0349c6f3c1da17f66a8fc88ec3bc4dd5
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Generate coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info -- --skip test_mcp
      - name: Report coverage
        run: |
          cargo llvm-cov report --lcov | tail -5
          echo "Coverage report generated successfully"
      - name: Upload to Codecov
        uses: codecov/codecov-action@f9fe539f5290016afa014f8ef31597d3a61c2dea
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
