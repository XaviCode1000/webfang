# ============================================================================
# DOCS: Build mdBook + rustdoc in CI, deploy combined site, upload LLM artifact
# ============================================================================
# All heavy compute runs in CI (mdBook build/test/linkcheck + rustdoc + pandoc).
# Locally the user only pulls the generated result via `just docs`.
#
# Triggers:
#   - Push to main            → validate + deploy + upload artifact (auto)
#   - Manual dispatch         → validate + deploy + upload artifact
#   - Pull request            → validate only (gates catch stale/broken docs)
# ============================================================================
name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------------------------
  # Validate: build, test (rust snippets), linkcheck, rustdoc.
  # Runs on EVERY trigger (incl. PR) so broken/stale docs fail the check.
  # --------------------------------------------------------------------------
  validate:
    name: Validate Docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins 1.88.0; install it FIRST so cargo-based steps
      # (rustdoc) never race toolchain bootstrap with the runner's sccache
      # rustc-wrapper. mdbook-linkcheck comes from a prebuilt release binary.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-docs

      - uses: Swatinem/rust-cache@v2

      # Prebuilt binary from the project release (v0.7.7) — seconds instead of
      # ~1.6 min per run spent compiling from crates.io via `cargo install`.
      - name: Install mdbook-linkcheck (prebuilt binary)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/mdbook-linkcheck.zip \
            https://github.com/Michael-F-Bryan/mdbook-linkcheck/releases/download/v0.7.7/mdbook-linkcheck.x86_64-unknown-linux-gnu.zip
          unzip -o /tmp/mdbook-linkcheck.zip -d "$HOME/.cargo/bin"
          chmod +x "$HOME/.cargo/bin/mdbook-linkcheck"
          mdbook-linkcheck --version

      - name: Install mise toolchain (mdbook + pandoc)
        uses: jdx/mise-action@v2
        with:
          install: false
      - run: mise install aqua:rust-lang/mdBook aqua:jgm/pandoc

      - name: mdBook build (narrative docs must be valid)
        run: mdbook build docs

      - name: mdBook test (Rust snippets in docs must compile)
        run: mdbook test docs

      - name: mdBook linkcheck (no dead links)
        run: mdbook-linkcheck --standalone docs

      - name: Generate rustdoc for all 6 crates
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps

  # --------------------------------------------------------------------------
  # Deploy: only on push to main / manual dispatch. Combines rustdoc into the
  # mdBook site, deploys to gh-pages, and uploads the LLM markdown artifact.
  # --------------------------------------------------------------------------
  deploy:
    name: Deploy Docs & Upload LLM Artifact
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins 1.88.0; install it FIRST so cargo-based steps
      # (rustdoc) never race toolchain bootstrap with the runner's sccache
      # rustc-wrapper. mdbook-linkcheck comes from a prebuilt release binary.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-docs

      - uses: Swatinem/rust-cache@v2

      # Prebuilt binary from the project release (v0.7.7) — seconds instead of
      # ~1.6 min per run spent compiling from crates.io via `cargo install`.
      - name: Install mdbook-linkcheck (prebuilt binary)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/mdbook-linkcheck.zip \
            https://github.com/Michael-F-Bryan/mdbook-linkcheck/releases/download/v0.7.7/mdbook-linkcheck.x86_64-unknown-linux-gnu.zip
          unzip -o /tmp/mdbook-linkcheck.zip -d "$HOME/.cargo/bin"
          chmod +x "$HOME/.cargo/bin/mdbook-linkcheck"
          mdbook-linkcheck --version

      - name: Install mise toolchain (mdbook + pandoc)
        uses: jdx/mise-action@v2
        with:
          install: false
      - run: mise install aqua:rust-lang/mdBook aqua:jgm/pandoc

      - name: mdBook build
        run: mdbook build docs

      - name: Generate rustdoc for all 6 crates
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps

      # Combine: rustdoc API lives under /api/<crate>/ on the published site.
      # mdBook outputs straight into docs/book/ (no html/ subdir).
      - name: Combine rustdoc into mdBook site
        run: |
          set -euo pipefail
          cp -r target/doc docs/book/api
          touch docs/book/.nojekyll

      # Build the NotebookLM / LLM markdown: narrative (SUMMARY order) +
      # rustdoc API (all 6 crates) converted via pandoc.
      - name: Build LLM markdown artifact
        run: |
          set -euo pipefail
          OUT=docs/book/webfang-docs-llm.md
          echo "# WebFang Documentation" > "$OUT"
          echo "" >> "$OUT"
          echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$OUT"
          echo "" >> "$OUT"
          echo "---" >> "$OUT"
          echo "" >> "$OUT"

          echo "## Narrative Documentation" >> "$OUT"
          echo "" >> "$OUT"
          for entry in \
            "overview:Overview" \
            "debugging:Debugging & Observability" \
            "testing:Testing" \
            "troubleshooting:Troubleshooting" \
            "tui-unified-design:TUI Unified Design"; do
            f="${entry%%:*}"
            title="${entry#*:}"
            echo "# $title" >> "$OUT"
            echo "" >> "$OUT"
            cat "docs/src/$f.md" >> "$OUT"
            echo "" >> "$OUT"
            echo "---" >> "$OUT"
            echo "" >> "$OUT"
          done

          echo "## API Reference (rustdoc)" >> "$OUT"
          echo "" >> "$OUT"
          for crate in webfang_core webfang_ai webfang_tui webfang_mcp webfang_cli webfang_test_utils; do
            if [ -d "target/doc/$crate" ]; then
              echo "# API: $crate" >> "$OUT"
              echo "" >> "$OUT"
              {
                pandoc -f html -t gfm --wrap=none "target/doc/$crate/index.html" 2>/dev/null
                find "target/doc/$crate" -name '*.html' ! -name 'index.html' ! -path '*/src/*' -print0 \
                  | sort -z \
                  | while IFS= read -r -d '' fl; do
                    pandoc -f html -t gfm --wrap=none "$fl" 2>/dev/null
                  done
              } \
              | sed -e 's/Copy item path//' \
                    -e 's/<span[^>]*>//g' \
                    -e 's/<\/span>//g' \
                    -e 's/<div[^>]*>//g' \
                    -e 's/<\/div>//g' \
                    -e 's/Show [0-9][0-9]* fields[[:space:]]*//g' \
                    -e 's/Show [0-9][0-9]* variants[[:space:]]*//g' \
                > "target/doc/$crate.md"
              cat "target/doc/$crate.md" >> "$OUT"
              echo "" >> "$OUT"
              echo "---" >> "$OUT"
              echo "" >> "$OUT"
            fi
          done

      - name: Upload LLM markdown artifact
        uses: actions/upload-artifact@v4
        with:
          name: webfang-docs-llm
          path: docs/book/webfang-docs-llm.md
          if-no-files-found: error
          retention-days: 30

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/book
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'docs: deploy mdBook + rustdoc to GitHub Pages'
