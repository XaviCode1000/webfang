# ============================================================================
# DOCS: Build mdBook + rustdoc in CI, deploy combined site, upload LLM artifact
# ============================================================================
# All heavy compute runs in CI (mdBook build/test/linkcheck + rustdoc + pandoc).
# Locally the user only pulls the generated result via `just docs`.
#
# Triggers:
#   - Push to main            → validate + deploy + upload artifact (auto)
#   - Manual dispatch         → validate + deploy + upload artifact
#   - Pull request            → validate only (gates catch stale/broken docs)
# ============================================================================
name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------------------------
  # Validate: build, test (rust snippets), linkcheck, rustdoc.
  # Runs on EVERY trigger (incl. PR) so broken/stale docs fail the check.
  # --------------------------------------------------------------------------
  validate:
    name: Validate Docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins 1.88.0; install it FIRST so cargo-based steps
      # (rustdoc) never race toolchain bootstrap with the runner's sccache
      # rustc-wrapper. mdbook-linkcheck comes from a prebuilt release binary.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-docs

      - uses: Swatinem/rust-cache@v2

      # Prebuilt binary from the project release (v0.7.7) — seconds instead of
      # ~1.6 min per run spent compiling from crates.io via `cargo install`.
      - name: Install mdbook-linkcheck (prebuilt binary)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/mdbook-linkcheck.zip \
            https://github.com/Michael-F-Bryan/mdbook-linkcheck/releases/download/v0.7.7/mdbook-linkcheck.x86_64-unknown-linux-gnu.zip
          unzip -o /tmp/mdbook-linkcheck.zip -d "$HOME/.cargo/bin"
          chmod +x "$HOME/.cargo/bin/mdbook-linkcheck"
          mdbook-linkcheck --version

      - name: Install mise toolchain (mdbook + pandoc)
        uses: jdx/mise-action@v2
        with:
          install: false
      - run: mise install aqua:rust-lang/mdBook aqua:jgm/pandoc

      - name: mdBook build (narrative docs must be valid)
        run: mdbook build docs

      - name: mdBook test (Rust snippets in docs must compile)
        run: mdbook test docs

      - name: mdBook linkcheck (no dead links)
        run: mdbook-linkcheck --standalone docs

      - name: Generate rustdoc for all 6 crates
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps

  # --------------------------------------------------------------------------
  # Deploy: only on push to main / manual dispatch. Combines rustdoc into the
  # mdBook site, deploys to gh-pages, and uploads the LLM markdown artifact.
  # --------------------------------------------------------------------------
  deploy:
    name: Deploy Docs & Upload LLM Artifact
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Native GitHub Pages ("deploy from a workflow") requires OIDC + Pages write
    # permission, and the `github-pages` environment (auto-provisioned by Pages).
    environment: github-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins 1.88.0; install it FIRST so cargo-based steps
      # (rustdoc) never race toolchain bootstrap with the runner's sccache
      # rustc-wrapper. mdbook-linkcheck comes from a prebuilt release binary.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-docs

      - uses: Swatinem/rust-cache@v2

      # Prebuilt binary from the project release (v0.7.7) — seconds instead of
      # ~1.6 min per run spent compiling from crates.io via `cargo install`.
      - name: Install mdbook-linkcheck (prebuilt binary)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/mdbook-linkcheck.zip \
            https://github.com/Michael-F-Bryan/mdbook-linkcheck/releases/download/v0.7.7/mdbook-linkcheck.x86_64-unknown-linux-gnu.zip
          unzip -o /tmp/mdbook-linkcheck.zip -d "$HOME/.cargo/bin"
          chmod +x "$HOME/.cargo/bin/mdbook-linkcheck"
          mdbook-linkcheck --version

      - name: Install mise toolchain (mdbook + pandoc)
        uses: jdx/mise-action@v2
        with:
          install: false
      - run: mise install aqua:rust-lang/mdBook aqua:jgm/pandoc

      - name: mdBook build
        run: mdbook build docs

      - name: Generate rustdoc for all 6 crates
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps

      # Combine: rustdoc API lives under /api/<crate>/ on the published site.
      # mdBook outputs straight into docs/book/ (no html/ subdir).
      - name: Combine rustdoc into mdBook site
        run: |
          set -euo pipefail
          cp -r target/doc docs/book/api
          touch docs/book/.nojekyll

      # Build the LLM / RAG markdown: clean text for a language model that needs
      # the whole system. Single H1 (# WebFang Documentation) at the top; chapters,
      # crate API sections, and source files are H3 under H2 parents so chunkers
      # split cleanly. Three parts:
      #   1. Narrative (mdBook chapters) — chapter H1 downgraded to H3, no dupes.
      #   2. API reference (rustdoc via pandoc) — ALL noise stripped: <a>, "Expand
      #      description", "§", "Copy item path", stray HTML tags, blank-line runs.
      #   3. Full source code — crates/**/*.rs (production + per-crate tests) so
      #      the model sees the implementation, not just signatures. (No root
      #      `tests/` dir exists; integration tests live per-crate.)
      # Output: docs/book/webfang-docs-llm.md → uploaded as `webfang-docs-llm`,
      # consumed locally by `just docs`.
      - name: Build LLM markdown artifact
        run: |
          set -euo pipefail
          OUT=docs/book/webfang-docs-llm.md
          {
            echo "# WebFang Documentation"
            echo
            echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "---"
            echo
            echo "## Narrative Documentation"
            echo
            for f in overview debugging testing troubleshooting tui-unified-design; do
              # Downgrade the chapter's leading "# Title" to "### Title" so the
              # artifact has a single H1 (the doc title) and no duplicate headers.
              sed '1s/^# /### /' "docs/src/$f.md"
              echo
              echo "---"
              echo
            done

            echo "## API Reference (rustdoc)"
            echo
            for crate in webfang_core webfang_ai webfang_tui webfang_mcp webfang_cli webfang_test_utils; do
              if [ -d "target/doc/$crate" ]; then
                echo "### API: $crate"
                echo
                # Single H1 in the artifact: downgrade rustdoc page titles
                # (Struct/Function/Enum/.../List) to H3 under "## API Reference".
                # Safe: doctest hidden lines (# use ...) never match these words.
                {
                  pandoc -f html -t gfm --wrap=none "target/doc/$crate/index.html" 2>/dev/null
                  find "target/doc/$crate" -name '*.html' ! -name 'index.html' ! -path '*/src/*' -print0 \
                    | sort -z \
                    | while IFS= read -r -d '' fl; do
                        pandoc -f html -t gfm --wrap=none "$fl" 2>/dev/null
                      done
                } \
                | sed -e 's/Copy item path//g' \
                      -e 's/Expand description//g' \
                      -e 's/§//g' \
                      -e 's/<span[^>]*>//g' -e 's/<\/span>//g' \
                      -e 's/<div[^>]*>//g' -e 's/<\/div>//g' \
                      -e 's/<a [^>]*>//g' -e 's/<\/a>//g' \
                      -e 's/<[^>]*>//g' \
                      -e 's/Show [0-9][0-9]* fields[[:space:]]*//g' \
                      -e 's/Show [0-9][0-9]* variants[[:space:]]*//g' \
                      -e 's/^# \(Struct\|Function\|Enum\|Trait\|Constant\|Type\|Crate\|Macro\|List\) /### \1 /' \
                | sed -e '/^[[:space:]]*$/N;/^\n[[:space:]]*$/D' \
                > "target/doc/$crate.md"
                # Gate ONLY the cleaned API markdown. The Source Code section below
                # intentionally contains HTML inside Rust string/test/doc-comment
                # literals (e.g. extractor/html_cleaner/link_extractor tests), so a
                # whole-file grep would false-positive there. The gate is also
                # fence-aware: doctests may legitimately contain HTML inside
                # ``` code fences (e.g. assert!(html.contains("<span"))).
                if awk 'BEGIN{f=0} /^```/{f=!f; next} !f && /Expand description|Copy item path|href="|<a |<span|<div|<abbr|<code|§/{bad=1} END{exit !bad}' "target/doc/$crate.md"; then
                  echo "::error::rustdoc noise not fully stripped for $crate"
                  exit 1
                fi
                cat "target/doc/$crate.md"
                echo
                echo "---"
                echo
              fi
            done

            echo "## Source Code"
            echo
            # Every Rust source file in the workspace (production + per-crate tests),
            # in a deterministic order so the artifact is reproducible. No root `tests/`
            # dir exists; integration tests live under each crate. Files are emitted
            # verbatim — they may contain HTML inside string/test/doc literals.
            find crates -name '*.rs' -print0 \
              | sort -z \
              | while IFS= read -r -d '' fl; do
                  echo "### \`$fl\`"
                  echo
                  echo '```rust'
                  cat "$fl"
                  echo '```'
                  echo
                  echo "---"
                  echo
                done
          } > "$OUT"

          echo "wrote $OUT ($(wc -l < "$OUT") lines)"

      # --- Native GitHub Pages deployment (2025+ "deploy from a workflow") ---
      # configure-pages@v5 enables/gathers the Pages site; upload-pages-artifact
      # packages docs/book (must include index.html at root — it does), and
      # deploy-pages@v4 (OIDC on the github-pages environment) performs the build.
      #
      # Why not the legacy gh-pages branch source? Commits a GHA pushes to a
      # Pages *branch* using GITHUB_TOKEN do NOT trigger a Pages build — that was
      # the root cause of the first deploy's "Site not found". The workflow
      # source used here is immune to that caveat.
      # Artifact name expected by deploy-pages defaults to "github-pages".
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact (mdBook + combined rustdoc)
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/book

      - name: Upload LLM markdown artifact
        uses: actions/upload-artifact@v4
        with:
          name: webfang-docs-llm
          path: docs/book/webfang-docs-llm.md
          if-no-files-found: error
          retention-days: 30

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
