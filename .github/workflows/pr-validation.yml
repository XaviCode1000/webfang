name: PR Validation

env:
  # Gate 0 freeze (Sprint 0 stabilization): blocks type:feature and
  # type:breaking-change PRs. See AGENTS.md Freeze policy.
  FREEZE_FEATURES: "true"
  # Drain window expiry (ISO date YYYY-MM-DD) or empty = no active drain.
  # Contract: setting FREEZE_FEATURES="false" REQUIRES all three:
  #   (a) a linked issue documenting why the drain is open,
  #   (b) this date set to a hard deadline,
  #   (c) the closing revert PR created in the same batch that opens the drain.
  # After this date EVERY PR fails validation until the flag is restored —
  # a forgotten drain fails closed instead of silently disabling the gate.
  FREEZE_DRAIN_UNTIL: ""

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]
  merge_group:

permissions:
  pull-requests: read

jobs:
  validate:
    name: Validate PR metadata
    runs-on: ubuntu-latest
    steps:
      # Resolve the real PR for both pull_request and merge_group runs.
      # Fail closed: this is a required check — if the PR cannot be
      # resolved, the check fails instead of silently passing.
      - name: Resolve PR number
        id: prnum
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.event.merge_group.head_ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$HEAD_REF" ]; then
            echo "::error::No se pudo resolver el head ref del PR (evento: ${{ github.event_name }})."
            exit 1
          fi
          # REST API (deterministic): the "head" filter requires user:branch format.
          PR=$(gh api "repos/$REPO/pulls?state=open&head=${{ github.event.pull_request.head.repo.owner.login || github.repository_owner }}:$HEAD_REF" --jq '.[0].number' 2>&1 || true)
          if ! printf '%s' "$PR" | grep -qE '^[0-9]+$'; then
            echo "::error::No se pudo resolver el PR para la rama '$HEAD_REF' (evento: ${{ github.event_name }}). Detalle: $PR"
            exit 1
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "Resolved PR #$PR"

      - name: Require linked issue
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.prnum.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BODY=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json body --jq '.body // ""')
          # Accept the partial form too. GitHub's own auto-close only fires on the
          # strict adjacency (`Closes #N`), so `Closes part of #N` passes this check
          # WITHOUT closing the umbrella — which is exactly the semantics a partial
          # slice needs. Before #1010 the strict-only regex forced every partial PR
          # in a chain to write a full-closing keyword, which auto-closed #994 after
          # sub-slice 1 of 5 with 0 of 11 acceptance criteria met.
          if ! printf '%s' "$BODY" | grep -qiE '(closes|fixes|resolves)([[:space:]]+(part|some|one)[[:space:]]+of)?[[:space:]]*#[[:space:]]*[0-9]+'; then
            echo "::error::El cuerpo del PR debe vincular una issue con 'Closes #N', 'Fixes #N' o 'Resolves #N'. Para un slice parcial de una issue paraguas usa 'Closes part of #N' (pasa esta validación y NO cierra la issue)."
            exit 1
          fi
          echo "OK: issue vinculada."

      - name: Require exactly one type:* label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.prnum.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          count=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels \
            --jq '[.labels[].name | select(startswith("type:"))] | length')
          if [ "$count" -ne 1 ]; then
            echo "::error::El PR debe tener exactamente un label 'type:*' (encontrados: $count)."
            exit 1
          fi
          echo "OK: label type:* presente."

      - name: Require conventional branch name
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.prnum.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          HEAD_REF=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefName --jq '.headRefName')
          if ! printf '%s' "$HEAD_REF" | grep -qE '^(feat|fix|chore|docs|style|refactor|perf|test|build|ci|revert)/[a-z0-9._-]+$'; then
            echo "::error::La rama '$HEAD_REF' debe seguir el patron type/description (ej: fix/mi-bug)."
            exit 1
          fi
          echo "OK: nombre de rama."

      # Freeze Gate 0 — enforce_admins:true (branch protection) guarantees admins also blocked
      - name: Freeze Gate 0 — reject type:feature/breaking-change
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.prnum.outputs.pr }}
          REPO: ${{ github.repository }}
          FREEZE: ${{ env.FREEZE_FEATURES }}
          DRAIN_UNTIL: ${{ env.FREEZE_DRAIN_UNTIL }}
        run: |
          set -euo pipefail
          # Drain window expiry — fail closed on EVERY PR once past the
          # deadline, so an open drain cannot outlive its TTL silently.
          if [ -n "$DRAIN_UNTIL" ]; then
            today=$(date -u +%Y-%m-%d)
            if [ "$today" \> "$DRAIN_UNTIL" ]; then
              echo "::error::Gate 0 freeze drain expired on $DRAIN_UNTIL and was never restored. Restore FREEZE_FEATURES=\"true\" (or deliberately extend FREEZE_DRAIN_UNTIL in a new commit) before any PR can merge."
              exit 1
            fi
            echo "Drain active until $DRAIN_UNTIL"
          fi
          [ "$FREEZE" = "true" ] || { echo "Freeze OFF — skip"; exit 0; }
          labels=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '[.labels[].name]')
          echo "Labels: $labels"
          # Check if labels contain frozen types (value inspection, not just prefix)
          has_frozen=false
          if echo "$labels" | jq -e 'contains(["type:feature"]) or contains(["type:breaking-change"])' >/dev/null; then
            has_frozen=true
          fi
          if [ "$has_frozen" != "true" ]; then echo "OK: no frozen type"; exit 0; fi
          if echo "$labels" | jq -e 'contains(["freeze-exception"])' >/dev/null; then
            decision=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --jq '[.[] | select(.state=="APPROVED") | .author.login] | length' 2>&1 || echo 0)
            # Ensure decision is numeric; non-numeric (fail-closed) => 0
            if ! printf '%s' "$decision" | grep -qE '^[0-9]+$'; then decision=0; fi
            if [ "$decision" -gt 0 ]; then echo "OK: freeze-exception + CODEOWNER approval"; exit 0; fi
            echo "::error::Gate 0 freeze — 'freeze-exception' requires CODEOWNER approval (see sdd/stabilization-sprint0-baseline, AGENTS.md Freeze policy)."; exit 1
          fi
          echo "::error::Gate 0 freeze activo (Sprint 0) — type:feature/type:breaking-change bloqueado. Usa label 'freeze-exception' + aprobación CODEOWNER o espera a Sprint 1. Ver sdd/stabilization-sprint0-baseline (SDD Gate 0)."
          exit 1
