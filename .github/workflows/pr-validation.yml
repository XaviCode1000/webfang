name: PR Validation

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]
  merge_group:

permissions:
  pull-requests: read
  issues: read

jobs:
  # ==========================================================================
  # Auto-label the PR type (#2126) — it runs BEFORE the validation job.
  #
  # The gate "Require exactly one type:* label" below starts RED on a PR
  # opened without a label, and GitHub cannot apply a label from a PR
  # template (the issues template can, the pull-request template cannot).
  # This job is what APPLIES the rule the title already declares.
  #
  # TWO PROPERTIES, BOTH LOAD-BEARING:
  #
  #   - NO RACE. `validate` declares `needs: auto-label-type`, so the
  #     validation starts only once the labeler has finished. A validation
  #     running in parallel would observe the missing label and go red on a
  #     PR that is about to be labelled — and the validation does NOT
  #     re-evaluate on its own when the label lands later (a PR opened
  #     before the label stays red until a forced re-run).
  #
  #   - THE LABELER NEVER BLOCKS THE VALIDATION. `continue-on-error: true`
  #     keeps a labeler failure (a fork PR whose token is read-only, a
  #     missing permission, a bug in the script) from failing the workflow,
  #     and `validate` runs with `!cancelled()` so it runs no matter how the
  #     labeler ended. A PR that could not be labelled keeps today's
  #     behaviour: red until a human labels it.
  #
  #   - THE BOT NEVER FIGHTS A HUMAN. The labeler reacts to `opened` and
  #     `edited` only (see the job below), so a label a human sets is never
  #     replaced by the bot.
  # ==========================================================================
  auto-label-type:
    name: Auto-label PR type
    continue-on-error: true
    # The labeler reacts to EXACTLY two events:
    #
    #   - `opened`: the PR carries no label yet.
    #   - `edited`: the title changed, so the label derived from it can
    #     legitimately change — the stale `type:*` label is replaced by the
    #     derived one, and the PR ends with exactly one.
    #
    # It does NOT react to `labeled` / `unlabeled` / `synchronize` /
    # `reopened`. A bot that reacted to `labeled` would fight a human over
    # the label forever: the human sets one, the event fires, the bot
    # replaces it, the human sets it again, ... The ping-pong is impossible
    # because the bot only ever acts on a TITLE it was handed.
    #
    # The WORKFLOW's own event list stays wide on purpose: it also carries
    # the required "Validate PR metadata" job, and a workflow that did not
    # run on `synchronize` would leave that required check unreported after
    # a new push (the PR would sit on "Expected" forever).
    if: ${{ github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'edited') }}
    runs-on: ubuntu-latest
    permissions:
      # Minimal, exactly as #2126 asks: `contents: read` for the checkout
      # and `pull-requests: write` — the documented permission for "add a
      # label to a pull request". Nothing else.
      contents: read
      pull-requests: write
    steps:
      # The BASE, never the head. This job runs code with a write-scoped
      # token, so it must never run the PR's code: a branch could carry a
      # modified scripts/auto_label_type.sh and the write token would be
      # handed to it. The decision needs only the API (the title and the
      # labels), so the trusted script from the base branch is enough.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Apply the type label from the PR title
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/auto_label_type.sh ]; then
            echo "::notice::La rama base todavia no tiene scripts/auto_label_type.sh: no hay nada que etiquetar."
            exit 0
          fi
          bash scripts/auto_label_type.sh

  # The semantics harness for the script above. It is hermetic and offline
  # (a fake `gh`, mktemp fixtures, no network), so it costs about a second
  # per event. It runs HERE, and not in ci.yml's repo-guards job, because
  # that file is outside the scope of #2126.
  auto-label-semantics:
    name: Auto-label harness (offline)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The HEAD this time: the harness must test the code the PR proposes.
      # The token here is read-only, so running the PR's script is safe.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Auto-label semantics harness (offline)
        run: bash scripts/test_auto_label_type.sh
      - name: Auto-label end-state oracle (offline)
        run: bash scripts/test_auto_label_type_state.sh

  validate:
    name: Validate PR metadata
    # The labeler runs first (the job above): `needs` makes this job wait
    # for it, so the validation never observes a missing `type:*` label that
    # the labeler is about to add. `!cancelled()` keeps it running whatever
    # the labeler did — a labeler failure must never turn this required
    # check into "never reported".
    needs: auto-label-type
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      # fetch-depth: 0 is required by the support-drift step below: the
      # published-scope check reads `git tag --list 'v*'` and refuses a
      # shallow clone on purpose (scripts/check_support_drift.sh:120-122).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0

      # The support-drift gate lives here, not in support-drift.yml, because
      # that workflow is path-filtered on the support surface: a path-filtered
      # workflow never reports on PRs outside the filter, so GitHub would hold
      # those PRs "pending" forever if it were a required context. This job is
      # already required and runs on every PR and merge_group, so the gate is
      # enforced without touching branch protection (docs/ci-slo.md:60).
      # support-drift.yml keeps the same check on push to main for the
      # post-merge drift a release tag can introduce.
      # The step name carries the surface: the required context is the job name
      # ("Validate PR metadata"), which cannot be dynamic, so this is the first
      # line a maintainer sees above the failure.
      - name: "Support drift: .github/support.json vs published v* tags (enforcing)"
        run: scripts/check_support_drift.sh --scope=published

      # Resolve the real PR for both pull_request and merge_group runs.
      # Fail closed: this is a required check — if the PR cannot be
      # resolved, the check fails instead of silently passing.
      - name: Resolve PR number
        id: prnum
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_GROUP_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request|pull_request_target)
              PR="$PR_NUMBER"
              ;;
            merge_group)
              # A merge_group run carries a SYNTHETIC ref, not the PR head:
              #   refs/heads/gh-readonly-queue/<base>/pr-<N>-<sha>
              # The old `pulls?head=<owner>:<ref>` lookup could never match it,
              # so this required check failed on every merge group and the
              # queue rejected every entry. Parse the PR number the ref encodes.
              # Accept both forms: the payload may or may not prefix the ref
              # with `refs/heads/`.
              PR="$(printf '%s' "$MERGE_GROUP_REF" \
                | sed -nE 's#^(refs/heads/)?gh-readonly-queue/.+/pr-([0-9]+)-[^/]+$#\2#p')"
              ;;
            *)
              echo "::error::Evento no soportado para resolver el PR: $EVENT_NAME"
              exit 1
              ;;
          esac
          if ! printf '%s' "$PR" | grep -qE '^[0-9]+$'; then
            echo "::error::No se pudo resolver el PR (evento: $EVENT_NAME, ref: ${MERGE_GROUP_REF:-})."
            exit 1
          fi
          state="$(gh pr view "$PR" --repo "$REPO" --json state --jq '.state')"
          if [ "$state" != "OPEN" ]; then
            echo "::error::El PR #$PR no está abierto (state=$state)."
            exit 1
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "Resolved PR #$PR (event: $EVENT_NAME)"

      - name: Require linked issue
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.prnum.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BODY=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json body --jq '.body // ""')
          # Accept the partial form too. GitHub's own auto-close only fires on the
          # strict adjacency (`Closes #N`), so `Closes part of #N` passes this check
          # WITHOUT closing the umbrella — which is exactly the semantics a partial
          # slice needs. Before #1010 the strict-only regex forced every partial PR
          # in a chain to write a full-closing keyword, which auto-closed #994 after
          # sub-slice 1 of 5 with 0 of 11 acceptance criteria met.
          if ! printf '%s' "$BODY" | grep -qiE '(closes|fixes|resolves)([[:space:]]+(part|some|one)[[:space:]]+of)?[[:space:]]*#[[:space:]]*[0-9]+'; then
            echo "::error::El cuerpo del PR debe vincular una issue con 'Closes #N', 'Fixes #N' o 'Resolves #N'. Para un slice parcial de una issue paraguas usa 'Closes part of #N' (pasa esta validación y NO cierra la issue)."
            exit 1
          fi
          echo "OK: issue vinculada."

      - name: Require status:approved on linked issues
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.prnum.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BODY=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json body --jq '.body // ""')
          # Same keyword family as the linked-issue check (including the
          # partial form `Closes part of #N`). EVERY linked issue must carry
          # the protected `status:approved` label BEFORE a PR can reference
          # it — the maintainer's explicit approval gate (branch-pr skill,
          # institutionalized 2026-09-11). `status:approved` is a protected
          # label: only the maintainer (or an actor with verified
          # MAINTAIN/ADMIN) adds it, never the PR author agent.
          NUMBERS=$(printf '%s' "$BODY" | grep -oiE '(closes|fixes|resolves)([[:space:]]+(part|some|one)[[:space:]]+of)?[[:space:]]*#[[:space:]]*[0-9]+' | grep -oE '[0-9]+' | sort -un || true)
          if [ -z "$NUMBERS" ]; then
            echo "::error::No se pudo extraer el número de issue vinculado del cuerpo del PR."
            exit 1
          fi
          MISSING=""
          for N in $NUMBERS; do
            if ! gh issue view "$N" --repo "$REPO" --json labels --jq '[.labels[].name]' | grep -q '"status:approved"'; then
              MISSING="$MISSING #$N"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Toda issue vinculada debe tener el label 'status:approved' (faltan:$MISSING). El label es protegido: pedí al mantenedor que apruebe la issue antes de abrir el PR."
            exit 1
          fi
          echo "OK: todas las issues vinculadas tienen status:approved."

      - name: Require exactly one type:* label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.prnum.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          count=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels \
            --jq '[.labels[].name | select(startswith("type:"))] | length')
          if [ "$count" -ne 1 ]; then
            echo "::error::El PR debe tener exactamente un label 'type:*' (encontrados: $count)."
            exit 1
          fi
          echo "OK: label type:* presente."

      - name: Require conventional branch name
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.prnum.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          HEAD_REF=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefName --jq '.headRefName')
          # Exempt release-plz bot branches: `chore/release-<ISO-timestamp>Z`
          # carries uppercase T/Z and colons that the human branch regex
          # below never accepted (see #1474: PR #1463 blocked). Bot-owned
          # release flow, not a human naming violation.
          case "$HEAD_REF" in
            chore/release-*) echo "OK: release-plz bot branch (exempt)."; exit 0 ;;
          esac
          if ! printf '%s' "$HEAD_REF" | grep -qE '^(feat|fix|hotfix|chore|docs|style|refactor|perf|test|build|ci|revert|release|support)/[a-z0-9._-]+$'; then
            echo "::error::La rama '$HEAD_REF' debe seguir el patron type/description (ej: fix/mi-bug)."
            exit 1
          fi
          echo "OK: nombre de rama."

      - name: Reject AI attribution in commit messages
        # AGENTS.md forbids `Co-Authored-By` and AI attribution; nothing
        # enforced it, so a PR landed with a Codebuff co-author and a
        # "Generated with" line while every check stayed green.
        # Deliberately NOT a blanket trailer ban: release-plz signs every
        # release commit, so an allowlist of automation actors is the rule.
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.prnum.outputs.pr }}
          REPO: ${{ github.repository }}
        run: scripts/check_no_ai_attribution.sh

      - name: Validate branch topology (enforcing)
        # Enforcing: misrouted PRs (e.g. hotfix/* against main) fail this
        # required check. The conventional-branch regex above admits the
        # support-line heads (hotfix/*, release/*, support/*) so no enforced
        # arm is dead on arrival.
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.prnum.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Read the refs from the resolved PR, never from the event. In a
          # merge_group run github.head_ref/base_ref are the synthetic queue ref
          # (`refs/heads/gh-readonly-queue/<base>/pr-<N>-<sha>`), which the
          # topology table rejects.
          meta="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefName,baseRefName)"
          HEAD_REF="$(printf '%s' "$meta" | jq -r '.headRefName')"
          BASE_REF="$(printf '%s' "$meta" | jq -r '.baseRefName')"
          HEAD_REF="$HEAD_REF" BASE_REF="$BASE_REF" scripts/check-topology.sh
