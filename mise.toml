[tools]
# === Core ===
rust = "1.88"                          # MSRV — keep in sync with Cargo.toml rust-version

# === Build acceleration ===
# mold is deliberately NOT installed: there is no way to scope it to
# local-only builds, and ubuntu-latest CI has no mold, so wiring it would
# break every CI link step.
sccache = "latest"                     # compiler cache

# === Task runner ===
just = "latest"                        # command recipes

# === Dev tools (aqua — prebuilt binaries, no compilation) ===
cargo-binstall = "latest"              # bootstraps cargo tools from prebuilt binaries
typos = "1.42.3"                       # spell checker (aqua shorthand, pinned for MSRV compat)

# === Dev tools (cargo backend — prebuilt via binstall when available) ===
"cargo:cargo-nextest" = "0.9.114"      # test runner (pinned — latest requires Rust >1.88)
"cargo:cargo-deny" = "latest"          # license/advisory/ban audit
"cargo:cargo-audit" = "latest"         # security advisory check
"cargo:cargo-machete" = "latest"       # unused dependency detection
"cargo:cargo-edit" = "0.13.5"           # cargo add/rm/upgrade (pinned — newer requires rustc ≥1.89)
"aqua:mitsuhiko/insta" = "1.48.0"       # cargo-insta CLI (prebuilt) — pinned to match insta lib in Cargo.lock
"cargo:bacon" = "latest"                # watch-mode background checker (uses repo bacon.toml)
"aqua:rhysd/actionlint" = "1.7.12"      # GitHub Actions workflow linter — catches block-scalar nesting bugs YAML parsers miss (#836)
"aqua:koalaman/shellcheck" = "0.11.0"   # required by actionlint's shellcheck rule — without it, `run: |` nesting bugs go undetected (#836)
"aqua:rust-lang/mdBook" = "0.4.51"
"aqua:jgm/pandoc" = "3.10.1"

# === Optional (uncomment when needed) ===
# rust-analyzer — pinned EXACT at project level (#1280): date-versioned by mise;
# pinning keeps RA deterministic across sessions and worktrees. The previous
# setup resolved RA through a fragile chain (rustup proxy for a non-installed
# component falling back to a floating "latest"), a documented false-positive
# source when RA and rustc drift apart.
rust-analyzer = "2026-09-07"
# "cargo:cargo-outdated" = "latest"    # no aqua, no binstall — compiles
# "cargo:cargo-expand" = "latest"      # no aqua, no binstall — compiles
# "cargo:cargo-watch" = "latest"       # no aqua, no binstall — compiles
# "cargo:cargo-llvm-cov" = "latest"    # no aqua, no binstall — compiles
# Pinned to 27.1.0 to match CI exactly (.github/workflows/mutants.yml:106,155).
# Local verification of PR-diff mutations before push mirrors the CI job;
# the weekly full-scope 16-shard job still runs on schedule from CI.
"cargo:cargo-mutants" = "27.1.0"        # no aqua, no binstall — compiles from source (~5-10 min first time)

[env]
# RUSTC_WRAPPER is deliberately NOT declared here, and no build context on this
# machine uses it. Two independent measured reasons:
#   - main keeps CARGO_INCREMENTAL=1, and `-C incremental` makes every unit
#     non-cacheable (observed: 122 of 207 sccache requests rejected with
#     reason=incremental).
#   - worktrees isolate their target dir (#1267), and sccache's Rust cache key
#     embeds that path, so an identical source in a new tree scores zero hits
#     (verified with a private cache and a positive control: same dir hits,
#     different dir misses, duplicate objects per unit).
# Declaring it here would also be inescapable: mise re-applies [env] on every
# cd, and this file is byte-identical across main, every worktree and every
# clone, so per-tree opt-out would have to race direnv. Per-tree policy lives
# in each tree's .envrc; the bootstrap block in AGENTS.md carries it into a
# fresh clone.

[tasks.setup]
description = "Install and verify local development tools"
run = [
  "mise install",
  "just setup",
]

[tasks.check]
description = "Run the fast local compile check"
run = "cargo check"

[tasks.analyze]
description = "Refresh the CodeDB index"
run = "codedb index ."
