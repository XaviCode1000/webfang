# Codecov configuration for webfang
# Docs: https://docs.codecov.com/docs/codecovyml-reference

coverage:
  status:
    project:
      default:
        target: auto # compare against PR base commit
        threshold: 2% # tolerate up to 2% drop
      core:
        flags: [core]
        target: auto
        threshold: 2%
      mcp:
        flags: [mcp]
        target: auto
        threshold: 2%
      tui:
        flags: [tui]
        target: auto
        threshold: 3% # UI is inherently harder to test
      ai:
        flags: [ai]
        target: auto
        threshold: 5% # feature-gated (ONNX), coverage is less stable
      cli:
        flags: [cli]
        target: auto
        threshold: 3% # thin binary, mostly integration-tested
    patch:
      default:
        target: 80% # new/changed lines must have >= 80% coverage

# Per-crate flags — Codecov auto-assigns coverage by file path (no CI changes).
# carryforward: if a flag's tests don't run in a given CI pass, the last known
# coverage is carried forward instead of reporting 0%.
flags:
  core:
    paths:
      - crates/webfang_core/src/
    carryforward: true
  mcp:
    paths:
      - crates/webfang_mcp/src/
    carryforward: true
  tui:
    paths:
      - crates/webfang_tui/src/
    carryforward: true
  ai:
    paths:
      - crates/webfang_ai/src/
    carryforward: true
  cli:
    paths:
      - crates/webfang_cli/src/
    carryforward: true

# Paths that should not count toward coverage metrics
ignore:
  - "tests/"
  - "**/tests/"
  - "benches/"
  - "examples/"

# Per-crate coverage breakdown (server-side, no CI changes needed)
# Docs: https://docs.codecov.com/docs/components
component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        threshold: 2%
  individual_components:
    - component_id: webfang_core
      name: "Core Engine"
      paths:
        - "crates/webfang_core/**"
    - component_id: webfang_ai
      name: "AI / Embeddings"
      paths:
        - "crates/webfang_ai/**"
    - component_id: webfang_tui
      name: "TUI Selector"
      paths:
        - "crates/webfang_tui/**"
    - component_id: webfang_mcp
      name: "MCP Server"
      paths:
        - "crates/webfang_mcp/**"
    - component_id: webfang_cli
      name: "CLI Binary"
      paths:
        - "crates/webfang_cli/**"

comment:
  layout: "diff, files, components"
  behavior: default
