# Cargo configuration for local development

[alias]
# Quick test with console enabled
# Usage: cargo console -- --url https://example.com
# Injects tokio_unstable so console-subscriber compiles out of the box (#task 4.3).
console = ["run", "-p", "webfang_cli", "--bin", "webfang", "--features", "console", "--config", 'env.RUSTFLAGS="--cfg tokio_unstable"']

# Build with tokio_unstable (for tokio-console)
# Usage: cargo debug
debug = ["build", "-p", "webfang_cli", "--bin", "webfang", "--features", "console", "--config", 'env.RUSTFLAGS="--cfg tokio_unstable"']

# NOTE: no [profile] sections here on purpose. Cargo resolves config.toml from
# the CWD upward, so a profile declared in this file re-keys every unit hash for
# any invocation whose CWD is outside the repository (cron, IDE, mise exec,
# --manifest-path). [profile.dev] lives in Cargo.toml for that reason.
