# cargo-mutants configuration — WebFang hot-path mutation scope
#
# IMPORTANT: This file is FLAT TOML — top-level keys only. There is no
# per-package table (`[webfang_core]` does not exist in the schema).
# Reference: https://json.schemastore.org/cargo-mutants-config.json
#
# `examine_globs` is the mutation scope: only files matching these globs
# are mutated (analog of `-f`). `-d/--dir` selects the tree root, NOT the
# mutation scope — never use it to filter files.
#
# Scope decision (2026-08): only the 6 gated hot paths, ~600 mutants.
# The whole crate is ~3182 mutants — too slow for any CI budget.
#
# Scope decision (2026-09, #1235 / AUDIT-01 F-40): the 2026-08 scope
# excluded every file where AUDIT-01 found a defect and where F-47's
# hand-applied mutants survived (13/18, clustered in the product's
# spine). Those files are gated BELOW. This file is now the SINGLE
# source of the mutation-scope policy: `.github/workflows/mutants.yml`
# derives its hot-path detector from `examine_globs` instead of keeping
# a second, hand-maintained copy that had already drifted.
#
# CI budget: the 2026-09 extension widened the mutation scope, so the weekly
# baseline is sharded 64 ways (--shard k/64) to keep per-shard load inside the
# 90-minute timeout. `.github/workflows/mutants.yml` owns the shard count and
# the per-shard mutant estimate; keep the two in agreement. The required
# PR-diff job mutates only in-diff functions, so typical PR cost is unchanged.

examine_globs = [
  # 2026-08 scope: the original 6 gated hot paths.
  "crates/webfang_core/src/application/crawler/**",
  "crates/webfang_core/src/application/pipeline/**",
  "crates/webfang_core/src/extractor/**",
  "crates/webfang_core/src/infrastructure/network/**",
  "crates/webfang_core/src/infrastructure/http/waf_engine.rs",
  "crates/webfang_core/src/infrastructure/bridge.rs",
  # 2026-09 scope (#1235): defect files from AUDIT-01 F-47's surviving
  # mutants — persistence, URL hardening, planning, discovery, export,
  # and the downloader stack. Keep entries quote-free-comment-safe: the
  # workflow derives its regex by extracting quoted strings from this
  # array, so comments inside the array must not contain double quotes.
  "crates/webfang_core/src/domain/persistence.rs",
  "crates/webfang_core/src/domain/value_objects.rs",
  "crates/webfang_core/src/application/url_filter.rs",
  "crates/webfang_core/src/cli/orchestrator.rs",
  "crates/webfang_core/src/cli/url_discovery.rs",
  "crates/webfang_core/src/infrastructure/converter/wikilinks.rs",
  "crates/webfang_core/src/infrastructure/export/state_store.rs",
  "crates/webfang_core/src/infrastructure/crawler/checkpoint.rs",
  "crates/webfang_core/src/infrastructure/downloader/**",
]

# Re-exports and module glue add no mutation signal.
exclude_globs = [
  "**/mod.rs",
  "crates/webfang_core/src/lib.rs",
]
