[package]
name = "webfang_cli"
description = "CLI entry point for webfang"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["images", "documents"]
images = ["webfang_core/images"]
documents = ["webfang_core/documents"]
ai = ["dep:webfang_ai", "webfang_ai/ai", "webfang_core/ai"]
adaptive-selectors = ["webfang_core/adaptive-selectors"]
chromium = ["webfang_core/chromium"]
mcp = ["webfang_core/mcp"]
persistence = ["webfang_core/persistence"]
console = ["webfang_core/console"]
dev-tracing = ["webfang_core/dev-tracing"]

[[bin]]
name = "webfang"
path = "src/main.rs"

[dependencies]
webfang_core = { workspace = true }
webfang_ai = { workspace = true, optional = true }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Async
tokio = { workspace = true }

# Error handling
dirs = { workspace = true }

# Logging
tracing = { workspace = true }

# URL
url = { workspace = true }

# Serialization
serde_json = { workspace = true }


[lints]
workspace = true
