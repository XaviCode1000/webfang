[package]
name = "webfang_cli"
description = "CLI entry point for webfang"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# #1813 T4: emptied alongside `webfang_core`. The forwarded `images` /
# `documents` markers selected nothing but a divergent MIME table; every other
# feature here is capability-backed (each forwards a `webfang_core` feature that
# gates code or dependencies). Same explicit-empty reasoning as the core
# manifest.
default = []
adaptive-selectors = ["webfang_core/adaptive-selectors"]
chromium = ["webfang_core/chromium"]
# #1815 T4: the `mcp` key becomes an EXPLICIT EMPTY MARKER — it is NOT
# deleted, because the key has to EXIST: the CLI harness
# (`crates/webfang_core/tests/common/cli_harness.rs`) forwards its own `mcp`
# feature into the child build, so the binary under test is built with
# `--features mcp`, and `release.yml`, `docs.yml`,
# `scripts/check_compatibility.sh`, `scripts/gen-cli-reference.sh` and the
# third-party notices do the same. Removing the key breaks those consumers; an
# empty marker keeps the flag valid and says out loud that it selects nothing.
#
# It selected nothing before either: `webfang_core/mcp` is itself an empty
# marker and gates NO production site in `webfang_core`. The consumers that
# remain are the `webfang_mcp` test suites — which carry webfang_mcp's OWN
# `mcp` feature, not this one — and the CLI harness above, which builds the
# binary with `--features mcp`. The forwarding edge was the only thing left of
# it.
mcp = []
persistence = ["webfang_core/persistence"]
console = ["webfang_core/console"]
dev-tracing = ["webfang_core/dev-tracing"]

[[bin]]
name = "webfang"
path = "src/main.rs"

[dependencies]
webfang_core = { workspace = true }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Async
tokio = { workspace = true }

# Logging
tracing = { workspace = true }

# Crypto / encoding (for consent hash)
sha2 = { workspace = true }
url = { workspace = true }


[lints]
workspace = true
