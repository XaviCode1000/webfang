[package]
name = "webfang_cli"
description = "CLI entry point for webfang"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# #1813 T4: emptied alongside `webfang_core`. The forwarded `images` /
# `documents` markers selected nothing but a divergent MIME table; every other
# feature here is capability-backed (`ai` pulls `webfang_ai`, the rest forward a
# `webfang_core` feature that gates code or dependencies). Same explicit-empty
# reasoning as the core manifest.
default = []
ai = ["dep:webfang_ai", "webfang_ai/ai", "webfang_core/ai"]
adaptive-selectors = ["webfang_core/adaptive-selectors"]
chromium = ["webfang_core/chromium"]
mcp = ["webfang_core/mcp"]
persistence = ["webfang_core/persistence"]
console = ["webfang_core/console"]
dev-tracing = ["webfang_core/dev-tracing"]

[[bin]]
name = "webfang"
path = "src/main.rs"

[dependencies]
webfang_core = { workspace = true }
webfang_ai = { workspace = true, optional = true }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Async
tokio = { workspace = true }

# Logging
tracing = { workspace = true }


[lints]
workspace = true
