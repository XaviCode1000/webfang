[package]
name = "webfang_core"
description = "Core scraping library — domain, application, and infrastructure layers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["images", "documents"]
images = []
documents = []
persistence = ["dep:rusqlite", "dep:deadpool-sqlite", "dep:sys-info"]
console = ["dep:console-subscriber"]
dev-tracing = ["dep:tracing-tree"]
# Marker features for backward-compatible cfg gates.
# These are activated by dependent crates (ai, tui, mcp) to preserve
# existing cfg(feature) gates in core during the transition period.
ai = []
adaptive-selectors = []
ui = []
mcp = []
chromium = ["dep:chromiumoxide"]

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
toml = "0.8"
pathdiff = "0.2"

# Async runtime
tokio = { workspace = true }
tokio-util = { workspace = true }

# HTTP & Networking
wreq = { workspace = true }
wreq-util = { workspace = true }
bytes = { workspace = true }

# Content Extraction
legible = { workspace = true }
htmd = { workspace = true }
strsim = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# HTML Parsing
scraper = { workspace = true }
lol_html = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
tracing-tree = { workspace = true, optional = true }

# tokio-console
console-subscriber = { workspace = true, optional = true }

# Utilities
url = { workspace = true }
percent-encoding = { workspace = true }
globset = { workspace = true }
futures = { workspace = true }
regex = { workspace = true }
heck = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
dirs = { workspace = true }
num_cpus = { workspace = true }
once_cell = { workspace = true }
uuid = { workspace = true }
walkdir = { workspace = true }
fs2 = { workspace = true }
sysinfo = { workspace = true }
aho-corasick = { workspace = true }
whatlang = { workspace = true }
url-normalize = { workspace = true }
secrecy = { workspace = true }

# HTML to Markdown
html-to-markdown-rs = { workspace = true }
syntect = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }

# XML
quick-xml = { workspace = true }

# Rate limiting
governor = { workspace = true }
dashmap = { workspace = true }
ahash = { workspace = true }

# Progress
indicatif = { workspace = true }

# Markdown parsing
pulldown-cmark = { workspace = true }

# Async compression
async-compression = { workspace = true }

# Security

# Competitive Features
crc32fast = { workspace = true }
robotstxt = { workspace = true }

# SQLite persistence (feature-gated)
rusqlite = { workspace = true, optional = true }
deadpool-sqlite = { workspace = true, optional = true }
sys-info = { workspace = true, optional = true }

# Browser automation (CDP)
chromiumoxide = { workspace = true, optional = true }

# CPU pool
rayon = "1.10"

[build-dependencies]
built = { version = "0.7", features = ["git2", "chrono"] }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }
proptest = { workspace = true }
criterion = { version = "0.5", features = ["html_reports"] }
insta = { workspace = true }
regex = { workspace = true }
webfang_test_utils = { workspace = true }
trybuild = "1"

# Integration tests parse exported JSONL lines directly.
serde_json = { workspace = true }

# Compile-fail proof suite lives in a subdir; declare it explicitly.
[[test]]
name = "page_state"
path = "tests/compile_fail/page_state.rs"

# ---------------------------------------------------------------------------


# ---------------------------------------------------------------------------
# Benchmarks (criterion). The bench files live in the root `benches/` tree
# (outside this crate's directory), so they must be wired explicitly — the
# workspace root is virtual (no `[package]`) and won't auto-discover them.
# `harness = false` because criterion provides its own `main` via
# `criterion_main!`.
# ---------------------------------------------------------------------------
[[bench]]
name = "cosine_similarity"
path = "../../benches/cosine_similarity.rs"
harness = false

[[bench]]
name = "export"
path = "../../benches/export.rs"
harness = false

[[bench]]
name = "html_conversion"
path = "../../benches/html_conversion.rs"
harness = false

[[bench]]
name = "link_extraction"
path = "../../benches/link_extraction.rs"
harness = false

[[bench]]
name = "readability"
path = "../../benches/readability.rs"
harness = false

[[bench]]
name = "sitemap_parsing"
path = "../../benches/sitemap_parsing.rs"
harness = false

[[bench]]
name = "url_parsing"
path = "../../benches/url_parsing.rs"
harness = false

[[bench]]
name = "waf_detection"
path = "../../benches/waf_detection.rs"
harness = false

[[bench]]
name = "tracing_overhead"
path = "../../benches/tracing_overhead.rs"
harness = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
