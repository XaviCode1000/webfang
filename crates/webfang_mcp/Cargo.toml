[package]
name = "webfang_mcp"
description = "Model Context Protocol server for webfang"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
mcp = ["webfang_core/mcp"]
# Vault search (#433): ONNX embedding adapter + Markdown chunker.
# Note: the SQLite note repository requires `persistence` SEPARATELY —
# the consumer (CLI binary, MCP example) opts in with `--features ai,persistence`.
ai = ["dep:webfang_ai", "webfang_ai/ai", "webfang_core/ai"]
persistence = ["webfang_core/persistence"]

[dependencies]
webfang_core = { workspace = true }
webfang_ai = { workspace = true, optional = true }

# MCP
rmcp = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
schemars = { workspace = true }
governor = { workspace = true }

# CLI
clap = { workspace = true }

# Async
tokio = { workspace = true }
tokio-util = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Utilities
url = { workspace = true }
wreq = { workspace = true }

[[bin]]
name = "webfang-mcp"
path = "src/bin/mcp_server_http.rs"

[[bin]]
name = "webfang-mcp-stdio"
path = "src/bin/mcp_server_stdio.rs"

[dev-dependencies]
webfang_core = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
schemars = { workspace = true }
insta = { workspace = true }
scraper = { workspace = true }
wiremock = { workspace = true }
proptest = { workspace = true }
serial_test = { workspace = true }



[lints]
workspace = true
