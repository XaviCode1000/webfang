[package]
name = "webfang_mcp"
description = "Model Context Protocol server for webfang"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# #1852 (lote L8): `mcp` is in the DEFAULT set.
#
# The 22 integration-test files of this crate are gated on
# `#![cfg(feature = "mcp")]`. With the feature out of the default set,
# `cargo nextest run -p webfang_mcp` (no flags) BUILT those 22 targets and
# ran ZERO tests in them: the run reported green while 151 tests never ran.
# That is the false green this issue is about, in this crate.
#
# Putting the feature in the default costs no build and no dependency: on the
# core side `mcp` is an empty marker (`webfang_core/mcp = []`, which gates no
# production site), and the tests it unblocks are the ones this package exists
# to prove.
#
# The guard `scripts/check_empty_test_targets.sh` is what keeps this from
# coming back: a gated target whose feature is NOT in the default has to be
# declared with `required-features`, and these targets are deliberately not
# declared that way — they RUN by default now.
default = ["mcp"]
mcp = ["webfang_core/mcp"]
# Vault search (#433). The local ONNX embedding adapter is gone (ADR-0004
# paso 6): the embedding endpoint is remote and resolved by
# `--embedding-provider`.
# Note: the SQLite note repository requires `persistence` SEPARATELY —
# the consumer (CLI binary, MCP example) opts in with `--features persistence`.
persistence = ["webfang_core/persistence"]
# AXTree snapshot tool (#788): forwards to core's chromium gate (mcp→core only,
# no direct chromiumoxide dependency here).
chromium = ["webfang_core/chromium"]

[dependencies]
webfang_core = { workspace = true }

# `FutureExt::catch_unwind` — the load-bearing half of the MCP panic
# containment (#1611, F2). `tokio` has no equivalent for a plain future, so
# `futures` is the only new *declaration* required (already a workspace
# dependency; no new external crate enters the graph).
futures = { workspace = true }

# MCP
rmcp = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
schemars = { workspace = true }
governor = { workspace = true }

# CLI
clap = { workspace = true }

# Async
tokio = { workspace = true }
tokio-util = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Utilities
url = { workspace = true }
wreq = { workspace = true }

[[bin]]
name = "webfang-mcp"
path = "src/bin/mcp_server_http.rs"

[[bin]]
name = "webfang-mcp-stdio"
path = "src/bin/mcp_server_stdio.rs"

[dev-dependencies]
webfang_core = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
schemars = { workspace = true }
insta = { workspace = true }
scraper = { workspace = true }
wiremock = { workspace = true }
proptest = { workspace = true }
serial_test = { workspace = true }
webfang_test_utils = { workspace = true }



[lints]
workspace = true
