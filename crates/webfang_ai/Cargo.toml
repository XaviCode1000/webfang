[package]
name = "webfang_ai"
description = "AI-powered semantic cleaning for webfang"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
webfang_core = { workspace = true }

# Async runtime
tokio = { workspace = true }

# AI features
tokenizers = { workspace = true, optional = true }
unicode-segmentation = { workspace = true }
smallvec = { workspace = true }
wide = { workspace = true }
ort = { workspace = true, optional = true }
ndarray = "0.17"
hf-hub = { workspace = true }

# Utilities
sha2 = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true }
legible = { workspace = true }
num_cpus = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
futures = { workspace = true }
uuid = { workspace = true }
webfang_test_utils = { workspace = true }
# Used by doctests (docs examples return anyhow::Result); cargo-machete does
# not scan dev-dependencies, so this does not reappear as "unused".
anyhow = { workspace = true }



[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
ai = ["dep:ort", "dep:tokenizers"]

# ---------------------------------------------------------------------------
# Benchmarks. Own `main` (`harness = false`), NOT criterion: criterion is not
# a dev-dependency of this crate, adding one is out of scope (#1618), and the
# AI path needs a real ORT session plus a real model file — which a
# timing-only criterion group cannot express anyway. Gated on the `ai`
# feature, so the nightly `cargo bench --locked` lane (no --all-features)
# builds a no-op binary and measures nothing (#1618 PERF-EVID-2).
# ---------------------------------------------------------------------------
[[bench]]
name = "ai_phase_profile"
path = "benches/ai_phase_profile.rs"
harness = false
