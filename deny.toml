[advisories]
# IMPORTANT: Keep this list synchronized with CI cargo audit --ignore flags.
# Each entry must document: crate, version, severity, why safe to ignore, tracking, review date.
#
# NOTE: stale ignores purge (issue #727): removed the 6 entries that
# `cargo deny` reported as advisory-not-detected on 2026-08-16:
#   - RUSTSEC-2026-0194 / 0195 (quick-xml 0.39.4): root cause gone — plist
#     is now 1.10.0, which pulls quick-xml 0.41.0; 0.39.4 no longer in the lock.
#   - RUSTSEC-2026-0097 (tonic), RUSTSEC-2026-0002 (lru), RUSTSEC-2026-0183
#     and RUSTSEC-2026-0184 (git2): crates are still locked, but the RustSec
#     DB criteria no longer match these IDs against them (advisories revised).
# RE-ADD PROTOCOL: if the DB revises an advisory so that a purged ID matches
# the current lock again, `cargo deny` fails loudly and the ignore is re-added
# here with fresh justification — never left purge-listed. Live instance:
# RUSTSEC-2024-0436 (paste) was purged in #1424 as not-detected, then the DB
# criteria were revised and it re-matched paste 1.0.15; re-added below.
ignore = [
    # RUSTSEC-2025-0141 (bincode 1.3.3, severity: unmaintained)
    # Via syntect 5.3.0 (production dep: syntax highlighting for markdown code
    # blocks), which deserializes precompiled syntax dumps with bincode 1.x.
    # Input is deterministic local data, never network input. No maintained
    # 1.x exists; upgrade waits on syntect migrating to bincode 2.
    # Tracking: https://rustsec.org/advisories/RUSTSEC-2025-0141
    # Review date: 2027-03-20
    "RUSTSEC-2025-0141",

    # RUSTSEC-2025-0119 (number_prefix 0.4.0, severity: unmaintained)
    # Via indicatif 0.17 (CLI progress bars). Display formatting only, no
    # security-relevant logic.
    # Tracking: https://rustsec.org/advisories/RUSTSEC-2025-0119
    # Review date: 2027-03-20
    "RUSTSEC-2025-0119",

    # RUSTSEC-2024-0320 (yaml-rust 0.4.5, severity: unmaintained)
    # Via syntect 5.3.0 (YAML syntax definitions, parsed from local data).
    # No runtime network impact.
    # Tracking: https://rustsec.org/advisories/RUSTSEC-2024-0320
    # Review date: 2027-03-20
    "RUSTSEC-2024-0320",

    # RUSTSEC-2025-0052 (async-std 1.13.2, severity: unmaintained)
    # Discontinued upstream. Transitive via chromiumoxide 0.7 behind the
    # optional `chromium` feature of webfang_core (enabled by the benchmark
    # harness, not the default production path). No maintained alternative
    # to chromiumoxide 0.7 at the time of this change.
    # Tracking: https://rustsec.org/advisories/RUSTSEC-2025-0052
    # Review date: 2027-03-20
    "RUSTSEC-2025-0052",

    # RUSTSEC-2024-0436 (paste 1.0.15, severity: unmaintained)
    # No longer maintained. Proc-macro helper via macro_rules_attribute and
    # tokenizers: compile-time codegen only, never ships in the binary.
    # Re-added under the re-add protocol above (purged in #1424, re-matched
    # after the DB criteria revision).
    # Tracking: https://rustsec.org/advisories/RUSTSEC-2024-0436
    # Review date: 2027-03-20
    "RUSTSEC-2024-0436",

    # RUSTSEC-2026-0173 (proc-macro-error2 2.0.1, severity: unmaintained)
    # Via i18n-embed-fl 0.9.4 <- age 0.11.5 (wizard identity encryption in
    # webfang_core). Non-optional age dependency; the author confirmed the
    # crate is unmaintained with no safe upgrade available. Used for
    # compile-time diagnostics only.
    # Tracking: https://rustsec.org/advisories/RUSTSEC-2026-0173
    # Review date: 2027-03-20
    "RUSTSEC-2026-0173",

    # RUSTSEC-2026-0221 (event-listener 5.4.1, severity: unsound)
    # `!Send` tags can cross thread boundaries via `StackSlot`. Transitive
    # via async-lock/async-process <- async-std <- chromiumoxide 0.7 (same
    # optional `chromium` feature path as RUSTSEC-2025-0052); no direct use
    # in webfang code. (Lock also contains event-listener 2.5.3, which the
    # advisory does not match.)
    # Tracking: https://rustsec.org/advisories/RUSTSEC-2026-0221
    # Review date: 2027-03-20
    "RUSTSEC-2026-0221",

    # RUSTSEC-2026-0183 (git2 0.20.4, severity: unsound)
    # Potential UB when calling Remote::list(). Via `built` (build-dependency
    # of webfang_core for compile-time version info): build-time only, the
    # Remote API is never called.
    # Tracking: https://rustsec.org/advisories/RUSTSEC-2026-0183
    # Review date: 2027-03-20
    "RUSTSEC-2026-0183",

    # RUSTSEC-2026-0184 (git2 0.20.4, severity: unsound)
    # Potential UB with Signature from a buffer-created BlameHunk. Same
    # build-time-only path as RUSTSEC-2026-0183 (via `built`); the Blame API
    # is never called.
    # Tracking: https://rustsec.org/advisories/RUSTSEC-2026-0184
    # Review date: 2027-03-20
    "RUSTSEC-2026-0184",

    # RUSTSEC-2026-0253 (lru 0.16.4 + 0.18.1, severity: unsound)
    # Potential use-after-free on panic inside `LruCache::pop()`. Via
    # html-to-markdown-rs (0.16.4) and wreq (0.18.1); both IDs flagged under
    # the single advisory ID. Trigger requires a panicking Drop during pop;
    # neither path runs panicking code inside pop.
    # Tracking: https://rustsec.org/advisories/RUSTSEC-2026-0253
    # Review date: 2027-03-20
    "RUSTSEC-2026-0253",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "OpenSSL",
    "Zlib",
    "CDLA-Permissive-2.0",
    "LGPL-3.0",  # wreq-util (TLS emulation)
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
